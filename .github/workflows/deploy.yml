name: Build & Deploy

# Three editions from one push (see tools/build.mjs):
#   - Yas's own edition  -> Docker image -> our homelab          (runner label: homelab)
#   - Lili's edition     -> Docker image -> Lili's family homelab (runner label: lili-homelab)
#   - the public edition (no Yas, with SEO and a donate button) -> Firebase Hosting
#
# - Push to main      -> deploy all three
# - Push a tag v1.2.3 -> same, plus versioned images and a GitHub Release
# - Run manually      -> deploy all three, or redeploy an existing image tag to both homelabs (rollback)
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Existing image tag to deploy instead of building (e.g. 1.2.0 or sha-<commit>). Leave empty to build.'
        required: false
        default: ''

jobs:
  build:
    if: ${{ !inputs.image_tag }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        edition: [yas, lili]
    env:
      IMAGE: ghcr.io/milad665/${{ matrix.edition }}-games
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: EDITION=${{ matrix.edition }}
          push: true
          # amd64 for regular PCs/NUCs, arm64 for Raspberry Pi
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.edition }}
          cache-to: type=gha,mode=max,scope=${{ matrix.edition }}

  deploy:
    needs: build
    # run even when build was skipped for a manual rollback
    if: ${{ !cancelled() && !failure() }}
    runs-on: [self-hosted, homelab]
    environment: production
    # one deploy at a time per server (a waiting Lili deploy never holds this one up)
    concurrency:
      group: deploy-homelab
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_TAG: ${{ inputs.image_tag || format('sha-{0}', github.sha) }}
      PORT: ${{ vars.HOMELAB_PORT || '8080' }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull and start ${{ env.IMAGE_TAG }}
        run: |
          docker compose -p yas-games -f deploy/docker-compose.yml pull
          docker compose -p yas-games -f deploy/docker-compose.yml up -d --remove-orphans

      - name: Health check
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "http://localhost:${PORT}/healthz"; then exit 0; fi
            sleep 2
          done
          echo "Site did not come up on port ${PORT}" >&2
          docker compose -p yas-games -f deploy/docker-compose.yml logs --tail 50
          exit 1

      - name: Clean up old images
        if: always()
        run: docker image prune -f

  deploy-lili:
    needs: build
    if: ${{ !cancelled() && !failure() }}
    # the runner on Lili's family's server (see docs/homelab-setup.md, "Lili's edition")
    runs-on: [self-hosted, lili-homelab]
    environment: lili
    concurrency:
      group: deploy-lili
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_TAG: ${{ inputs.image_tag || format('sha-{0}', github.sha) }}
      PORT: ${{ vars.LILI_PORT || '8080' }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull and start ${{ env.IMAGE_TAG }}
        run: |
          docker compose -p lili-games -f deploy/docker-compose.lili.yml pull
          docker compose -p lili-games -f deploy/docker-compose.lili.yml up -d --remove-orphans

      - name: Health check
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "http://localhost:${PORT}/healthz"; then exit 0; fi
            sleep 2
          done
          echo "Site did not come up on port ${PORT}" >&2
          docker compose -p lili-games -f deploy/docker-compose.lili.yml logs --tail 50
          exit 1

      - name: Clean up old images
        if: always()
        run: docker image prune -f

  public:
    # a homelab rollback leaves the public site alone
    if: ${{ !inputs.image_tag }}
    runs-on: ubuntu-latest
    environment:
      name: public
      url: ${{ steps.site.outputs.url }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Firebase settings
        id: site
        env:
          PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
          HAS_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
          SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
        run: |
          if [ -z "$PROJECT" ] || [ "$HAS_KEY" != "true" ]; then
            echo "::error::Set the FIREBASE_PROJECT_ID variable and FIREBASE_SERVICE_ACCOUNT secret (see docs/public-site.md)"
            exit 1
          fi
          # the address people use: PUBLIC_SITE_URL, else "url" in editions/public/site.json
          [ -n "$SITE_URL" ] || SITE_URL=$(node -p "require('./editions/public/site.json').url || ''")
          echo "url=${SITE_URL:-https://$PROJECT.web.app}" >> "$GITHUB_OUTPUT"
          # Firebase's own address always works, even before the custom domain's DNS is set up
          echo "firebase=https://$PROJECT.web.app" >> "$GITHUB_OUTPUT"

      - name: Build the public edition
        env:
          SITE_URL: ${{ steps.site.outputs.url }}
          DONATE_URL: ${{ vars.STRIPE_DONATE_URL }}
        run: node tools/build.mjs public

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live

      - name: Health check
        env:
          URL: ${{ steps.site.outputs.firebase }}
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "$URL/" -o page.html && curl -fsS "$URL/sitemap.xml" -o /dev/null; then
              if grep -qiE "(^|[^[:alpha:]])yas" page.html; then echo "::error::The public site mentions Yas" >&2; exit 1; fi
              exit 0
            fi
            sleep 3
          done
          echo "::error::$URL did not come up" >&2
          exit 1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [deploy, public]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
