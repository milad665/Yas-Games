name: Build & Deploy

# - Push to main      -> build image, deploy to the homelab
# - Push a tag v1.2.3 -> same, plus a versioned image and a GitHub Release
# - Run manually      -> optionally redeploy an existing image tag (rollback)
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Existing image tag to deploy instead of building (e.g. 1.2.0 or sha-<commit>). Leave empty to build.'
        required: false
        default: ''

concurrency:
  group: deploy-homelab
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/milad665/yas-games

jobs:
  build:
    if: ${{ !inputs.image_tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # amd64 for regular PCs/NUCs, arm64 for Raspberry Pi
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    # run even when build was skipped for a manual rollback
    if: ${{ !cancelled() && !failure() }}
    runs-on: [self-hosted, homelab]
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_TAG: ${{ inputs.image_tag || format('sha-{0}', github.sha) }}
      PORT: ${{ vars.HOMELAB_PORT || '8080' }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull and start ${{ env.IMAGE_TAG }}
        run: |
          docker compose -p yas-games -f deploy/docker-compose.yml pull
          docker compose -p yas-games -f deploy/docker-compose.yml up -d --remove-orphans

      - name: Health check
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "http://localhost:${PORT}/healthz"; then exit 0; fi
            sleep 2
          done
          echo "Site did not come up on port ${PORT}" >&2
          docker compose -p yas-games -f deploy/docker-compose.yml logs --tail 50
          exit 1

      - name: Clean up old images
        if: always()
        run: docker image prune -f

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
