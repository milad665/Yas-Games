server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # keep redirects relative so they work behind a reverse proxy
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    # pages, scripts, the service worker and data: always check for a newer version
    location ~* \.(html|js|json)$ {
        add_header Cache-Control "no-cache";
    }

    location ~* \.webmanifest$ {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # voice clips get a new ?v= hash whenever they change
    location ~* \.mp3$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
