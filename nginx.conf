server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # keep redirects relative so they work behind a reverse proxy
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    # always fetch fresh pages so new releases show up right away
    location ~* \.(html|webmanifest)$ {
        add_header Cache-Control "no-cache";
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
