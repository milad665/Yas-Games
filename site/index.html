<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Yas's Games">
<meta name="theme-color" content="#ffd6ec">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<title>Yas's Games</title>
<style>
:root { --card: clamp(110px, min(14.5vh, 23vw), 200px); --badge: clamp(56px, min(9vh, 11vw), 96px); }
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; overscroll-behavior: none; }
  body {
    font-family: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", system-ui, sans-serif;
    background: linear-gradient(170deg, #ffd6ec 0%, #e6d9ff 40%, #c9ecff 75%, #d8ffe0 100%);
    background-attachment: fixed; color: #4a3b6b; overflow-x: hidden;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }

  /* floating sky decorations */
  #sky { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .float { position: absolute; line-height: 1; opacity: .85; }
  .cloud { animation: drift linear infinite; }
  .balloon { bottom: -80px; animation: rise linear infinite; }
  .twinkle { animation: twinkle 2.2s ease-in-out infinite; }
  @keyframes drift { from { transform: translateX(-20vw); } to { transform: translateX(120vw); } }
  @keyframes rise { from { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-60vh) rotate(6deg); } to { transform: translateY(-130vh) rotate(-6deg); } }
  @keyframes twinkle { 0%,100% { opacity: .9; scale: 1; } 50% { opacity: .25; scale: .6; } }

  header { position: relative; z-index: 1; text-align: center; margin: 0 0 clamp(4px, 1.5vh, 20px); }
  h1 {
    margin: 0; font-size: clamp(44px, min(9vw, 10vh), 110px); line-height: 1.05; letter-spacing: 1px;
    font-weight: 900;
  }
  h1 .l {
    display: inline-block; animation: wave 2.6s ease-in-out infinite;
    -webkit-text-stroke: 3px #fff; paint-order: stroke fill;
    text-shadow: 0 6px 0 rgba(90, 60, 140, .18);
  }
  h1 .sp { width: .35em; display: inline-block; }
  h1 .sparkle { display: inline-block; font-size: .55em; vertical-align: middle; animation: spin 6s linear infinite; }
  @keyframes wave { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-12px) rotate(-3deg); } }
  @keyframes spin { to { rotate: 360deg; } }

  /* one row per group: a big picture header, then games that scroll sideways */
  main { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: clamp(4px, 1.2vh, 14px); }
  .row { display: flex; align-items: center; gap: clamp(8px, 1.6vw, 18px); }
  .badge {
    flex: none; width: var(--badge); height: var(--badge); border-radius: 50%; display: grid; place-items: center;
    font-size: calc(var(--badge) * .55); background: rgba(255,255,255,.8); border: 5px solid #fff;
    box-shadow: 0 6px 0 rgba(90, 60, 140, .14); animation: bob 3.4s ease-in-out infinite;
  }
  .shelf {
    flex: 1; min-width: 0; display: flex; gap: clamp(26px, 3.4vw, 40px);
    overflow-x: auto; overflow-y: hidden; scroll-snap-type: x proximity; scrollbar-width: none;
    -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain;
    padding: 10px 40px 14px 16px; scroll-padding-left: 16px;
    /* a soft fade on the right edge shows there's more to slide to */
    -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 48px), transparent);
    mask-image: linear-gradient(to right, #000 calc(100% - 48px), transparent);
  }
  .shelf::-webkit-scrollbar { display: none; }
  .game {
    flex: none; width: var(--card); text-decoration: none; color: inherit; display: block; scroll-snap-align: start;
    animation: bob 3.4s ease-in-out infinite; touch-action: manipulation;
  }
  .game:nth-child(2n) { animation-delay: -1.2s; }
  .game:nth-child(3n) { animation-delay: -2.3s; }
  @keyframes bob { 0%,100% { translate: 0 0; } 50% { translate: 0 -8px; } }
  .cover {
    position: relative; aspect-ratio: 1; border-radius: 30%; border: 6px solid #fff; overflow: hidden;
    box-shadow: 0 8px 0 rgba(90, 60, 140, .16), 0 12px 22px rgba(90, 60, 140, .2);
    display: grid; place-items: center; transition: transform .15s;
  }
  .game:active .cover, .game.tapped .cover { transform: scale(.92) rotate(-2deg); }
  .cover .art { font-size: calc(var(--card) * .5); filter: drop-shadow(0 8px 6px rgba(0,0,0,.18)); animation: wiggle 2.8s ease-in-out infinite; }
  @keyframes wiggle { 0%,100% { rotate: -6deg; } 50% { rotate: 6deg; } }
  .cover .extra { position: absolute; font-size: calc(var(--card) * .16); animation: twinkle 3s ease-in-out infinite; }
  .name {
    /* tucked over the bottom edge of the cover to keep rows short */
    position: relative; margin: -14px -14px 0; text-align: center; font-size: clamp(14px, calc(var(--card) * .105), 21px); font-weight: 800;
    background: #fff; border-radius: 999px; padding: 4px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-shadow: 0 5px 0 rgba(90, 60, 140, .12);
  }

  .soon .cover { background: rgba(255,255,255,.45); border-style: dashed; box-shadow: none; }
  .soon .art { opacity: .5; animation: none; }
  .soon .name { opacity: .6; }
  .soon { animation: none; pointer-events: none; }

  /* language + install, top-right */
  #corner { position: fixed; z-index: 5; top: max(14px, env(safe-area-inset-top)); right: max(14px, env(safe-area-inset-right)); display: flex; gap: 10px; }
  .pill { background: rgba(255,255,255,.85); border-radius: 999px; box-shadow: 0 4px 0 rgba(90, 60, 140, .12); border: none; }
  #installBtn { width: 56px; height: 56px; font-size: 28px; touch-action: manipulation; }
  #installBtn[hidden] { display: none; }
  #langs { display: flex; padding: 4px; gap: 2px; }
  #langs button { border: none; background: none; font-size: 30px; width: 46px; height: 46px; border-radius: 50%; opacity: .45; transition: transform .15s, opacity .15s; touch-action: manipulation; padding: 0; }
  #langs button.sel { opacity: 1; transform: scale(1.12); background: #fff3fb; }
  @media (max-width: 960px) { header { margin-top: 64px; } }

  #iosHelp { position: fixed; inset: 0; z-index: 30; background: rgba(60, 40, 100, .35); display: grid; place-items: center; padding: 20px; }
  #iosHelp[hidden] { display: none; }
  #iosHelp .card { background: #fff; border-radius: 32px; padding: 28px 30px; max-width: 420px; text-align: center; font-size: 21px; line-height: 1.4; box-shadow: 0 20px 50px rgba(60, 40, 100, .3); }
  #iosHelp .big { font-size: 64px; }
  #iosHelp .nl { color: #8a7aa8; font-size: 18px; }
  #iosHelp .share { display: inline-block; border: 2px solid #2f9bff; color: #2f9bff; border-radius: 6px; padding: 0 6px; font-size: 16px; }
  #iosHelp .ok { margin-top: 10px; border: none; background: #4ade80; font-size: 36px; width: 80px; height: 80px; border-radius: 50%; box-shadow: 0 6px 0 rgba(0,0,0,.15); }
</style>
</head>
<body>
  <div id="sky" aria-hidden="true"></div>

  <header>
    <h1 id="title" aria-label="Yas's Games"></h1>
  </header>

  <main id="games"></main>

  <div id="corner">
    <button id="installBtn" class="pill" hidden aria-label="Install app">📲</button>
    <div id="langs" class="pill" role="group" aria-label="Language">
      <button data-lang="en" aria-label="English">🇬🇧</button>
      <button data-lang="nl" aria-label="Nederlands">🇳🇱</button>
      <!-- not recorded yet: <button data-lang="de" aria-label="Deutsch">🇩🇪</button> <button data-lang="es" aria-label="Español">🇪🇸</button> -->
      <button data-lang="fa" aria-label="فارسی">🇮🇷</button>
    </div>
  </div>

  <div id="iosHelp" hidden>
    <div class="card">
      <div class="big">📲</div>
      <p>Tap <b>Share</b> <span class="share">⬆︎</span> in Safari, then <b>Add to Home Screen</b>.</p>
      <p class="nl">Tik op <b>Delen</b> <span class="share">⬆︎</span> in Safari en dan <b>Zet op beginscherm</b>.</p>
      <button id="iosHelpClose" class="ok">👍</button>
    </div>
  </div>

<script src="/shared/games.js"></script>
<script src="/shared/lines.js"></script>
<script src="/shared/voice.js"></script>
<script>

  // a friendly "more coming" card so the shelf never looks empty
  const SHOW_COMING_SOON = true;

  const $ = id => document.getElementById(id);
  const rand = (a, b) => a + Math.random() * (b - a);

  // ---- title: bouncy rainbow letters ----
  const palette = ['#ff5c8a', '#ff9f1c', '#f5c400', '#3cc954', '#2f9bff', '#9b5cff'];
  const title = $('title');
  const star = () => { const s = document.createElement('span'); s.className = 'sparkle'; s.textContent = '⭐'; return s; };
  title.appendChild(star());
  let li = 0;
  for (const ch of "Yas's Games") {
    const s = document.createElement('span');
    if (ch === ' ') { s.className = 'sp'; }
    else {
      s.className = 'l'; s.textContent = ch;
      s.style.color = palette[li % palette.length];
      s.style.animationDelay = (li * .13) + 's';
      li++;
    }
    title.appendChild(s);
  }
  title.appendChild(star());

  // ---- game cards ----
  const spots = [[14, 16], [84, 18], [12, 82], [86, 80], [50, 10]];
  function card(g, soon) {
    const a = document.createElement(soon ? 'div' : 'a');
    a.className = 'game' + (soon ? ' soon' : '');
    if (!soon) a.href = g.path;
    const cover = document.createElement('div');
    cover.className = 'cover';
    if (!soon) cover.style.background = `linear-gradient(135deg, ${g.colors.join(', ')})`;
    const art = document.createElement('div');
    art.className = 'art'; art.textContent = g.art;
    cover.appendChild(art);
    (g.extras || []).forEach((e, i) => {
      const x = document.createElement('div');
      x.className = 'extra'; x.textContent = e;
      const [l, t] = spots[i % spots.length];
      x.style.left = `calc(${l}% - .5em)`; x.style.top = `calc(${t}% - .5em)`;
      x.style.animationDelay = -(i * .6) + 's';
      cover.appendChild(x);
    });
    const name = document.createElement('div');
    name.className = 'name'; name.textContent = g.name;
    a.append(cover, name);
    if (!soon) a.addEventListener('click', e => {
      // little pop + squish before we leave
      e.preventDefault();
      a.classList.add('tapped');
      pop();
      setTimeout(() => { location.href = g.path; }, 180);
    });
    return a;
  }
  // one row per group; games without a (known) group get a last row of their own
  const groups = [...(self.GAME_GROUPS || [])];
  const known = new Set(groups.map(gr => gr.id));
  if (GAMES.some(g => !known.has(g.group))) groups.push({ id: null, emoji: '⭐', name: 'More games' });
  let lastShelf = null;
  for (const gr of groups) {
    const games = GAMES.filter(g => (known.has(g.group) ? g.group : null) === gr.id);
    if (!games.length) continue;
    const row = document.createElement('section');
    row.className = 'row'; row.setAttribute('aria-label', gr.name);
    const badge = document.createElement('div');
    badge.className = 'badge'; badge.textContent = gr.emoji; badge.setAttribute('aria-hidden', 'true');
    const shelf = document.createElement('div');
    shelf.className = 'shelf';
    for (const g of games) shelf.appendChild(card(g));
    row.append(badge, shelf);
    $('games').appendChild(row);
    lastShelf = shelf;
  }
  if (SHOW_COMING_SOON && lastShelf) lastShelf.appendChild(card({ name: 'Coming soon', art: '🎁' }, true));

  // ---- sky: drifting clouds, twinkling stars, rising balloons ----
  const sky = $('sky');
  function add(cls, text, css) {
    const d = document.createElement('div');
    d.className = 'float ' + cls; d.textContent = text;
    Object.assign(d.style, css);
    sky.appendChild(d);
  }
  for (let i = 0; i < 4; i++) add('cloud', '☁️', {
    top: rand(4, 70) + '%', fontSize: rand(50, 90) + 'px',
    animationDuration: rand(40, 70) + 's', animationDelay: -rand(0, 70) + 's',
  });
  for (let i = 0; i < 10; i++) add('twinkle', ['✨', '⭐', '💫'][i % 3], {
    left: rand(2, 96) + '%', top: rand(2, 96) + '%', fontSize: rand(16, 30) + 'px',
    animationDelay: -rand(0, 2.2) + 's',
  });
  for (let i = 0; i < 5; i++) add('balloon', '🎈', {
    left: rand(3, 95) + '%', fontSize: rand(34, 54) + 'px',
    animationDuration: rand(18, 30) + 's', animationDelay: -rand(0, 30) + 's',
  });

  // ---- tiny sound ----
  let ac = null;
  function pop() {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
      o.frequency.setValueAtTime(520, t); o.frequency.exponentialRampToValueAtTime(1040, t + .12);
      g.gain.setValueAtTime(.2, t); g.gain.exponentialRampToValueAtTime(.001, t + .15);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + .16);
    } catch (e) {}
  }

  // ---- language: one switch for all games ----
  function paintLangs() {
    document.querySelectorAll('#langs button').forEach(b => b.classList.toggle('sel', b.dataset.lang === Voice.lang));
    document.documentElement.lang = Voice.lang;
  }
  document.querySelectorAll('#langs button').forEach(b => b.addEventListener('click', () => {
    Voice.setLang(b.dataset.lang); paintLangs(); pop(); Voice.say('hub.lang');
  }));
  paintLangs();

  // ---- install as an app (shown to grown-ups in the corner) ----
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  let installEvent = null;
  addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvent = e; $('installBtn').hidden = false; });
  if (!standalone && isIOS) $('installBtn').hidden = false;
  $('installBtn').addEventListener('click', async () => {
    if (installEvent) { installEvent.prompt(); await installEvent.userChoice; installEvent = null; $('installBtn').hidden = true; }
    else $('iosHelp').hidden = false;
  });
  $('iosHelpClose').addEventListener('click', () => { $('iosHelp').hidden = true; });
  addEventListener('appinstalled', () => { $('installBtn').hidden = true; });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});

  // coming back with the browser's back button: un-squish the card
  addEventListener('pageshow', () => document.querySelectorAll('.tapped').forEach(a => a.classList.remove('tapped')));
</script>
</body>
</html>
