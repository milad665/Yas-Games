<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Magic Doodles">
<meta name="theme-color" content="#7ec8ff">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<title>Magic Doodles</title>
<style>
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: none; }
  body { background: #7ec8ff; font-family: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", system-ui, sans-serif; color: #333; }
  .screen { position: fixed; inset: 0; display: none; }
  .screen.on { display: block; }

  /* ---------- buttons ---------- */
  .btn {
    width: 78px; height: 78px; border-radius: 50%; border: none; padding: 0;
    font-size: 40px; line-height: 1; background: #fff; cursor: pointer;
    box-shadow: 0 6px 0 rgba(0,0,0,.18), 0 8px 16px rgba(0,0,0,.12);
    display: grid; place-items: center; touch-action: manipulation;
    transition: transform .08s, box-shadow .08s, opacity .2s;
  }
  .btn:active { transform: translateY(5px); box-shadow: 0 1px 0 rgba(0,0,0,.18); }
  .btn[disabled] { opacity: .35; pointer-events: none; }

  /* ---------- home ---------- */
  #home { background: linear-gradient(160deg, #ffd6ec 0%, #c9e7ff 50%, #d6ffd9 100%); }
  #home h1 {
    margin: 0; padding-top: max(28px, env(safe-area-inset-top)); text-align: center;
    font-size: clamp(44px, 8vw, 88px); letter-spacing: 2px;
    text-shadow: 0 5px 0 rgba(0,0,0,.12);
  }
  #home h1 span { display: inline-block; animation: wave 2.4s ease-in-out infinite; }
  @keyframes wave { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }
  #worldPicks {
    position: absolute; inset: 130px 20px 20px; display: flex; flex-wrap: wrap;
    align-content: center; justify-content: center; gap: clamp(18px, 3vw, 40px);
  }
  .worldPick {
    width: clamp(110px, 15vw, 172px); height: clamp(110px, 15vw, 172px); border-radius: 50%;
    border: 7px solid #fff; font-size: clamp(52px, 7.5vw, 84px); cursor: pointer;
    box-shadow: 0 10px 0 rgba(0,0,0,.15), 0 14px 26px rgba(0,0,0,.15);
    display: grid; place-items: center; animation: bob 3s ease-in-out infinite; touch-action: manipulation;
  }
  .worldPick:active { transform: scale(.92); }
  @keyframes bob { 0%,100% { translate: 0 0 } 50% { translate: 0 -12px } }
  #soundBtn { position: absolute; top: max(16px, env(safe-area-inset-top)); right: 16px; width: 64px; height: 64px; font-size: 32px; }
  #hubBtn { position: absolute; top: max(16px, env(safe-area-inset-top)); left: 16px; width: 64px; height: 64px; font-size: 32px; text-decoration: none; }

  /* ---------- worlds ---------- */
  #world { overflow: hidden; background: #8fd3ff; }
  .layer { position: absolute; inset: 0; }
  #decor { pointer-events: none; }
  #critters { pointer-events: none; }
  #critters .creature { pointer-events: auto; }
  #fx { pointer-events: none; z-index: 4; }
  .fxdot { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 50; border-radius: 50%; }
  .treat { position: absolute; left: 0; top: 0; font-size: 44px; line-height: 1; pointer-events: none; translate: -50% -50%; filter: drop-shadow(0 4px 2px rgba(0,0,0,.25)); }
  #disco {
    position: absolute; inset: -50%; pointer-events: none; z-index: 3; opacity: 0; transition: opacity .6s;
    background: conic-gradient(from 0deg, rgba(255,80,160,.35), rgba(255,220,60,.05), rgba(80,200,255,.35), rgba(140,255,120,.05), rgba(190,100,255,.35), rgba(255,160,60,.05), rgba(255,80,160,.35));
    mix-blend-mode: screen; animation: spin 6s linear infinite;
  }
  #disco.on { opacity: 1; }
  .worldPick { position: relative; overflow: hidden; padding: 0; }
  .worldPick .thumb { position: absolute; inset: 0; }
  .worldPick .icon { position: relative; filter: drop-shadow(0 4px 3px rgba(0,0,0,.25)); }
  @keyframes spin { to { rotate: 360deg } }
  @keyframes sway { 0%,100% { rotate: -8deg } 50% { rotate: 8deg } }

  #tools { position: absolute; top: max(16px, env(safe-area-inset-top)); right: max(16px, env(safe-area-inset-right)); display: flex; gap: 14px; z-index: 5; }
  #tools .btn { width: 72px; height: 72px; font-size: 36px; }
  .btn.t-wiggle { animation: shake .4s; }
  #partyBtn.on { background: linear-gradient(135deg, #ffe066, #ff8ad8, #8ad4ff); }
  #backBtn {
    position: absolute; left: 24px; bottom: max(24px, env(safe-area-inset-bottom)); z-index: 5;
    width: 100px; height: 100px; font-size: 52px; background: #ffe14d; display: none;
  }
  #backBtn.show { display: grid; animation: nudge 1.2s ease-in-out infinite; }
  .broom { position: absolute; left: 0; z-index: 6; pointer-events: none; font-size: 160px; line-height: 1; }

  .creature { position: absolute; left: 0; top: 0; will-change: transform; touch-action: none; }
  .creature .body { width: 100%; height: 100%; position: relative; will-change: transform; }
  .creature img { width: 100%; height: 100%; display: block; pointer-events: none; filter: drop-shadow(0 4px 3px rgba(0,0,0,.25)); }
  .creature.born .body { animation: born .9s cubic-bezier(.3,1.6,.5,1) both; }
  @keyframes born { 0% { scale: 0; rotate: -30deg } 100% { scale: 1; rotate: 0deg } }
  .creature.poof { transition: opacity .3s, scale .3s; opacity: 0; scale: 1.6; }
  .eye {
    position: absolute; border-radius: 50%; background: #fff; border: 3px solid #222;
    transform: translate(-50%, -50%); overflow: hidden; animation: blink 4s infinite;
  }
  .pupil { position: absolute; left: 50%; top: 50%; width: 48%; height: 48%; border-radius: 50%; background: #222; margin: -24% 0 0 -24%; }
  @keyframes blink { 0%, 94%, 100% { scale: 1 1 } 97% { scale: 1 .1 } }

  #homeBtn { position: absolute; top: max(16px, env(safe-area-inset-top)); left: 16px; z-index: 5; }
  #pencilBtn {
    position: absolute; right: 24px; bottom: max(24px, env(safe-area-inset-bottom)); z-index: 5;
    width: 112px; height: 112px; font-size: 60px; background: #ffe14d;
  }
  #pencilBtn.nudge { animation: nudge 1.4s ease-in-out infinite; }
  @keyframes nudge { 0%,100% { scale: 1 } 50% { scale: 1.15 } }
  #trash {
    position: absolute; left: 24px; bottom: max(24px, env(safe-area-inset-bottom)); z-index: 5;
    width: 110px; height: 110px; border-radius: 50%; background: rgba(255,255,255,.85);
    font-size: 56px; display: grid; place-items: center; scale: 0; transition: scale .2s;
    pointer-events: none;
  }
  #trash.show { scale: 1; }
  #trash.hot { scale: 1.3; background: #ff8a8a; }

  .particle { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 50; font-size: 34px; animation: fly .9s ease-out forwards; }
  @keyframes fly {
    0% { transform: translate(var(--x), var(--y)) scale(.4); opacity: 1; }
    100% { transform: translate(calc(var(--x) + var(--dx)), calc(var(--y) + var(--dy))) scale(1.2); opacity: 0; }
  }

  /* ---------- drawing ---------- */
  #draw { background: rgba(255,255,255,.55); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); z-index: 10; display: none; flex-direction: column; }
  #draw.on { display: flex; }
  .bar {
    display: flex; align-items: center; gap: 14px; padding: 14px 20px;
    padding-left: max(20px, env(safe-area-inset-left)); padding-right: max(20px, env(safe-area-inset-right));
  }
  #drawTop { padding-top: max(14px, env(safe-area-inset-top)); }
  .spacer { flex: 1; }
  #closeBtn { background: #ff6b6b; color: #fff; font-size: 38px; }
  #magicBtn { width: 110px; height: 110px; font-size: 62px; background: linear-gradient(135deg, #ffe066, #ff8ad8, #8ad4ff); }
  #magicBtn:not([disabled]) { animation: glow 1.4s ease-in-out infinite; }
  @keyframes glow { 0%,100% { box-shadow: 0 6px 0 rgba(0,0,0,.18), 0 0 0 0 rgba(255,140,220,.7) } 50% { box-shadow: 0 6px 0 rgba(0,0,0,.18), 0 0 0 16px rgba(255,140,220,0) } }
  #paper {
    flex: 1; margin: 0 20px; border-radius: 28px; background: #fff; position: relative;
    box-shadow: 0 8px 30px rgba(0,0,0,.15), inset 0 0 0 6px #ffe7f4; overflow: hidden; min-height: 0;
  }
  #paper.shake { animation: shake .4s; }
  @keyframes shake { 25% { translate: -10px 0 } 50% { translate: 10px 0 } 75% { translate: -6px 0 } }
  #canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  #drawBottom { justify-content: center; flex-wrap: wrap; padding-bottom: max(14px, env(safe-area-inset-bottom)); }
  .swatch {
    width: 62px; height: 62px; border-radius: 50%; border: 5px solid #fff; cursor: pointer;
    box-shadow: 0 4px 0 rgba(0,0,0,.18); transition: transform .12s; touch-action: manipulation; padding: 0;
  }
  .swatch.sel { transform: scale(1.22); border-color: #333; }
  .swatch.rainbow { background: conic-gradient(red, orange, yellow, lime, cyan, blue, magenta, red); }
  .sizes { display: flex; gap: 8px; margin-left: 12px; }
  .size { width: 62px; height: 62px; border-radius: 50%; background: #fff; border: 4px solid transparent; display: grid; place-items: center; box-shadow: 0 4px 0 rgba(0,0,0,.15); touch-action: manipulation; padding: 0; }
  .size.sel { border-color: #333; }
  .size i { display: block; border-radius: 50%; background: #333; }

  /* ---------- move picker ---------- */
  #picker {
    position: fixed; inset: 0; z-index: 20; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 30px; background: rgba(255,240,250,.97);
  }
  #picker.on { display: flex; }
  #pickPreview { max-width: 46vmin; max-height: 36vmin; animation: born .7s cubic-bezier(.3,1.6,.5,1) both; filter: drop-shadow(0 6px 4px rgba(0,0,0,.2)); }
  #moves { display: flex; flex-wrap: wrap; gap: 22px; justify-content: center; padding: 0 20px; }
  .moveBtn { width: 112px; height: 112px; font-size: 60px; }
  .moveBtn.def { box-shadow: 0 6px 0 rgba(0,0,0,.18), 0 0 0 6px #ffd23f; }
  .moveBtn span { display: block; }
  .m-hop span { animation: mhop .8s ease-in-out infinite; }
  .m-fly span { animation: mfly 1.6s ease-in-out infinite; }
  .m-swim span { animation: sway 1.6s ease-in-out infinite; }
  .m-float span { animation: spin 4s linear infinite; }
  .m-crawl span { animation: mcrawl 1s ease-in-out infinite; }
  .m-roll span { animation: spin 1.2s linear infinite; }
  .m-bounce span { animation: mbounce .7s cubic-bezier(.5,0,.5,1) infinite alternate; }
  @keyframes mbounce { from { translate: 0 -18px } to { translate: 0 8px; scale: 1.1 .9 } }
  @keyframes mhop { 0%,100% { translate: 0 0 } 50% { translate: 0 -16px } }
  @keyframes mfly { 0%,100% { translate: -8px 4px } 50% { translate: 8px -8px } }
  @keyframes mcrawl { 0%,100% { scale: 1 1 } 50% { scale: 1.2 .85 } }
</style>
</head>
<body>

<!-- HOME -->
<section id="home" class="screen on">
  <h1 id="title"></h1>
  <a id="hubBtn" class="btn" href="../../" aria-label="Back to Yas's Games">🏠</a>
  <button id="soundBtn" class="btn" aria-label="Sound on or off">🔊</button>
  <div id="worldPicks"></div>
</section>

<!-- WORLD -->
<section id="world" class="screen">
  <div id="backdrop" class="layer"></div>
  <div id="decor" class="layer"></div>
  <div id="critters" class="layer"></div>
  <div id="fx" class="layer"></div>
  <div id="disco"></div>
  <button id="homeBtn" class="btn" aria-label="Home">🏠</button>
  <div id="tools">
    <button id="treatBtn" class="btn" aria-label="Give a treat">🍪</button>
    <button id="partyBtn" class="btn" aria-label="Dance party">🎶</button>
    <button id="cleanBtn" class="btn" aria-label="Clean up">🧹</button>
  </div>
  <button id="backBtn" class="btn" aria-label="Bring them back">↩️</button>
  <button id="pencilBtn" class="btn" aria-label="Draw">✏️</button>
  <div id="trash">🗑️</div>
</section>

<!-- DRAW -->
<section id="draw" class="screen">
  <div id="drawTop" class="bar">
    <button id="closeBtn" class="btn" aria-label="Close">✖</button>
    <button id="undoBtn" class="btn" aria-label="Undo">↩️</button>
    <button id="clearBtn" class="btn" aria-label="Clear">🧽</button>
    <div class="spacer"></div>
    <button id="magicBtn" class="btn" aria-label="Bring to life" disabled>✨</button>
  </div>
  <div id="paper"><canvas id="canvas"></canvas></div>
  <div id="drawBottom" class="bar">
    <div id="swatches" style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"></div>
    <div class="sizes" id="sizes"></div>
  </div>
</section>

<!-- MOVE PICKER -->
<section id="picker">
  <img id="pickPreview" alt="">
  <div id="moves"></div>
</section>

<script src="/shared/lines.js"></script>
<script src="/shared/edition.js"></script>
<script src="/shared/voice.js"></script>
<script src="/shared/saved.js"></script>
<script src="/shared/scenery.js"></script>
<script>
(() => {
  // ================= data =================
  // props: [art, x%, y%, height (% of the short side), extra settings]; see /shared/scenery.js
  const P = (art, x, y, h, o = {}) => ({ art, x, y, h, ...o });
  const WORLDS = {
    meadow: { icon: '🐰', say: 'md.meadow', move: 'hop', ground: .9,
      props: [P('sun', 86, 14, 24, { at: 'center', tap: 'spin' }), P('cloud', 16, 13, 14, { at: 'center', anim: 'drift', tap: 'rain' }),
              P('cloud', 54, 9, 10, { at: 'center', anim: 'drift', tap: 'rain' }), P('fence', 26, 80, 11), P('bush', 6, 82, 12),
              P('tree', 88, 82, 52, { tap: 'apple' }), P('flower', 8, 93, 14, { tap: 'bloom' }), P('flower', 32, 96, 11, { args: ['#ffd23f', '#ff8a3c'], tap: 'bloom' }),
              P('mushroom', 48, 93, 9, { tap: 'boing' }), P('flower', 66, 95, 12, { args: ['#b07aff'], tap: 'bloom' }),
              P('butterfly', 68, 34, 7, { at: 'center', anim: 'flutter' })] },
    castle: { icon: '🏰', say: 'md.castle', move: 'fly', ground: .92,
      props: [P('rainbow', 16, 26, 26, { at: 'center' }), P('cloud', 84, 13, 12, { at: 'center', anim: 'drift', args: ['#fff0fa', '#ffd6ee'], tap: 'rain' }),
              P('castle', 52, 82, 60, { tap: 'fireworks' }), P('blossom', 90, 88, 34, { tap: 'wiggle' }),
              P('sparkle', 80, 30, 5, { at: 'center', anim: 'twinkle' }), P('sparkle', 28, 46, 4, { at: 'center', anim: 'twinkle' }), P('sparkle', 66, 10, 5, { at: 'center', anim: 'twinkle' }),
              P('flower', 8, 94, 12, { args: ['#ff8ad8'], tap: 'bloom' }), P('flower', 24, 96, 10, { args: ['#fff3a0'], tap: 'bloom' }),
              P('butterfly', 30, 60, 6, { at: 'center', anim: 'flutter', args: ['#ffd23f', '#ff6fb5'] })] },
    ocean: { icon: '🐠', say: 'md.ocean', move: 'swim', ground: .94, extras: { bubbles: 16 },
      props: [P('fish', 0, 26, 8, { at: 'center', anim: 'across', dur: 22 }), P('fish', 0, 52, 6, { at: 'center', anim: 'across', dur: 16, delay: -8, args: ['#7ad6ff', '#ffe14d'] }),
              P('jellyfish', 82, 30, 15, { at: 'center', anim: 'bob', tap: 'boing' }), P('rock', 92, 97, 14),
              P('seaweed', 6, 98, 30, { tap: 'wiggle' }), P('coral', 18, 98, 18), P('seaweed', 30, 99, 22, { args: ['#5ad08a'] }),
              P('chest', 56, 98, 15, { tap: 'open' }), P('starfish', 42, 99, 8, { tap: 'spin' }), P('shell', 72, 99, 6, { tap: 'boing' }),
              P('coral', 84, 99, 16, { args: ['#b07aff'] }), P('seaweed', 96, 99, 26, { tap: 'wiggle' })] },
    space: { icon: '🚀', say: 'md.space', move: 'float', ground: .92, extras: { stars: 70, shooting: true },
      props: [P('planet', 82, 22, 24, { at: 'center', anim: 'bob', tap: 'spin' }), P('moon', 14, 16, 18, { at: 'center', tap: 'boing' }),
              P('earth', 66, 72, 17, { at: 'center', tap: 'spin' }), P('ufo', 42, 26, 18, { at: 'center', anim: 'bob', tap: 'beam' }),
              P('rocket', 22, 94, 28, { tap: 'launch' })] },
    dino: { icon: '🦕', say: 'md.dino', move: 'hop', ground: .9,
      props: [P('cloud', 30, 12, 11, { at: 'center', anim: 'drift', tap: 'rain' }), P('ptero', 0, 22, 9, { at: 'center', anim: 'across', dur: 26 }),
              P('volcano', 70, 78, 50, { tap: 'erupt' }), P('palm', 8, 84, 48, { tap: 'wiggle' }), P('palm', 95, 86, 40, { flip: true, tap: 'wiggle' }),
              P('longneck', 34, 82, 32, { tap: 'roar' }), P('egg', 52, 95, 10, { tap: 'hatch' }), P('egg', 58, 96, 8, { args: ['#ffb3c6'], tap: 'hatch' })] },
    jungle: { icon: '🐒', say: 'md.jungle', move: 'crawl', ground: .92,
      props: [P('vine', 6, 0, 46, { at: 'top' }), P('vine', 22, 0, 30, { at: 'top' }), P('vine', 78, 0, 38, { at: 'top' }),
              P('monkey', 38, 0, 46, { at: 'top', tap: 'monkey' }), P('waterfall', 62, 84, 64, { tap: 'splash' }),
              P('parrot', 88, 44, 22, { at: 'center', tap: 'squawk' }), P('butterfly', 30, 60, 6, { at: 'center', anim: 'flutter', args: ['#ffd23f', '#3fd0ff'] }),
              P('bigleaf', 4, 98, 30, { tap: 'wiggle' }), P('flower', 20, 96, 12, { args: ['#ff4d6d'], tap: 'bloom' }), P('bigleaf', 96, 99, 32, { flip: true, args: ['#3fae5a'], tap: 'wiggle' })] },
    snow: { icon: '⛄', say: 'md.snow', move: 'roll', ground: .9, extras: { snow: 60 },
      props: [P('pine', 8, 82, 38, { tap: 'wiggle' }), P('pine', 20, 78, 26), P('pine', 92, 80, 44, { tap: 'wiggle' }),
              P('igloo', 72, 84, 22, { tap: 'peek' }), P('snowman', 40, 88, 32, { tap: 'hat' }), P('penguin', 58, 95, 11, { anim: 'patrol', tap: 'boing' })] },
    candy: { icon: '🍭', say: 'md.candy', move: 'bounce', ground: .9,
      props: [P('cloud', 30, 14, 12, { at: 'center', anim: 'drift', args: ['#ffd1ec', '#ffb3dd'], tap: 'sprinkle' }), P('cloud', 74, 9, 10, { at: 'center', anim: 'drift', args: ['#d8f6ff', '#b8e8ff'], tap: 'sprinkle' }),
              P('lollipop', 10, 86, 42, { tap: 'spin' }), P('candycane', 26, 90, 24, { tap: 'wiggle' }), P('lollipop', 88, 84, 34, { args: ['#7ad6ff', '#fff3a0'], tap: 'spin' }),
              P('cupcake', 70, 90, 22, { tap: 'cherry' }), P('gumdrop', 44, 96, 7, { anim: 'hop', tap: 'boing' }), P('gumdrop', 50, 97, 6, { anim: 'hop', delay: -.5, args: ['#ff6fb5'], tap: 'boing' }),
              P('icecream', 36, 99, 16, { tap: 'boing' }), P('donut', 58, 98, 7, { tap: 'spin' })] },
    farm: { icon: '🐄', say: 'md.farm', move: 'hop', ground: .9,
      props: [P('sun', 50, 12, 16, { at: 'center', tap: 'spin' }), P('cloud', 20, 14, 11, { at: 'center', anim: 'drift', tap: 'rain' }),
              P('barn', 22, 80, 42, { tap: 'loft' }), P('windmill', 86, 78, 52, { tap: 'fast' }), P('fence', 46, 80, 10),
              P('hay', 40, 86, 9, { tap: 'boing' }), P('cow', 66, 90, 18, { tap: 'moo' }), P('chicken', 52, 96, 10, { tap: 'cluck' }),
              P('sunflower', 6, 96, 26, { tap: 'bloom' })] },
    camp: { icon: '⛺', say: 'md.camp', move: 'fly', ground: .9, extras: { stars: 60, fireflies: 14, shooting: true },
      props: [P('moon', 68, 16, 18, { at: 'center', tap: 'boing' }), P('pine', 6, 86, 44, { args: ['#1e3a3a', false] }), P('pine', 95, 84, 50, { args: ['#1e3a3a', false] }),
              P('owl', 88, 44, 20, { at: 'center', tap: 'hoot' }), P('tent', 26, 88, 28, { tap: 'peek' }), P('campfire', 56, 94, 18, { tap: 'flare' }), P('log', 72, 96, 7)] },
  };
  const MOVES = { hop: '🐸', fly: '🦋', swim: '🐟', float: '🎈', crawl: '🐛', roll: '🛞', bounce: '🏀' };
  const COLORS = ['#ff4d4d','#ff9f1c','#ffd60a','#4cd964','#2f9bff','#9b5cff','#ff6fb5','#8b5a2b','#222222','rainbow'];
  const SIZES = [8, 18, 34];
  const MAX_PER_WORLD = 15;
  const SAVE_KEY = EDITION.mine('magicDoodles.v1'); // this child's

  const $ = id => document.getElementById(id);
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];

  // ================= storage =================
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(SAVE_KEY)) || {}; } catch (e) { saved = {}; }
  let muted = !!saved.muted;
  // the drawings themselves live in Saved.pictures (localStorage is too small for them); the save keeps their ids
  function persist() {
    const json = JSON.stringify(saved, function (k, v) { return k === 'img' && this.pic ? undefined : v; });
    try { localStorage.setItem(SAVE_KEY, json); } catch (e) { /* storage full or blocked: keep playing */ }
  }
  const allSaved = () => Object.values(saved).filter(Array.isArray).flat();
  let picsLoaded = false;
  const picsReady = (async () => {
    // older versions kept the drawings in the save itself: move them out
    let moved = false;

  // d = { img, aspect, ex, ey, rel, move, fx, fy }

  function attachPointer(c) {

      if (start) return;
      e.preventDefault();
      c.el.setPointerCapture(e.pointerId);
      start = { x: e.clientX, y: e.clientY, id: e.pointerId };
      off = { x: e.clientX - c.x, y: e.clientY - c.y };
      moved = false;
      c.el.style.zIndex = 3;
    });
    c.el.addEventListener('pointermove', e => {
      if (!start || e.pointerId !== start.id) return;
      if (!moved && Math.hypot(e.clientX - start.x, e.clientY - start.y) > 14) {

      }

  // ---------- animation loop ----------
  let last = performance.now();
  function frame(now) {

  function step(c, dt, ground, now) {

      if (food) {
        const fx = food.x - c.w / 2;
        if (Math.abs(fx - c.x) > 6) c.dir = fx > c.x ? 1 : -1;
        hurry = 2;
        if (c.move === 'fly' || c.move === 'swim') c.targetY = Math.min(floor, food.y - c.h / 2);
        if (c.move === 'float') { const dx = food.x - c.x - c.w / 2, dy = food.y - c.y - c.h / 2, l = Math.hypot(dx, dy) || 1; c.vx += (dx / l * 160 - c.vx) * dt * 2; c.vy += (dy / l * 160 - c.vy) * dt * 2; }
        if (c.move === 'bounce') c.vx = Math.abs(c.vx) * c.dir;
      }
      switch (c.move) {
        case 'hop': {
          c.x += c.dir * c.speed * hurry * dt;
          const s = Math.abs(Math.sin(c.t * 3.4));
          c.y = floor - s * Math.min(130, H * .16);
          if (s < .18) { sx = 1.12; sy = .86; }
          rot = Math.cos(c.t * 3.4) * 6 * c.dir;
          break;
        }
        case 'crawl': {
          c.x += c.dir * c.speed * hurry * dt * (1 + Math.sin(c.t * 6));
          c.y = floor;
          sx = 1 + Math.sin(c.t * 6) * .1; sy = 1 - Math.sin(c.t * 6) * .1;
          break;
        }
        case 'fly': case 'swim': {
          const fly = c.move === 'fly';
          c.x += c.dir * c.speed * hurry * dt;
          if (!food && Math.random() < dt * .3) c.targetY = rand(H * (fly ? .05 : .15), Math.min(floor, H * (fly ? .6 : .8)));
          c.baseY += (c.targetY - c.baseY) * dt * (food ? 2 : .6);
          c.y = c.baseY + Math.sin(c.t * (fly ? 2.4 : 1.6)) * (fly ? 40 : 22);
          rot = fly ? Math.sin(c.t * 9) * 7 : Math.sin(c.t * 1.6) * 10;
          if (fly) sy = 1 + Math.sin(c.t * 18) * .04;
          break;
        }
        case 'float': {
          c.x += c.vx * dt; c.y += c.vy * dt;
          if (c.y < 0) { c.y = 0; c.vy = Math.abs(c.vy); }
          if (c.y > H - c.h) { c.y = H - c.h; c.vy = -Math.abs(c.vy); }
          if (c.x < 0) c.vx = Math.abs(c.vx);
          if (c.x > W - c.w) c.vx = -Math.abs(c.vx);
          c.dir = c.vx < 0 ? -1 : 1;
          c.rot += dt * 35; rot = c.rot;
          break;
        }
        case 'roll': {
          const step = c.dir * c.speed * hurry * dt;
          c.x += step; c.y = floor;
          c.rot += step / (Math.min(c.w, c.h) / 2) * 57.3; rot = c.rot * c.dir;
          break;
        }
        case 'bounce': {
          c.vy += 1500 * dt; c.x += c.vx * hurry * dt; c.y += c.vy * dt;
          if (c.y >= floor) { c.y = floor; c.vy = -Math.sqrt(2 * 1500 * H * c.jump); c.squash = .14; }
          if (c.x < 0) c.vx = Math.abs(c.vx);
          if (c.x > W - c.w) c.vx = -Math.abs(c.vx);
          c.dir = c.vx < 0 ? -1 : 1;
          if (c.squash > 0) { c.squash -= dt; sx = 1.25; sy = .78; }
          else { const k = Math.min(.15, Math.abs(c.vy) / 6000); sx = 1 - k; sy = 1 + k; }
          rot = c.vx * .03;
          break;
        }
      }
      if (c.move !== 'float' && c.move !== 'bounce') {
        if (c.x < 0) { c.x = 0; c.dir = 1; }
        if (c.x > W - c.w) { c.x = W - c.w; c.dir = -1; }
      }
      // falling back down after being dropped
      if (c.fall < 0) {
        c.fallV += 1800 * dt; c.fall = Math.min(0, c.fall + c.fallV * dt);
        if (c.fall === 0) { c.fallV = 0; sx = 1.2; sy = .8; }
        yOff = c.fall;
      } else c.fall = 0;
    } else {
      sx = 1.1; sy = 1.1; rot = Math.sin(now / 80) * 8; // wiggle while carried
    }
    if (partyOn) {
      const beat = (now - partyStart) / 500 * Math.PI; // two bounces a second, everyone together
      yOff -= Math.abs(Math.sin(beat)) * Math.min(60, c.h * .35);
      rot += Math.sin(beat) * 14;
      sx *= 1 + Math.cos(beat * 2) * .06; sy *= 1 - Math.cos(beat * 2) * .06;
    }
    if (c.react > 0) {
      c.react = Math.max(0, c.react - dt * 1.6);
      yOff -= Math.sin(Math.PI * (1 - c.react)) * 70;
      const k = 1 + .2 * Math.sin(Math.PI * (1 - c.react));
      sx *= k; sy *= k; rot += Math.sin(c.react * 20) * 15;
    }
    c.el.style.transform = `translate(${c.x}px, ${c.y + yOff}px)`;
    c.body.style.transform = `scale(${sx * c.dir}, ${sy}) rotate(${rot * c.dir}deg)`;

    // eyes look at your finger (or where they're going)
    const ex = c.x + c.d.ex * c.w, eyY = c.y + yOff + c.eyeY;
    let tx, ty;
    if (lookAt && now - lookTime < 3000) { tx = lookAt.x; ty = lookAt.y; }
    else { tx = ex + c.dir * 200; ty = eyY + Math.sin(c.t) * 60; }
    let vx = tx - ex, vy = ty - eyY; const len = Math.hypot(vx, vy) || 1;
    const m = c.eyeR * .45;
    vx = vx / len * m * c.dir; vy = vy / len * m;
    for (const p of c.pupils) p.style.transform = `translate(${vx}px, ${vy}px)`;
  }
  requestAnimationFrame(frame);

  addEventListener('resize', () => {
    if (!worldKey) return;
    const ow = W, oh = H;
    W = $('world').clientWidth || innerWidth; H = $('world').clientHeight || innerHeight;
    for (const c of creatures) { c.x *= W / ow; c.y *= H / oh; c.baseY *= H / oh; c.targetY *= H / oh; }
    if (W !== ow || H !== oh) buildDecor(WORLDS[worldKey]);
    if ($('draw').classList.contains('on')) sizeCanvas();
  });

  // ================= treats: drop one and everybody races for it =================
  const FOODS = ['🍪', '🍓', '🍎', '🧁', '🍌', '🍉', '🥕', '🍩', '🍒'];
  let treats = [];
  function dropTreat(x, y, kind) {
    if (treats.length >= 4) return;
    const el = document.createElement('div');
    el.className = 'treat';
    if (kind === 'apple') { const a = Scenery.art('apple'); el.innerHTML = a.svg; el.style.width = '44px'; el.style.height = '48px'; }
    else el.textContent = kind || pick(FOODS);
    $('fx').appendChild(el);
    const t = { el, x, y, vy: 0, landed: false, born: performance.now() };
    treats.push(t); placeTreat(t);
    sfx.drop();
  }
  const placeTreat = t => { t.el.style.transform = `translate(${t.x}px, ${t.y}px)`; };
  function stepTreats(dt, ground) {
    const g = worldKey === 'ocean' ? 300 : worldKey === 'space' ? 250 : 1600, maxV = worldKey === 'ocean' ? 140 : 2000;
    for (const t of treats) {
      if (t.landed) continue;
      t.vy = Math.min(maxV, t.vy + g * dt); t.y += t.vy * dt;
      if (t.y >= ground - 24) {
        t.y = ground - 24;
        if (t.vy > 300) { t.vy = -t.vy * .35; } else { t.vy = 0; t.landed = true; }
      }
      placeTreat(t);
    }
    // nobody came for it? it fades away after a while
    const now = performance.now();
    for (const t of treats) if (now - t.born > 20000) removeTreat(t);
  }
  function nearestTreat(c) {
    let best = null, bd = Infinity;
    for (const t of treats) { const d = Math.abs(t.x - c.x - c.w / 2) + Math.abs(t.y - c.y - c.h / 2) * .5; if (d < bd) { bd = d; best = t; } }
    return best;
  }
  function eatTreats() {
    for (const t of [...treats]) for (const c of creatures) {
      if (c.dragging) continue;
      if (Math.hypot(t.x - c.x - c.w / 2, t.y - c.y - c.h / 2) < Math.max(c.w, c.h) * .5 + 20) {
        removeTreat(t);
        c.react = 1; sfx.nom();
        const r = $('world').getBoundingClientRect();
        burst(r.left + t.x, r.top + t.y, ['💖', '✨', '😋'], 7, 100);
        if (Math.random() < .5) say('md.yum');
        break;
      }
    }
  }
  function removeTreat(t) { treats = treats.filter(o => o !== t); t.el.remove(); }
  function clearTreats() { treats.forEach(t => t.el.remove()); treats = []; }
  $('treatBtn').onclick = () => {
    sfx.pop();
    if (!creatures.length) { Scenery.react($('treatBtn'), 't-wiggle', 600); $('pencilBtn').classList.add('nudge'); return; }
    dropTreat(rand(.15, .85) * W, -40);
  };

  // ================= dance party =================
  let partyOn = false, partyStart = 0, partyTimer = null;
  const SONG = [[523, 0], [659, .25], [784, .5], [659, .75], [880, 1], [784, 1.25], [659, 1.5], [587, 1.75]];
  function startParty() {
    if (partyOn) return;
    partyOn = true; partyStart = performance.now();
    $('disco').classList.add('on'); $('partyBtn').classList.add('on');
    say('md.party');
    for (let bar = 0; bar < 4; bar++) {
      const shift = [1, 1.122, 1.335, 1][bar];
      SONG.forEach(([f, t]) => tone(f * shift, .22, { type: 'triangle', vol: .09, delay: .6 + bar * 2 + t }));
      [0, .5, 1, 1.5].forEach(t => tone(130.8 * shift, .2, { type: 'square', vol: .05, delay: .6 + bar * 2 + t }));
    }
    const confetti = setInterval(() => {
      if (!partyOn) return clearInterval(confetti);
      const x = rand(0, innerWidth);
      const el = dot(x, -20, 12, pick(['#ff4d6d', '#ffd60a', '#4cd964', '#2f9bff', '#9b5cff', '#ff8ad8']),
        [{ transform: 'translate(0,0) rotate(0)' }, { transform: `translate(${rand(-80, 80)}px, ${innerHeight + 40}px) rotate(${rand(360, 900)}deg)` }],
        { duration: rand(2200, 3600), easing: 'linear' });
      el.style.borderRadius = '2px'; el.style.height = '7px';
    }, 70);
    partyTimer = setTimeout(endParty, 8800);
  }
  function endParty() {
    clearTimeout(partyTimer);
    partyOn = false;
    $('disco').classList.remove('on'); $('partyBtn').classList.remove('on');
  }
  $('partyBtn').onclick = () => { if (partyOn) { endParty(); return; } sfx.pop(); startParty(); };

  // ================= clean up: sweep everyone away (with a way back) =================
  let swept = null, undoTimer = null;
  function hideUndo() { clearTimeout(undoTimer); $('backBtn').classList.remove('show'); swept = null; }
  $('cleanBtn').onclick = () => {
    if (!creatures.length) { sfx.boing(); Scenery.react($('cleanBtn'), 't-wiggle', 600); return; }
    hideUndo();
    sfx.sweep();
    const broom = document.createElement('div');
    broom.className = 'broom'; broom.textContent = '🧹';
    broom.style.top = (WORLDS[worldKey].ground * H - 170) + 'px';
    $('world').appendChild(broom);
    broom.animate([{ transform: 'translateX(-200px) rotate(-20deg)' }, { transform: `translateX(${W * .5}px) rotate(20deg)`, offset: .5 }, { transform: `translateX(${W + 200}px) rotate(-20deg)` }],
      { duration: 1300, easing: 'ease-in-out' });
    setTimeout(() => broom.remove(), 1350);
    const gone = creatures;
    swept = { key: worldKey, list: gone.map(c => ({ ...c.d, fx: c.x / W, fy: c.y / H })) };
    creatures = [];
    gone.forEach(c => {
      const delay = Math.max(0, c.x / W) * 600;
      c.el.animate([{ translate: '0 0', rotate: '0deg', opacity: 1 }, { translate: `${W - c.x + 200}px ${-rand(40, 200)}px`, rotate: rand(360, 720) + 'deg', opacity: 0 }],
        { duration: 800, delay, easing: 'ease-in', fill: 'forwards' });
      setTimeout(() => c.el.remove(), delay + 850);
      setTimeout(() => burst(c.x + c.w / 2, c.y + c.h / 2, ['💨', '✨'], 5, 80), delay);
    });
    clearTreats();
    saveWorld();
    $('pencilBtn').classList.add('nudge');
    setTimeout(() => say('md.allClean'), 900);
    const keep = swept;
    setTimeout(() => {
      if (swept !== keep) return;
      $('backBtn').classList.add('show');
      undoTimer = setTimeout(hideUndo, 9000);
    }, 1200);
  };
  $('backBtn').onclick = () => {
    if (!swept || swept.key !== worldKey) { hideUndo(); return; }
    const list = swept.list;
    hideUndo();
    sfx.magic();
    list.forEach(d => spawn(d, true));
    while (creatures.length > MAX_PER_WORLD) removeCreature(creatures[0]);
    saveWorld();
    $('pencilBtn').classList.remove('nudge');
    say('md.comeBack');
  };

  // ================= friends say hello when they bump into each other =================
  function greet(now) {
    for (let i = 0; i < creatures.length; i++) for (let j = i + 1; j < creatures.length; j++) {
      const a = creatures[i], b = creatures[j];
      if (a.dragging || b.dragging || now < (a.greetAt || 0) || now < (b.greetAt || 0)) continue;
      const ax = a.x + a.w / 2, ay = a.y + a.h / 2, bx = b.x + b.w / 2, by = b.y + b.h / 2;
      if (Math.hypot(ax - bx, ay - by) < (Math.min(a.w, a.h) + Math.min(b.w, b.h)) * .4) {
        a.greetAt = b.greetAt = now + 6000;
        a.react = b.react = .8;
        sfx.hello();
        burst((ax + bx) / 2, Math.min(ay, by) - 20, ['💕', '💖', '👋'], 5, 70);
      }
    }
  }

  $('homeBtn').onclick = () => { sfx.pop(); if (worldKey) saveWorld(); endParty(); clearTreats(); hideUndo(); worldKey = null; show('home'); };
  $('pencilBtn').onclick = () => { sfx.pop(); openDraw(); };

  // ================= drawing =================
  const cv = $('canvas'), ctx = cv.getContext('2d');
  let strokes = [];       // { color, size, pts: [{x,y,h}] } in 0..1 paper coords
  let cur = null, curId = null;
  let color = COLORS[0], size = SIZES[1], hue = 0, dpr = 1;

  COLORS.forEach((col, i) => {
    const b = document.createElement('button');
    b.className = 'swatch' + (col === 'rainbow' ? ' rainbow' : '') + (i === 0 ? ' sel' : '');
    if (col !== 'rainbow') b.style.background = col;
    b.onclick = () => {
      color = col; sfx.color(i);
      document.querySelectorAll('.swatch').forEach(s => s.classList.toggle('sel', s === b));
    };
    $('swatches').appendChild(b);
  });
  SIZES.forEach((s, i) => {
    const b = document.createElement('button');
    b.className = 'size' + (s === size ? ' sel' : '');
    const dot = document.createElement('i');
    dot.style.width = dot.style.height = Math.max(8, s * .9) + 'px';
    b.appendChild(dot);
    b.onclick = () => {
      size = s; tone(300 + i * 200, .1);
      document.querySelectorAll('.size').forEach(x => x.classList.toggle('sel', x === b));
    };
    $('sizes').appendChild(b);
  });

  function openDraw() {
    $('draw').classList.add('on');
    requestAnimationFrame(() => { sizeCanvas(); });
    if (!strokes.length) say('md.drawAnything');
  }
  function closeDraw() { $('draw').classList.remove('on'); }

  function sizeCanvas() {
    const r = $('paper').getBoundingClientRect();
    dpr = Math.min(2, devicePixelRatio || 1);
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
    redraw();
  }
  function lineWidth(s) { return s * dpr * Math.max(.8, Math.min(cv.width, cv.height) / (700 * dpr)); }
  function segColor(st, p) { return st.color === 'rainbow' ? `hsl(${p.h},95%,55%)` : st.color; }
  function drawSeg(st, a, b) {
    ctx.strokeStyle = segColor(st, b);
    ctx.lineWidth = lineWidth(st.size);
    ctx.lineCap = ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(a.x * cv.width, a.y * cv.height);
    ctx.lineTo(b.x * cv.width, b.y * cv.height);
    ctx.stroke();
  }
  function drawDot(st, p) {
    ctx.fillStyle = segColor(st, p);
    ctx.beginPath(); ctx.arc(p.x * cv.width, p.y * cv.height, lineWidth(st.size) / 2, 0, Math.PI * 2); ctx.fill();
  }
  function redraw() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    for (const st of strokes) {
      drawDot(st, st.pts[0]);
      for (let i = 1; i < st.pts.length; i++) drawSeg(st, st.pts[i - 1], st.pts[i]);
    }
    $('magicBtn').disabled = strokes.length === 0;
  }
  function paperPt(e) {
    const r = cv.getBoundingClientRect();
    if (color === 'rainbow') hue = (hue + 4) % 360;
    return { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height, h: hue };
  }
  cv.addEventListener('pointerdown', e => {
    if (cur) return;
    e.preventDefault();
    cv.setPointerCapture(e.pointerId);
    curId = e.pointerId;
    cur = { color, size, pts: [paperPt(e)] };
    strokes.push(cur);
    drawDot(cur, cur.pts[0]);
    $('magicBtn').disabled = false;
  });
  cv.addEventListener('pointermove', e => {
    if (!cur || e.pointerId !== curId) return;
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (const ev of (evs.length ? evs : [e])) {
      const p = paperPt(ev), prev = cur.pts[cur.pts.length - 1];
      cur.pts.push(p); drawSeg(cur, prev, p);
    }
  });
  const stopStroke = e => { if (e.pointerId === curId) { cur = null; curId = null; } };
  cv.addEventListener('pointerup', stopStroke);
  cv.addEventListener('pointercancel', stopStroke);

  $('undoBtn').onclick = () => { if (strokes.length) { strokes.pop(); redraw(); tone(400, .12, { to: 250 }); } };
  $('clearBtn').onclick = () => {
    if (!strokes.length) return;
    strokes = []; redraw(); sfx.wipe();
    const p = $('paper'); p.classList.remove('shake'); void p.offsetWidth; p.classList.add('shake');
  };
  $('closeBtn').onclick = () => { sfx.pop(); closeDraw(); }; // drawing is kept for next time

  // crop the drawing to its edges, and find a good spot for the eyes
  function capture() {
    const w = cv.width, h = cv.height;
    const data = ctx.getImageData(0, 0, w, h).data;
    let minX = w, minY = h, maxX = -1, maxY = -1;
    for (let y = 0; y < h; y += 2) for (let x = 0; x < w; x += 2) {
      if (data[(y * w + x) * 4 + 3] > 20) {
        if (x < minX) minX = x; if (x > maxX) maxX = x;
        if (y < minY) minY = y; if (y > maxY) maxY = y;
      }
    }
    if (maxX < 0) return null;
    const pad = 4 * dpr;
    minX = Math.max(0, minX - pad); minY = Math.max(0, minY - pad);
    maxX = Math.min(w, maxX + pad); maxY = Math.min(h, maxY + pad);
    const bw = maxX - minX, bh = maxY - minY;
    const k = Math.min(1, 360 / Math.max(bw, bh));
    const out = document.createElement('canvas');
    out.width = Math.max(1, Math.round(bw * k)); out.height = Math.max(1, Math.round(bh * k));
    const octx = out.getContext('2d');
    octx.drawImage(cv, minX, minY, bw, bh, 0, 0, out.width, out.height);

    const od = octx.getImageData(0, 0, out.width, out.height).data;
    let sx = 0, sy = 0, n = 0;
    const top = out.height * .45;
    for (let y = 0; y < top; y++) for (let x = 0; x < out.width; x += 2) {
      if (od[(y * out.width + x) * 4 + 3] > 20) { sx += x; sy += y; n++; }
    }
    const ex = n ? sx / n / out.width : .5;
    const ey = n ? sy / n / out.height : .3;
    return {
      img: out.toDataURL('image/png'),
      aspect: out.height / out.width,
      ex: Math.min(.85, Math.max(.15, ex)), ey: Math.max(.08, ey),
      rel: Math.max(bw / w, bh / h),
    };
  }

  let pending = null;
  $('magicBtn').onclick = () => {
    pending = capture();
    if (!pending) return;
    sfx.magic();
    const r = $('magicBtn').getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, ['✨','⭐','🌟'], 12, 160);
    $('pickPreview').src = pending.img;
    const def = WORLDS[worldKey].move;
    const moves = $('moves'); moves.innerHTML = '';
    for (const [m, icon] of Object.entries(MOVES)) {
      const b = document.createElement('button');
      b.className = 'btn moveBtn m-' + m + (m === def ? ' def' : '');
      b.innerHTML = '<span>' + icon + '</span>';
      b.setAttribute('aria-label', m);
      b.onclick = () => release(m);
      moves.appendChild(b);
    }
    $('picker').classList.add('on');
    say('md.howMove');
  };

  function release(move) {
    $('picker').classList.remove('on');
    closeDraw();
    const d = { ...pending, move, fx: null, fy: null, pic: Saved.pictures.newId() };
    pending = null;
    // if the drawing can't be stored on its own, it stays in the save
    const id = d.pic;
    Saved.pictures.put(id, d.img).then(ok => {
      if (ok) return;
      delete d.pic; allSaved().forEach(o => { if (o.pic === id) delete o.pic; }); persist();
    });
    strokes = []; redraw();
    const c = spawn(d, true);
    // appear in the middle of the screen
    c.x = W / 2 - c.w / 2; c.y = H * .4 - c.h / 2;
    c.baseY = c.targetY = c.y;
    const ground = WORLDS[worldKey].ground * H;
    if (onGround(move)) { c.fall = c.y - (ground - c.h); c.fallV = -300; }
    sfx.magic();
    burst(W / 2, H * .4, ['✨','⭐','🌟','💖','🎉'], 18, 220);
    say(['md.alive1', 'md.alive2', 'md.alive3', 'md.alive4']);
    $('pencilBtn').classList.remove('nudge');

    // too many friends in one world: the oldest one waves goodbye
    while (creatures.length > MAX_PER_WORLD) removeCreature(creatures[0]);
    saveWorld();
  }

  // stop iPad pinch-zoom and double-tap zoom from getting in the way
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('dblclick', e => e.preventDefault());
  document.addEventListener('contextmenu', e => e.preventDefault());
})();
</script>
</body>
</html>
