<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Feelings Friends">
<meta name="theme-color" content="#fbcfe8">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/shared/kit.css">
<title>Feelings Friends</title>
<style>
  body { background: linear-gradient(160deg, #fce7f3 0%, #fbcfe8 40%, #ddd6fe 100%); }
  #game { flex-direction: column; align-items: center; padding: max(14px, env(safe-area-inset-top)) 16px max(14px, env(safe-area-inset-bottom)); gap: 2vh; }
  #hearts { position: absolute; top: max(24px, env(safe-area-inset-top)); left: 50%; translate: -50% 0; font-size: 28px; background: rgba(255,255,255,.8); border-radius: 999px; padding: 4px 16px; min-height: 46px; max-width: 50vw; text-align: center; }

  /* a soft cartoon sky all around, and a little scene for every story */
  #sky { position: fixed; inset: 0; z-index: 0; }
  #sky > div { position: absolute; inset: 0; }
  #skyDecor { pointer-events: none; }
  #hearts { z-index: 2; }
  #choices, #builder { position: relative; z-index: 1; }
  #stage {
    margin-top: 80px; flex: 1; width: min(94vw, 900px); max-height: 50vh; min-height: 0; position: relative; z-index: 1;
    background: #fff; border-radius: 40px; border: 6px solid #fff; box-shadow: 0 10px 30px rgba(190, 24, 93, .18);
  }
  #scenery { position: absolute; inset: 0; border-radius: 34px; overflow: hidden; }
  #scenery > div { position: absolute; inset: 0; }
  #sceneDecor { pointer-events: none; }
  .ff-rain { animation: ff-rain .7s linear infinite; }
  @keyframes ff-rain { to { transform: translate(-30px, 120px); } }
  #mirror { position: absolute; left: 50%; top: 50%; width: calc(min(42vh, 60vw) * 1.2); aspect-ratio: 1; translate: -50% -50%; pointer-events: none; }
  #mirror svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .thing { position: absolute; translate: -50% -50%; line-height: 1; }
  .hero { animation: kit-bob 2.4s ease-in-out infinite; }
  .hero.cheer { animation: cheer .8s cubic-bezier(.3,1.5,.5,1) 2; }
  @keyframes cheer { 40% { transform: translateY(-25%) rotate(-8deg) scale(1.1); } }
  .fall { animation: fall 1s ease-in forwards; }
  @keyframes fall { to { transform: translateY(120%) rotate(120deg); } }
  .shake { animation: kit-shake .5s 3; }
  #bubble {
    position: absolute; translate: -50% -100%; background: #fff; border-radius: 26px; padding: 4px 14px; font-size: 56px; line-height: 1.2;
    box-shadow: 0 6px 0 rgba(0,0,0,.1); display: none;
  }
  #bubble::after { content: ''; position: absolute; bottom: -12px; left: 50%; translate: -50% 0; border: 12px solid transparent; border-top-color: #fff; border-bottom: 0; }
  #bubble.on { display: block; animation: kit-pop .4s cubic-bezier(.3,1.6,.5,1); }

  #choices { display: flex; gap: clamp(10px, 2.5vw, 26px); justify-content: center; flex-wrap: wrap; min-height: 130px; align-items: center; }
  .feel { width: clamp(96px, 14vw, 128px); height: clamp(96px, 14vw, 128px); font-size: clamp(58px, 9vw, 80px); }
  .help { width: clamp(110px, 16vw, 140px); height: clamp(110px, 16vw, 140px); border-radius: 34px; font-size: clamp(60px, 9vw, 84px); }
  .glow { box-shadow: 0 6px 0 rgba(40,50,90,.18), 0 0 0 6px #fde047; animation: kit-pulse 1s infinite; }

  /* face builder */
  #face { width: min(42vh, 60vw); aspect-ratio: 1; position: absolute; left: 50%; top: 50%; translate: -50% -50%; }
  #face svg, .part svg { width: 100%; height: 100%; display: block; }
  #parts { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .partRow { display: flex; gap: 10px; background: rgba(255,255,255,.6); border-radius: 24px; padding: 6px 10px; }
  .part { width: clamp(52px, 14.5vw, 74px); height: clamp(52px, 14.5vw, 74px); border-radius: 20px; background: #fff; border: 4px solid transparent; padding: 2px; touch-action: manipulation; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,.1); }
  .part.sel { border-color: #ec4899; }
  .faceRow { display: flex; gap: 14px 20px; align-items: center; flex-wrap: wrap; justify-content: center; max-width: 100%; }
  #checkBtn { width: 100px; height: 100px; font-size: 52px; background: #4ade80; }
  .hidden { display: none !important; }
  .ff-flag { transform-box: fill-box; transform-origin: 50% 0; animation: ff-flag 2.6s ease-in-out infinite; }
  @keyframes ff-flag { 0%,100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }
</style>
</head>
<body>

<section id="game" class="screen on">
  <div id="sky"><div id="skyBack"></div><div id="skyDecor"></div></div>
  <a class="btn corner left" href="../../" aria-label="Back to Yas's Games">🏠</a>
  <button id="soundBtn" class="btn corner right" aria-label="Sound on or off">🔊</button>
  <div id="hearts"></div>
  <div id="stage"><div id="scenery"><div id="sceneBack"></div><div id="sceneDecor"></div></div><div id="bubble"></div></div>
  <div id="choices"></div>
  <div class="faceRow hidden" id="builder"><div id="parts"></div><button id="checkBtn" class="btn" aria-label="Done">✅</button></div>
</section>

<script src="/shared/lines.js"></script>
<script src="/shared/edition.js"></script>
<script src="/shared/voice.js"></script>
<script src="/shared/saved.js"></script>
<script src="/shared/kit.js"></script>
<script src="/shared/scenery.js"></script>
<script>
(() => {
  const { $, pick, shuffle, sleep } = Kit;

  const FEELINGS = { happy: '😊', sad: '😢', angry: '😠', scared: '😨', surprised: '😮' };

  // each story: hero, scenery [emoji, x%, y%, size vmin, class], feelings that fit, kind helps, one unkind choice
  const STORIES = [
    { id: 1, hero: '🐰', things: [['🍦', 62, 62, 14, 'fall']], feel: ['sad', 'angry'], help: ['🍦', '🤗'], unkind: '😂' },
    { id: 2, hero: '🐻', things: [['🎂', 66, 62, 16], ['🎈', 82, 28, 10], ['🎉', 20, 24, 10]], feel: ['happy'] },
    { id: 3, hero: '🐱', things: [['⛈️', 70, 22, 16, 'shake'], ['⚡', 46, 30, 9, 'shake']], feel: ['scared'], help: ['🤗', '🧸'], unkind: '📢' },
    { id: 4, hero: '🐶', things: [['🧱', 62, 72, 9, 'fall'], ['🧱', 70, 60, 9, 'fall'], ['🧱', 76, 72, 9, 'fall']], feel: ['angry', 'sad'], help: ['🧱', '🌬️'], unkind: '💥' },
    { id: 5, hero: '🐸', things: [['🎁', 64, 62, 14], ['🤡', 64, 32, 12]], feel: ['surprised', 'scared'] },
    { id: 6, hero: '🐼', things: [['🛝', 72, 56, 18]], feel: ['sad'], help: ['🤝', '⚽'], unkind: '🙈' },
    { id: 7, hero: '🦊', things: [['🌑', 72, 26, 14], ['🕸️', 24, 22, 10]], feel: ['scared'], help: ['🔦', '🤗'], unkind: '👻' },
    { id: 8, hero: '🐷', things: [['💥', 66, 34, 14]], feel: ['surprised', 'sad'], help: ['🎈', '🤗'], unkind: '😂' },
    { id: 9, hero: '🐯', things: [['🍪', 74, 50, 12, 'fall'], ['🐵', 86, 56, 14]], feel: ['angry'], help: ['🗣️', '🍪'], unkind: '👊' },
    { id: 10, hero: '🦄', things: [['🎨', 66, 64, 14], ['🖼️', 70, 32, 14], ['⭐', 86, 22, 8]], feel: ['happy'] },
    { id: 11, hero: '🐭', things: [['🐈‍⬛', 72, 52, 22]], feel: ['scared'], help: ['🏠', '🤗'], unkind: '📢' },
    { id: 12, hero: '🐨', things: [['🌈', 66, 28, 22], ['☀️', 88, 18, 10]], feel: ['surprised', 'happy'] },
  ];

  // ---------- where each little story happens (cartoon scenery; see /shared/scenery.js) ----------
  // props stay at the edges so the friend (left) and the story things (right) are clear
  const P = (art, x, y, h, o = {}) => ({ art, x, y, h, ...o });
  const SCENES = {
    park: { back: 'meadow', props: [P('tree', 7, 82, 52, { tap: 'wiggle' }), P('cloud', 48, 13, 12, { at: 'center', anim: 'drift', tap: 'boing' }),
      P('flower', 16, 99, 13, { tap: 'bloom' }), P('flower', 95, 99, 11, { args: ['#ffd23f', '#ff8a3c'], tap: 'bloom' }), P('butterfly', 46, 30, 6, { at: 'center', anim: 'flutter' })] },
    party: { back: 'room', props: [P('ff-bunting', 50, 0, 13, { at: 'top', tap: 'flags' }), P('window', 46, 34, 26, { at: 'center' }),
      P('lamp', 6, 80, 40, { tap: 'shine' }), P('balloons', 95, 82, 32, { tap: 'boing' })] },
    storm: { back: 'ff-storm', props: [P('cloud', 18, 14, 14, { at: 'center', anim: 'drift', args: ['#c9cfe0', '#a9b0c8', false] }),
      P('tree', 7, 82, 48, { args: ['#4f9a5a', '#6fb070', ''], tap: 'wiggle' }), P('bush', 94, 84, 14, { args: ['#4f9a5a', ''] })] },
    room: { back: 'room', props: [P('window', 48, 30, 24, { at: 'center' }), P('bookshelf', 6, 78, 36, { tap: 'wiggle' }), P('lamp', 95, 80, 38, { tap: 'shine' })] },
    garden: { back: 'garden', props: [P('sun', 50, 13, 14, { at: 'center', tap: 'spin' }), P('bush', 7, 82, 16, { tap: 'wiggle' }),
      P('sunflower', 94, 86, 34, { tap: 'bloom' }), P('flower', 16, 99, 12, { args: ['#c49bff'], tap: 'bloom' }), P('butterfly', 44, 30, 6, { at: 'center', anim: 'flutter', args: ['#ffd23f', '#ff6fb5'] })] },
    playground: { back: 'garden', props: [P('tree', 7, 82, 52, { args: ['#5cc04a', '#86da6c', ''], tap: 'wiggle' }), P('sun', 48, 13, 14, { at: 'center', tap: 'spin' }),
      P('fence', 92, 80, 12), P('flower', 16, 99, 12, { args: ['#ff8ad8'], tap: 'bloom' })] },
    night: { back: 'camp', extras: { stars: 24, fireflies: 5 }, props: [P('pine', 6, 84, 48, { args: ['#1e3a3a', false], tap: 'wiggle' }),
      P('pine', 95, 84, 42, { args: ['#1e3a3a', false], tap: 'wiggle' }), P('owl', 90, 40, 18, { at: 'center', tap: 'hoot' })] },
    jungle: { back: 'jungle', props: [P('vine', 5, 0, 44, { at: 'top' }), P('vine', 52, 0, 26, { at: 'top' }), P('bigleaf', 6, 100, 34, { tap: 'wiggle' }),
      P('parrot', 46, 22, 16, { at: 'center', tap: 'squawk' })] },
    rainbow: { back: 'meadow', props: [P('tree', 7, 82, 50, { tap: 'wiggle' }), P('cloud', 34, 14, 10, { at: 'center', anim: 'drift', tap: 'boing' }),
      P('flower', 18, 99, 12, { args: ['#b07aff'], tap: 'bloom' }), P('flower', 94, 99, 11, { tap: 'bloom' })] },
    mirror: { back: 'room', props: [P('lamp', 6, 80, 38, { tap: 'shine' }), P('bookshelf', 95, 78, 34, { tap: 'wiggle' })] },
  };
  const STORY_SCENE = { 1: 'park', 2: 'party', 3: 'storm', 4: 'room', 5: 'garden', 6: 'playground', 7: 'night', 8: 'park', 9: 'jungle', 10: 'room', 11: 'room', 12: 'rainbow' };

  const SK = Scenery.kit, ol = SK.ol;
  Scenery.add('ff-heart', (c = '#ff7aa8') => [100, 96,
    `<path d="M50 90 C10 62 2 36 16 20 C28 8 44 12 50 28 C56 12 72 8 84 20 C98 36 90 62 50 90Z" fill="${c}" ${ol()}/>` +
    `<ellipse cx="28" cy="30" rx="8" ry="5" fill="#fff" opacity=".6" transform="rotate(-30 28 30)"/>` + SK.face(50, 50, .5, { cheeks: '#ff4d7a' })]);
  Scenery.add('ff-bunting', () => {
    const cols = ['#ff6fb5', '#ffd23f', '#7ad6ff', '#8de08a', '#b48aff'];
    let s = `<path d="M0 6 Q300 66 600 6" stroke="#8a5a9a" stroke-width="4" fill="none"/>`;
    for (let i = 0; i < 9; i++) {
      const t = (i + .5) / 9, x = 600 * t, y = 6 + 120 * t * (1 - t);
      s += `<path class="ff-flag" style="animation-delay:${-i * .41}s" d="M${(x - 26).toFixed(0)} ${y.toFixed(0)} L${(x + 26).toFixed(0)} ${y.toFixed(0)} L${x.toFixed(0)} ${(y + 52).toFixed(0)}Z" fill="${cols[i % 5]}" ${ol(2)}/>`;
    }
    return [600, 100, s];
  });
  // a round wall mirror for making faces (the face sits in the glass)
  Scenery.add('ff-mirror', () => {
    let rim = '';
    for (let i = 0; i < 18; i++) { const a = i / 18 * Math.PI * 2; rim += `<circle cx="${(120 + Math.cos(a) * 112).toFixed(1)}" cy="${(120 + Math.sin(a) * 112).toFixed(1)}" r="9" fill="#ffbe4a" ${ol(2)}/>`; }
    return [240, 240, rim + `<circle cx="120" cy="120" r="112" fill="#ffd27a" ${ol()}/><circle cx="120" cy="120" r="104" fill="#ff9fc6"/><circle cx="120" cy="120" r="98" fill="#e3f6ff"/>` +
      `<path d="M58 78 Q74 46 108 34" stroke="#fff" stroke-width="12" stroke-linecap="round" fill="none" opacity=".9"/><path d="M52 104 L58 94" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity=".9"/>` +
      `<path d="M120 12 c-7 -10 -21 -2 -12 8 l12 10 l12 -10 c9 -10 -5 -18 -12 -8Z" fill="#ff5a8a" ${ol(2)}/>`];
  });
  Scenery.addBackdrop('ff-storm', ['#6f7fa8', '#9aa8c8', '#c8d0e0'], () => {
    let rain = '';
    for (let row = -2; row < 9; row++) for (let j = -1; j < 12; j++) {
      const x = j * 90 + 30 - row * 30, y = row * 120 + (j % 2) * 60;
      rain += `<path d="M${x} ${y} l-8 34" stroke="#e6eeff" stroke-width="4" stroke-linecap="round" opacity=".55"/>`;
    }
    return SK.sky('ff-storm') + `<path d="${SK.hillsPath(650, 140, 77, 4)}" fill="#7a9a8a"/>` +
      `<path d="M0 760 Q500 730 1000 765 V1000 H0Z" fill="#5f8a5a"/><path d="M0 900 Q500 880 1000 905 V1000 H0Z" fill="#557d50"/>` +
      SK.grassTufts(40, 6, 770, 990, '#4a7046') + `<g class="ff-rain">${rain}</g>`;
  });
  Scenery.addBackdrop('ff-sky', ['#ffe3f1', '#f3dcff', '#e3e6ff'], () => SK.sky('ff-sky') +
    SK.dots(14, 21, 60, 700, ['#ffffff'], [30, 60], 1).replace(/fill="#ffffff"/g, 'fill="#ffffff" opacity=".35"') +
    `<path d="${SK.hillsPath(840, 90, 81, 4)}" fill="#c8f0c8"/><path d="M0 920 Q500 880 1000 920 V1000 H0Z" fill="#a9e3a9"/>` +
    SK.dots(40, 22, 860, 990, ['#ffffff', '#ff9fd2', '#fff3a0', '#c49bff'], [4, 7]));

  // tapping the scenery
  const T = (f, d, o) => Kit.tone(f, d, o);
  function tapDecor(el) {
    const re = (cls, ms) => Scenery.react(el, cls, ms), r = el.getBoundingClientRect(), cx = r.left + r.width / 2;
    switch (el.dataset.tap) {
      case 'spin': re('t-spin', 900); Kit.sfx.whoosh(); break;
      case 'boing': re('t-boing', 600); Kit.sfx.boing(); break;
      case 'wiggle': re('t-wiggle', 600); [0, 1, 2].forEach(i => T(1800 + i * 300, .06, { type: 'sawtooth', vol: .025, to: 1200, delay: i * .05 })); break;
      case 'bloom': re('t-bloom', 900); [0, 1, 2, 3].forEach(i => T(760 + i * 40, .07, { type: 'square', vol: .05, to: 980, delay: i * .08 })); break;
      case 'flags': re('t-wiggle', 600); [0, 1, 2].forEach(i => T(520 + i * 130, .12, { type: 'triangle', vol: .1, delay: i * .08 })); break;
      case 'shine': re('t-boing', 600); Kit.sfx.ding(); break;
      case 'hoot': re('t-hoot', 900); [0, 1].forEach(i => T(420, .35, { vol: .16, to: 360, delay: i * .45, attack: .06 })); break;
      case 'squawk': re('t-flap', 700); [0, 1].forEach(i => T(1100, .16, { type: 'sawtooth', vol: .08, to: 1600, delay: i * .2 })); break;
      case 'heart': re('t-boing', 600); Kit.sfx.ding(); Kit.burst(cx, r.top + r.height / 2, ['💖', '💕'], 5, 80); break;
    }
  }
  const hookTaps = els => els.forEach(el => el.dataset.tap && el.addEventListener('pointerdown', e => { e.stopPropagation(); tapDecor(el); }));

  // the sky around the game
  const SKY_PROPS = [P('cloud', 14, 11, 11, { at: 'center', anim: 'drift', tap: 'boing' }), P('cloud', 78, 17, 9, { at: 'center', anim: 'drift', args: ['#fff', '#f2dcff'], tap: 'boing' }),
    P('ff-heart', 6, 92, 9, { at: 'bottom', anim: 'bob', tap: 'heart' }), P('ff-heart', 94, 90, 7, { at: 'bottom', anim: 'bob', args: ['#b48aff'], tap: 'heart' })];
  function paintSky() {
    $('skyBack').innerHTML = Scenery.backdrop('ff-sky');
    $('skyDecor').innerHTML = '';
    hookTaps(Scenery.place($('skyDecor'), SKY_PROPS, innerWidth, innerHeight));
  }
  // the little scene inside the story box
  let sceneKey = null;
  function paintScenery(key = sceneKey) {
    sceneKey = key;
    const sc = SCENES[key], r = $('stage').getBoundingClientRect();
    $('sceneBack').innerHTML = Scenery.backdrop(sc.back);
    const d = $('sceneDecor'); d.innerHTML = '';
    if (sc.extras) Scenery.extras(d, sc.extras);
    hookTaps(Scenery.place(d, sc.props, r.width || 600, r.height || 400));
    if (key === 'mirror') { const m = document.createElement('div'); m.id = 'mirror'; m.innerHTML = Scenery.art('ff-mirror').svg; d.appendChild(m); }
  }

  // ---------- faces for the face-making rounds ----------
  const BROWS = ['none', 'up', 'angry', 'sad'];
  const EYES = ['normal', 'wide', 'happy'];
  const MOUTHS = ['smile', 'frown', 'open', 'wavy', 'flat'];
  function faceSVG(f, crop) {
    let s = `<svg viewBox="${crop || '0 0 200 200'}" xmlns="http://www.w3.org/2000/svg">`;
    if (!crop) s += '<circle cx="100" cy="100" r="92" fill="#fde047" stroke="#ca8a04" stroke-width="6"/><circle cx="52" cy="122" r="12" fill="#fda4af" opacity=".6"/><circle cx="148" cy="122" r="12" fill="#fda4af" opacity=".6"/>';
    else s += '<rect x="-50" y="-50" width="400" height="400" fill="#fde047"/>';
    const k = '#3f2a14';
    // brows
    if (f.brows === 'up') s += `<path d="M48 52 Q66 36 84 50 M116 50 Q134 36 152 52" fill="none" stroke="${k}" stroke-width="7" stroke-linecap="round"/>`;
    if (f.brows === 'angry') s += `<path d="M48 48 L84 62 M152 48 L116 62" fill="none" stroke="${k}" stroke-width="8" stroke-linecap="round"/>`;
    if (f.brows === 'sad') s += `<path d="M50 62 L84 50 M150 62 L116 50" fill="none" stroke="${k}" stroke-width="8" stroke-linecap="round"/>`;
    // eyes
    if (f.eyes === 'normal') s += `<circle cx="70" cy="82" r="10" fill="${k}"/><circle cx="130" cy="82" r="10" fill="${k}"/>`;
    if (f.eyes === 'wide') s += `<circle cx="70" cy="82" r="18" fill="#fff" stroke="${k}" stroke-width="5"/><circle cx="130" cy="82" r="18" fill="#fff" stroke="${k}" stroke-width="5"/><circle cx="70" cy="82" r="7" fill="${k}"/><circle cx="130" cy="82" r="7" fill="${k}"/>`;
    if (f.eyes === 'happy') s += `<path d="M56 86 Q70 70 84 86 M116 86 Q130 70 144 86" fill="none" stroke="${k}" stroke-width="7" stroke-linecap="round"/>`;
    // mouth
    if (f.mouth === 'smile') s += `<path d="M58 124 Q100 168 142 124" fill="none" stroke="${k}" stroke-width="8" stroke-linecap="round"/>`;
    if (f.mouth === 'frown') s += `<path d="M64 154 Q100 120 136 154" fill="none" stroke="${k}" stroke-width="8" stroke-linecap="round"/>`;
    if (f.mouth === 'open') s += `<ellipse cx="100" cy="142" rx="18" ry="24" fill="${k}"/>`;
    if (f.mouth === 'wavy') s += `<path d="M62 142 q10 -10 19 0 t19 0 t19 0 t19 0" fill="none" stroke="${k}" stroke-width="7" stroke-linecap="round"/>`;
    if (f.mouth === 'flat') s += `<path d="M66 140 L134 140" fill="none" stroke="${k}" stroke-width="8" stroke-linecap="round"/>`;
    return s + '</svg>';
  }
  // does this face show the feeling? (kept friendly: the key parts only)
  const FITS = {
    happy:     f => ['smile'].includes(f.mouth) && !['angry', 'sad'].includes(f.brows),
    sad:       f => f.mouth === 'frown' && f.brows !== 'angry' && f.eyes !== 'happy',
    angry:     f => f.brows === 'angry' && ['frown', 'flat'].includes(f.mouth),
    scared:    f => f.eyes === 'wide' && ['wavy', 'open', 'frown'].includes(f.mouth) && f.brows !== 'angry',
    surprised: f => f.eyes === 'wide' && f.mouth === 'open' && f.brows !== 'angry',
  };

  const save = Kit.store('feelings-friends');
  const saved = save.get({ hearts: 0, rounds: 0, order: [] });
  let story = null, busy = false, stage = 'feel', misses = 0;

  function paintHearts() { const n = saved.hearts; $('hearts').textContent = n ? (n > 10 ? '💖 × ' + n : '💖'.repeat(n)) : '🤍'; }
  function clearStage() { [...$('stage').querySelectorAll('.thing, #face')].forEach(e => e.remove()); $('bubble').classList.remove('on'); }
  function addThing(e, x, y, size, cls = '') {
    const el = document.createElement('div'); el.className = 'thing ' + cls; el.textContent = e;
    el.style.left = x + '%'; el.style.top = y + '%'; el.style.fontSize = size + 'vmin';
    $('stage').appendChild(el); return el;
  }
  function bubble(text) {
    const hero = $('stage').querySelector('.hero'); if (!hero) return;
    const b = $('bubble'); b.textContent = text;
    b.style.left = hero.style.left; b.style.top = `calc(${hero.style.top} - 11vmin)`;
    b.classList.remove('on'); void b.offsetWidth; b.classList.add('on');
  }

  // pick stories in a shuffled order so she sees them all before repeats
  function nextStory() {
    if (!saved.order.length) saved.order = shuffle(STORIES.map(s => s.id));
    const id = saved.order.shift(); save.set(saved);
    return STORIES.find(s => s.id === id);
  }

  // ================= story rounds =================
  async function storyRound(first) {
    busy = true; stage = 'feel'; misses = 0;
    $('builder').classList.add('hidden'); $('choices').classList.remove('hidden');
    story = nextStory();
    clearStage();
    paintScenery(STORY_SCENE[story.id] || 'park');
    addThing(story.hero, 30, 54, 22, 'hero');
    const things = story.things.map(([e, x, y, s]) => addThing(e, x, y, s));
    $('choices').innerHTML = '';
    if (first) { Kit.say('ff.intro'); await sleep(3200); }
    Kit.say('ff.s' + story.id, 'ff.howFeel');
    await sleep(1200);
    story.things.forEach(([, , , , cls], i) => cls && things[i].classList.add(cls));
    if (story.things.some(t => t[4] === 'fall')) Kit.sfx.oops();
    if (story.things.some(t => t[4] === 'shake')) Kit.tone(70, .8, { type: 'sawtooth', vol: .08, to: 40 });
    paintFeelings(); busy = false;
  }
  function paintFeelings() {
    const box = $('choices'); box.innerHTML = '';
    for (const [k, e] of Object.entries(FEELINGS)) {
      const b = document.createElement('button'); b.className = 'btn feel'; b.textContent = e; b.setAttribute('aria-label', k);
      b.onclick = () => chooseFeeling(k, b);
      box.appendChild(b);
    }
  }
  async function chooseFeeling(k, b) {
    if (busy || stage !== 'feel') return;
    if (!story.feel.includes(k)) {
      misses++; Kit.flash(b, 'wobble'); Kit.sfx.oops(); Kit.say('ff.f.' + k, 'ff.lookAgain');
      if (misses >= 2) [...$('choices').children].forEach(x => x.classList.toggle('glow', story.feel.includes(x.getAttribute('aria-label'))));
      return;
    }
    busy = true; Kit.sfx.ding(); bubble(FEELINGS[k]);
    Kit.say('ff.f.' + k, 'ff.right.' + k);
    await sleep(3400);
    if (!story.help) return celebrate();
    stage = 'help'; misses = 0;
    const box = $('choices'); box.innerHTML = '';
    for (const h of shuffle([...story.help, story.unkind])) {
      const btn = document.createElement('button'); btn.className = 'btn help'; btn.textContent = h;
      btn.onclick = () => chooseHelp(h, btn);
      box.appendChild(btn);
    }
    Kit.say('ff.howHelp'); busy = false;
  }
  async function chooseHelp(h, b) {
    if (busy || stage !== 'help') return;
    if (h === story.unkind) {
      misses++; Kit.flash(b, 'wobble'); Kit.sfx.oops(); Kit.say('ff.notHelp');
      if (misses >= 1) [...$('choices').children].forEach(x => x.classList.toggle('glow', story.help.includes(x.textContent)));
      return;
    }
    busy = true; Kit.sfx.yay();
    addThing(h, 46, 40, 12, 'pop-in');
    bubble('😊');
    $('stage').querySelector('.hero').classList.add('cheer');
    Kit.burstAt($('stage').querySelector('.hero'), ['💖', '💕', '✨'], 16, 180);
    Kit.say('ff.helped');
    win();
  }
  function celebrate() {
    Kit.sfx.yay(); bubble('🥳');
    $('stage').querySelector('.hero').classList.add('cheer');
    Kit.burstAt($('stage'), ['🎉', '⭐', '💖', '✨'], 20, 240);
    Kit.say('ff.celebrate');
    win();
  }

  // ================= face-making rounds =================
  let face = null, want = null;
  function faceRound() {
    busy = false; stage = 'face'; misses = 0;
    clearStage();
    $('choices').classList.add('hidden'); $('builder').classList.remove('hidden');
    want = pick(Object.keys(FEELINGS));
    face = { brows: 'none', eyes: 'normal', mouth: 'flat' };
    paintScenery('mirror');
    const f = document.createElement('div'); f.id = 'face'; $('stage').appendChild(f);
    paintFace();
    Kit.say('ff.make.' + want);
  }
  function paintFace() {
    $('face').innerHTML = faceSVG(face);
    const parts = $('parts'); parts.innerHTML = '';
    for (const [key, opts, crop] of [['brows', BROWS, '30 22 140 60'], ['eyes', EYES, '30 52 140 60'], ['mouth', MOUTHS, '30 104 140 70']]) {
      const row = document.createElement('div'); row.className = 'partRow';
      for (const o of opts) {
        const b = document.createElement('button'); b.className = 'part' + (face[key] === o ? ' sel' : '');
        b.innerHTML = faceSVG({ brows: 'none', eyes: 'none', mouth: 'none', [key]: o }, crop);
        b.setAttribute('aria-label', key + ' ' + o);
        b.onclick = () => { face[key] = o; Kit.tone(400 + Math.random() * 300, .1, { type: 'triangle' }); paintFace(); };
        row.appendChild(b);
      }
      parts.appendChild(row);
    }
  }
  $('checkBtn').onclick = async () => {
    if (busy || stage !== 'face') return;
    if (!FITS[want](face)) {
      misses++; Kit.sfx.oops(); Kit.flash($('face'), 'wobble'); Kit.say('ff.notQuite');
      return;
    }
    busy = true; Kit.sfx.yay(); Kit.burstAt($('face'), ['⭐', '✨', '💖'], 18, 200);
    Kit.say('ff.greatFace');
    win();
  };

  // ================= flow =================
  async function win() {
    saved.hearts++; saved.rounds++; save.set(saved); paintHearts();
    await sleep(3600);
    next();
  }
  function next(first = false) { (saved.rounds % 3 === 2 && !first ? faceRound : storyRound)(first); }

  Kit.soundButton('soundBtn');
  paintSky();
  paintHearts();
  next(true);
  let lastSize = innerWidth + 'x' + innerHeight;
  addEventListener('resize', () => {
    const size = innerWidth + 'x' + innerHeight;
    if (size === lastSize) return;
    lastSize = size; paintSky(); if (sceneKey) paintScenery();
  });
})();
</script>
</body>
