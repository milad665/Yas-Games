<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cake Shop">
<meta name="theme-color" content="#fce7f3">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/shared/kit.css">
<title>Cake Shop</title>
<style>
  body { background: #ffe9f1; }
  /* the bakery: a striped wall with shelves and lamps, and a counter the cake stands on */
  #bakery { position: absolute; inset: 0; z-index: 0; }
  #bakery > div { position: absolute; inset: 0; }
  #bkDecor { pointer-events: none; }
  #counter { position: absolute; left: 0; right: 0; bottom: 0; top: auto; pointer-events: none; }
  #counter svg { display: block; }
  .cs-swing { animation: cs-swing 4s ease-in-out infinite; }
  @keyframes cs-swing { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
  .sc-prop.t-swing .cs-swing { animation-duration: .5s; }
  .cs-rise { transform-box: fill-box; transform-origin: 50% 100%; animation: cs-rise 3s ease-in-out infinite; }
  @keyframes cs-rise { 0%,100% { transform: scale(1, .85); } 50% { transform: scale(1.04, 1.08); } }
  .cs-whisk { animation: sc-wigglex .4s ease-in-out infinite; }
  .sc-prop.t-mix .cs-whisk { animation-duration: .12s; }
  #shop { flex-direction: column; align-items: center; padding: max(14px, env(safe-area-inset-top)) 16px max(14px, env(safe-area-inset-bottom)); gap: 1.5vh; }
  #steps { display: flex; gap: 10px; margin-top: 4px; }
  .step { width: 56px; height: 56px; border-radius: 50%; background: rgba(255,255,255,.75); display: grid; place-items: center; font-size: 28px; opacity: .45; }
  .step.now { opacity: 1; background: #fff; box-shadow: 0 0 0 4px #ec4899; }
  .step.done { opacity: 1; }
  #stage { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; gap: 4vw; position: relative; pointer-events: none; }
  #stage > * { pointer-events: auto; }
  #guest { font-size: min(18vh, 20vw); line-height: 1; display: none; }
  #guest.on { display: block; animation: kit-bob 2.2s ease-in-out infinite; }
  #guest.party { animation: party .5s ease-in-out infinite alternate; }
  @keyframes party { from { transform: rotate(-10deg) translateY(0); } to { transform: rotate(10deg) translateY(-14px); } }
  #cake { height: 100%; max-height: 54vh; aspect-ratio: 300 / 340; position: relative; }
  #cake svg { width: 100%; height: 100%; overflow: visible; }
  #cake.dim { filter: brightness(.95); }
  .flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flicker .25s ease-in-out infinite alternate; cursor: pointer; }
  @keyframes flicker { from { transform: scale(1, 1) rotate(-3deg); } to { transform: scale(.9, 1.12) rotate(3deg); } }
  .drop { animation: dropIn .45s cubic-bezier(.4,1.4,.6,1); transform-box: fill-box; }
  @keyframes dropIn { from { transform: translateY(-120px); opacity: 0; } }
  #night { position: absolute; inset: 0; background: rgba(15, 23, 42, .6); pointer-events: none; opacity: 0; transition: opacity .8s; z-index: 0; }
  #night.on { opacity: 1; }
  #stage, #panel, #steps { z-index: 2; position: relative; }

  #panel { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; align-items: center; min-height: 110px; }
  .opt { width: 88px; height: 88px; border-radius: 26px; font-size: 48px; }
  .flavor { width: 84px; height: 84px; border-radius: 50%; border: 6px solid #fff; box-shadow: 0 5px 0 rgba(0,0,0,.15); touch-action: manipulation; }
  #nextBtn { width: 104px; height: 104px; font-size: 52px; background: #4ade80; margin-left: 10px; }
  #panel { background: rgba(255,255,255,.35); border-radius: 30px; padding: 8px 12px; }
  #panel:empty { background: none; }
  #count { font-size: 40px; font-weight: 900; background: #fff; border-radius: 999px; padding: 4px 20px; box-shadow: 0 5px 0 rgba(0,0,0,.1); }
</style>
</head>
<body>

<section id="shop" class="screen on">
  <div id="bakery"><div id="bkBack"></div><div id="counter"></div><div id="bkDecor"></div></div>
  <div id="night"></div>
  <a class="btn corner left" href="../../" aria-label="Back to Yas's Games">🏠</a>
  <button id="soundBtn" class="btn corner right" aria-label="Sound on or off">🔊</button>
  <div id="steps"></div>
  <div id="stage"><div id="guest"></div><div id="cake"></div></div>
  <div id="panel"></div>
</section>

<script src="/shared/edition.js"></script>
<script src="/shared/lines.js"></script>
<script src="/shared/voice.js"></script>
<script src="/shared/saved.js"></script>
<script src="/shared/kit.js"></script>
<script src="/shared/scenery.js"></script>
<script>
(() => {
  const { $, rand, pick, sleep } = Kit;

  const FLAVORS = { chocolate: '#7c3f1d', strawberry: '#f9a8d4', vanilla: '#fef3c7', blueberry: '#a78bfa', lemon: '#fde047', mint: '#86efac' };
  const FROSTINGS = ['#ffffff', '#fbcfe8', '#93c5fd', '#fde68a', '#c4b5fd', '#6b3a1e'];
  const TOPPINGS = ['🍓', '🍒', '🫐', '⭐', '🌸', '🍬', '🍫', '❤️'];
  const GUESTS = { bear: ['🐻', 3], bunny: ['🐰', 4], unicorn: ['🦄', 5], puppy: ['🐶', 2], dino: ['🦖', 6], kitty: ['🐱', 7] };
  // and the child the games are made for, on their own birthday (ages 1 to 10 are recorded)
  const KID = self.EDITION && EDITION.kid;
  if (KID) GUESTS.kid = [KID.emoji, Math.min(10, Math.max(1, KID.age || 1))];
  const STEPS = [['layers', '🍰'], ['frosting', '🧁'], ['deco', '🍓'], ['candles', '🕯️']];
  const MAX_LAYERS = 4;

  let cake, step, guest, lit, busy, welcome = true;

  function reset() {
    cake = { layers: [], frosting: null, toppings: [], sprinkles: [], candles: 0 };
    step = 0; guest = null; lit = false; busy = false;
    $('guest').className = ''; $('guest').textContent = ''; $('night').classList.remove('on');
  }

  // ---------- drawing the cake (300 x 340 picture) ----------
  const LAYER_H = 52, BOTTOM = 300, CX = 150, W = 220;
  const STAND_OL = 'stroke="#3a2d52" stroke-opacity=".45" stroke-width="3"';
  const topY = () => BOTTOM - cake.layers.length * LAYER_H;
  function shade(hex, amt) { const n = parseInt(hex.slice(1), 16), c = v => Math.max(0, Math.min(255, v + amt)); return '#' + [c(n >> 16), c((n >> 8) & 255), c(n & 255)].map(v => v.toString(16).padStart(2, '0')).join(''); }
  function paintCake(dropLast = false) {
    let s = '<svg viewBox="0 0 300 340" xmlns="http://www.w3.org/2000/svg">';
    // a cake stand: plate on a little pedestal
    s += `<path d="M130 318 L120 332 H180 L170 318Z" fill="#ffd1e3" ${STAND_OL}/><ellipse cx="${CX}" cy="334" rx="56" ry="5" fill="#ffb3d0" ${STAND_OL}/>`;
    s += `<ellipse cx="${CX}" cy="310" rx="142" ry="14" fill="#ffd1e3" ${STAND_OL}/><ellipse cx="${CX}" cy="306" rx="132" ry="9" fill="#fff"/>`;
    s += Array.from({ length: 11 }, (_, i) => `<circle cx="${CX - 120 + i * 24}" cy="${(320 - Math.abs(i - 5) * 1.2).toFixed(1)}" r="3.5" fill="#fff"/>`).join('');
    cake.layers.forEach((f, i) => {
      const y = BOTTOM - (i + 1) * LAYER_H, col = FLAVORS[f];
      s += `<g class="${dropLast && i === cake.layers.length - 1 ? 'drop' : ''}"><rect x="${CX - W / 2}" y="${y}" width="${W}" height="${LAYER_H}" rx="14" fill="${col}" stroke="${shade(col, -40)}" stroke-width="4"/>`;
      s += `<rect x="${CX - W / 2 + 6}" y="${y + LAYER_H - 12}" width="${W - 12}" height="6" rx="3" fill="${shade(col, 30)}" opacity=".7"/></g>`;
    });
    if (cake.layers.length && cake.frosting) {
      const y = topY(), col = cake.frosting;
      // icing on top with drips down the side
      let d = `M${CX - W / 2 - 4} ${y + 6} Q${CX - W / 2 - 4} ${y - 10} ${CX - W / 2 + 14} ${y - 10} L${CX + W / 2 - 14} ${y - 10} Q${CX + W / 2 + 4} ${y - 10} ${CX + W / 2 + 4} ${y + 6}`;
      for (let x = CX + W / 2; x > CX - W / 2; x -= 24) d += ` L${x} ${y + 8} Q${x - 6} ${y + 30} ${x - 12} ${y + 8}`;
      s += `<path d="${d} Z" fill="${col}" stroke="${shade(col, -30)}" stroke-width="3" stroke-linejoin="round"/>`;
    }
    for (const [x, y, c] of cake.sprinkles) s += `<rect x="${x}" y="${y}" width="10" height="4" rx="2" fill="${c}" transform="rotate(${(x * 7) % 180} ${x + 5} ${y + 2})"/>`;
    for (const t of cake.toppings) s += `<text x="${t[1]}" y="${t[2]}" font-size="30" text-anchor="middle" dominant-baseline="central">${t[0]}</text>`;
    // candles
    for (let i = 0; i < cake.candles; i++) {
      // closer together when there are many (up to ten for an older child), so they stay on the cake
      const n = cake.candles, gap = Math.min(30, (W - 24) / Math.max(1, n - 1)), x = CX - (n - 1) * gap / 2 + i * gap, y = topY() - 12;
      const stripe = ['#f472b6', '#60a5fa', '#facc15', '#4ade80', '#a78bfa', '#fb923c'][i % 6];
      s += `<g data-candle="${i}"><rect x="${x - 6}" y="${y - 56}" width="12" height="56" rx="4" fill="#fff" stroke="${stripe}" stroke-width="3"/><line x1="${x}" y1="${y - 56}" x2="${x}" y2="${y - 64}" stroke="#334155" stroke-width="2"/>`;
      if (lit && !(cake.out || []).includes(i)) s += `<path class="flame" d="M${x} ${y - 92} C${x + 12} ${y - 76} ${x + 10} ${y - 62} ${x} ${y - 62} C${x - 10} ${y - 62} ${x - 12} ${y - 76} ${x} ${y - 92} Z" fill="#fbbf24" stroke="#f97316" stroke-width="3"/>`;
      s += '</g>';
    }
    $('cake').innerHTML = s + '</svg>';
  }

  // ---------- the bakery around the cake (cartoon scenery; see /shared/scenery.js) ----------
  const P = (art, x, y, h, o = {}) => ({ art, x, y, h, ...o });
  const SK = Scenery.kit, ol = SK.ol;
  Scenery.addBackdrop('cs-bakery', ['#fff6e8', '#ffe6ef'], () => SK.sky('cs-bakery') +
    Array.from({ length: 25 }, (_, i) => `<rect x="${i * 40 + 10}" y="0" width="18" height="1000" fill="#ffd3e4" opacity=".55"/>`).join('') +
    SK.dots(30, 31, 120, 540, ['#ffc2da', '#ffffff'], [4, 6], 1) +
    `<rect y="560" width="1000" height="440" fill="#ffc6dc"/><rect y="552" width="1000" height="14" fill="#fff"/>` +
    `<path d="M0 0 H1000 V40 ${Array.from({ length: 20 }, (_, i) => `Q${1000 - i * 50 - 25} 84 ${1000 - (i + 1) * 50} 40`).join(' ')}Z" fill="#ff8ab0"/>` +
    `<path d="M0 40 ${Array.from({ length: 20 }, (_, i) => `Q${i * 50 + 25} 84 ${(i + 1) * 50} 40`).join(' ')}" stroke="#fff" stroke-width="6" fill="none"/>` +
    Array.from({ length: 10 }, (_, i) => `<rect x="${i * 100 + 30}" y="0" width="40" height="40" fill="#fff" opacity=".7"/>`).join(''));
  Scenery.add('cs-shelf', () => [300, 140,
    `<path d="M34 104 V134 L64 104Z M266 104 V134 L236 104Z" fill="#c98a4a" ${ol(2)}/>` +
    // a jar of candies
    `<rect x="18" y="38" width="56" height="58" rx="14" fill="#e6f6ff" ${ol(2)}/>` + [[32, 80, '#ff5a8a'], [48, 84, '#ffd23f'], [62, 78, '#7ad6ff'], [40, 66, '#8de08a'], [58, 62, '#b48aff']].map(([x, y, c]) => `<circle cx="${x}" cy="${y}" r="7" fill="${c}"/>`).join('') +
    `<rect x="14" y="30" width="64" height="12" rx="6" fill="#ff8ab0" ${ol(2)}/><rect x="24" y="48" width="6" height="36" rx="3" fill="#fff" opacity=".8"/>` +
    // a little cake
    `<rect x="100" y="62" width="76" height="34" rx="9" fill="#ffd1e8" ${ol(2)}/><rect x="112" y="34" width="52" height="30" rx="8" fill="#fff3d6" ${ol(2)}/>` +
    `<path d="M100 70 q10 10 19 0 t19 0 t19 0 t19 0" stroke="#fff" stroke-width="5" fill="none"/><circle cx="138" cy="27" r="8" fill="#ff3b5c" ${ol(2)}/>` +
    // a cupcake
    `<path d="M196 72 H236 L230 98 H202Z" fill="#7ad6ff" ${ol(2)}/>` + SK.blob([[206, 66, 12], [226, 66, 12], [216, 56, 13]], '#ffb3d9', { w: 2 }) +
    // a jar of cookies
    `<rect x="246" y="46" width="42" height="50" rx="10" fill="#e6f6ff" ${ol(2)}/><circle cx="258" cy="80" r="9" fill="#d9a05a"/><circle cx="276" cy="74" r="9" fill="#c98a4a"/><circle cx="266" cy="62" r="8" fill="#d9a05a"/>` +
    `<rect x="242" y="38" width="50" height="10" rx="5" fill="#ffd23f" ${ol(2)}/>` +
    `<rect x="4" y="96" width="292" height="14" rx="6" fill="#e0a86a" ${ol()}/>`]);
  Scenery.add('cs-lamp', (c = '#ff8ab0') => [100, 220,
    `<g class="cs-swing" style="transform-origin:50px 0px"><line x1="50" y1="0" x2="50" y2="122" stroke="#5a4a6a" stroke-width="3"/>` +
    `<ellipse class="sc-glowpulse" cx="50" cy="176" rx="50" ry="40" fill="url(#sc-beam-glow)"/>` +
    `<path d="M16 162 Q18 118 50 116 Q82 118 84 162Z" fill="${c}" ${ol()}/><rect x="12" y="158" width="76" height="9" rx="4.5" fill="#fff" ${ol(2)}/>` +
    `<circle cx="50" cy="172" r="10" fill="#fff6c2"/><path d="M30 140 Q34 128 44 124" stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none" opacity=".6"/></g>`]);
  Scenery.add('cs-oven', () => [200, 190,
    `<rect x="24" y="174" width="22" height="14" rx="4" fill="#5a4a6a"/><rect x="154" y="174" width="22" height="14" rx="4" fill="#5a4a6a"/>` +
    `<rect x="10" y="16" width="180" height="162" rx="24" fill="#9ad8ff" ${ol()}/><path d="M10 58 V40 Q10 16 34 16 H166 Q190 16 190 40 V58Z" fill="#7ac4f2"/>` +
    [50, 88, 126].map(x => `<circle cx="${x}" cy="37" r="9" fill="#fff" ${ol(2)}/><line x1="${x}" y1="37" x2="${x}" y2="30" stroke="#5a4a6a" stroke-width="3" stroke-linecap="round"/>`).join('') +
    `<circle class="sc-blinky" cx="164" cy="37" r="6" fill="#ff6f6f"/>` +
    `<rect x="28" y="70" width="144" height="96" rx="16" fill="#5ab4ea" ${ol(2)}/><rect x="66" y="78" width="68" height="7" rx="3.5" fill="#fff"/>` +
    `<rect x="44" y="92" width="112" height="60" rx="12" fill="#ffcf7a"/><ellipse cx="100" cy="124" rx="50" ry="24" fill="#ffe7a8" opacity=".8"/>` +
    `<g class="cs-rise"><path d="M64 150 Q64 112 100 112 Q136 112 136 150Z" fill="#d9924a" ${ol(2)}/><path d="M84 124 l8 10 M100 120 l8 10 M116 124 l8 10" stroke="#a8652a" stroke-width="3" stroke-linecap="round"/></g>` +
    `<path d="M52 100 L66 96" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".7"/>`]);
  Scenery.add('cs-mixer', () => [160, 200,
    `<rect x="104" y="58" width="30" height="112" rx="12" fill="#ff8ab0" ${ol()}/>` +
    `<g class="cs-whisk" style="transform-origin:62px 80px"><path d="M62 78 V98 M52 98 Q62 132 72 98 Z" stroke="#9aa0b8" stroke-width="4" fill="none" stroke-linejoin="round"/></g>` +
    `<path d="M22 108 H102 Q98 160 62 160 Q26 160 22 108Z" fill="#e8ecf6" ${ol()}/><ellipse cx="62" cy="110" rx="38" ry="8" fill="#fff3d6"/>` +
    `<path d="M16 76 Q16 30 66 30 H128 Q150 30 150 56 V78 Z" fill="#ff8ab0" ${ol()}/>` + SK.face(84, 54, .42) +
    `<rect x="10" y="160" width="140" height="26" rx="11" fill="#ff6f9f" ${ol()}/>`]);
  Scenery.add('cs-jar', () => [110, 130,
    `<path d="M16 40 H94 Q104 40 104 52 V112 Q104 124 92 124 H18 Q6 124 6 112 V52 Q6 40 16 40Z" fill="#e6f6ff" ${ol()}/>` +
    [[36, 102, 15], [70, 100, 15], [52, 76, 14], [82, 72, 12]].map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#d9a05a" ${ol(2)}/><circle cx="${x - 4}" cy="${y - 3}" r="2.5" fill="#6b3a1e"/><circle cx="${x + 5}" cy="${y + 3}" r="2.5" fill="#6b3a1e"/>`).join('') +
    `<rect x="14" y="52" width="8" height="54" rx="4" fill="#fff" opacity=".8"/>` +
    `<g class="sc-lid" style="transform-origin:8px 40px"><rect x="2" y="28" width="106" height="14" rx="7" fill="#ff8ab0" ${ol(2)}/><circle cx="55" cy="21" r="9" fill="#ffd23f" ${ol(2)}/></g>`]);

  const WALL = [P('cs-lamp', 30, 0, 24, { at: 'top', tap: 'lamp' }), P('cs-lamp', 70, 0, 20, { at: 'top', args: ['#7ad6ff'], tap: 'lamp' }),
    P('cs-shelf', 15, 30, 16, { at: 'center', tap: 'shelf' }), P('cs-shelf', 85, 30, 16, { at: 'center', tap: 'shelf' })];
  // these stand on the counter (y is filled in from where the counter is)
  const ON_COUNTER = [P('cs-oven', 11, 0, 24, { tap: 'oven' }), P('cupcake', 24, 0, 10, { tap: 'cherry' }),
    P('cs-jar', 76, 0, 13, { tap: 'jar' }), P('cs-mixer', 89, 0, 20, { tap: 'mixer' })];

  // the counter's top lines up with the bottom of the cake stand
  function paintCounter() {
    const sr = $('shop').getBoundingClientRect(), cr = $('cake').getBoundingClientRect(), W = sr.width, H = sr.height;
    let top = cr.height ? cr.top - sr.top + cr.height * 332 / 340 : H * .72;
    top = Math.round(Math.max(H * .3, Math.min(H - 70, top)));
    const h = H - top, n = Math.max(2, Math.round(W / 230)), pw = W / n;
    let s = `<svg width="${W}" height="${h}" viewBox="0 0 ${W} ${h}" xmlns="http://www.w3.org/2000/svg"><rect y="14" width="${W}" height="${h}" fill="#ff9fc6"/>`;
    for (let i = 0; i < n; i++) s += `<rect x="${(i * pw + 16).toFixed(1)}" y="52" width="${(pw - 32).toFixed(1)}" height="${Math.max(0, h - 74)}" rx="18" fill="#ffb8d4" stroke="#fff" stroke-width="5"/>`;
    for (let x = 0; x < W + 30; x += 34) s += `<circle cx="${x}" cy="30" r="13" fill="#fff"/>`;
    s += `<rect x="-10" y="0" width="${W + 20}" height="24" rx="8" fill="#f1c48e" ${ol()}/><rect x="0" y="5" width="${W}" height="5" fill="#fff" opacity=".45"/></svg>`;
    $('counter').style.top = top + 'px';
    $('counter').innerHTML = s;
    return top / H * 100;
  }
  let paintedAt = '';
  function paintBakery() {
    const sr = $('shop').getBoundingClientRect(), cr = $('cake').getBoundingClientRect();
    const key = [sr.width, sr.height, cr.top, cr.height].map(Math.round).join(',');
    if (key === paintedAt || !sr.width) return;
    paintedAt = key;
    $('bkBack').innerHTML = Scenery.backdrop('cs-bakery');
    const topPct = paintCounter() + .4;
    $('bkDecor').innerHTML = '';
    hookTaps(Scenery.place($('bkDecor'), [...WALL, ...ON_COUNTER.map(p => ({ ...p, y: topPct }))], sr.width, sr.height));
  }
  const T = (f, d, o) => Kit.tone(f, d, o);
  function tapDecor(el) {
    if (lit) return;   // keep the birthday song clear
    const re = (cls, ms) => Scenery.react(el, cls, ms), r = el.getBoundingClientRect(), cx = r.left + r.width / 2;
    switch (el.dataset.tap) {
      case 'lamp': re('t-swing', 1400); T(1320, .5, { type: 'sine', vol: .08 }); break;
      case 'shelf': re('t-wiggle', 600); [0, 1, 2].forEach(i => T(1600 + i * 220, .08, { type: 'triangle', vol: .07, delay: i * .07 })); break;
      case 'oven': re('t-boing', 600); Kit.sfx.ding(); Kit.burst(cx, r.top + r.height * .3, ['🥐', '🍪', '✨'], 5, 100); break;
      case 'cherry': re('t-cherry', 700); Kit.sfx.boing(); break;
      case 'jar': re('t-open', 1600); [0, 1].forEach(i => T(700 + i * 300, .12, { type: 'triangle', vol: .1, delay: i * .1 })); Kit.burst(cx, r.top, ['🍪'], 3, 70); break;
      case 'mixer': re('t-mix', 1400); T(200, 1.1, { type: 'sawtooth', vol: .035, to: 260 }); break;
    }
  }
  const hookTaps = els => els.forEach(el => el.dataset.tap && el.addEventListener('pointerdown', e => { e.stopPropagation(); tapDecor(el); }));

  // ---------- steps ----------
  function paintSteps() {
    $('steps').innerHTML = STEPS.map(([, icon], i) => `<div class="step ${i === step ? 'now' : i < step ? 'done' : ''}">${icon}</div>`).join('');
  }
  function nextButton(enabled = true) {
    const b = document.createElement('button'); b.className = 'btn'; b.id = 'nextBtn'; b.textContent = '➡️'; b.disabled = !enabled;
    b.setAttribute('aria-label', 'Next'); b.onclick = () => { Kit.sfx.pop(); step++; showStep(); };
    return b;
  }
  function showStep() {
    paintSteps(); paintCake();
    const p = $('panel'); p.innerHTML = '';
    const name = STEPS[step][0];
    if (name === 'layers') {
      for (const [f, col] of Object.entries(FLAVORS)) {
        const b = document.createElement('button'); b.className = 'flavor'; b.style.background = col; b.setAttribute('aria-label', f);
        b.onclick = () => {
          if (cake.layers.length >= MAX_LAYERS) { Kit.sfx.oops(); return; }
          cake.layers.push(f); paintCake(true); Kit.tone(300 + cake.layers.length * 80, .2, { type: 'triangle' }); Kit.say('cs.f.' + f);
          $('nextBtn').disabled = false;
        };
        p.appendChild(b);
      }
      const undo = document.createElement('button'); undo.className = 'btn opt'; undo.textContent = '↩️';
      undo.onclick = () => { if (!cake.layers.length) return; cake.layers.pop(); paintCake(); Kit.sfx.oops(); $('nextBtn').disabled = !cake.layers.length; };
      p.append(undo, nextButton(cake.layers.length > 0));
      Kit.say(welcome ? 'cs.intro' : null, cake.layers.length ? null : 'cs.layers'); welcome = false;
    }
    if (name === 'frosting') {
      for (const col of FROSTINGS) {
        const b = document.createElement('button'); b.className = 'flavor'; b.style.background = col;
        b.onclick = () => { cake.frosting = col; paintCake(); Kit.tone(700, .25, { type: 'sine', to: 400 }); $('nextBtn').disabled = false; };
        p.appendChild(b);
      }
      p.appendChild(nextButton(!!cake.frosting));
      Kit.say('cs.frosting');
    }
    if (name === 'deco') {
      for (const t of TOPPINGS) {
        const b = document.createElement('button'); b.className = 'btn opt'; b.textContent = t;
        b.onclick = () => {
          if (cake.toppings.length > 18) cake.toppings.shift();
          cake.toppings.push([t, rand(CX - W / 2 + 22, CX + W / 2 - 22), topY() + rand(-2, 26)]);
          paintCake(); Kit.tone(600 + Math.random() * 500, .1, { type: 'triangle' });
        };
        p.appendChild(b);
      }
      const sp = document.createElement('button'); sp.className = 'btn opt'; sp.textContent = '🌈';
      sp.setAttribute('aria-label', 'Sprinkles');
      sp.onclick = () => {
        for (let i = 0; i < 14; i++) cake.sprinkles.push([rand(CX - W / 2 + 6, CX + W / 2 - 16), rand(topY() - 6, BOTTOM - 10), pick(['#ef4444', '#3b82f6', '#22c55e', '#facc15', '#ec4899', '#a855f7'])]);
        cake.sprinkles = cake.sprinkles.slice(-120);
        paintCake(); [0, 1, 2, 3].forEach(i => Kit.tone(1200 + i * 150, .05, { vol: .06, delay: i * .04 }));
      };
      p.append(sp, nextButton(true));
      Kit.say('cs.deco');
    }
    if (name === 'candles') chooseGuest();
  }

  // ---------- birthday! ----------
  function chooseGuest() {
    const p = $('panel'); p.innerHTML = '';
    for (const [k, [e]] of Object.entries(GUESTS)) {
      const b = document.createElement('button'); b.className = 'btn opt'; b.textContent = e; b.setAttribute('aria-label', k);
      b.onclick = () => { Kit.sfx.pop(); guest = k; candles(); };
      p.appendChild(b);
    }
    Kit.say('cs.who');
  }
  function candles() {
    const [e, age] = GUESTS[guest];
    $('guest').textContent = e; $('guest').className = 'on';
    const p = $('panel'); p.innerHTML = '';
    const add = document.createElement('button'); add.className = 'btn opt'; add.textContent = '🕯️'; add.setAttribute('aria-label', 'Add a candle');
    const take = document.createElement('button'); take.className = 'btn opt'; take.textContent = '↩️';
    const count = document.createElement('div'); count.id = 'count'; count.textContent = '0';
    const light = document.createElement('button'); light.className = 'btn'; light.id = 'nextBtn'; light.textContent = '🔥'; light.setAttribute('aria-label', 'Light the candles');
    const paint = () => { count.textContent = cake.candles; paintCake(); };
    add.onclick = () => { if (cake.candles >= Math.max(7, age)) return Kit.sfx.oops(); cake.candles++; paint(); Kit.tone(500 + cake.candles * 60, .12, { type: 'triangle' }); Kit.say('cg.n' + cake.candles); };
    take.onclick = () => { if (!cake.candles) return; cake.candles--; paint(); Kit.sfx.oops(); };
    light.onclick = () => {
      if (busy) return;
      if (cake.candles < age) { Kit.sfx.oops(); Kit.say('cs.more'); return; }
      if (cake.candles > age) { Kit.sfx.oops(); Kit.say('cs.tooMany'); return; }
      party();
    };
    p.append(take, add, count, light);
    Kit.say(guest === 'kid' ? 'cs.age.kid.' + age : 'cs.age.' + guest);
  }
  function song() {
    // Happy Birthday (public domain melody)
    const G = 392, A = 440, B = 494, C = 523, D = 587, E = 659, F = 698, G2 = 784;
    const tune = [[G, .75], [G, .25], [A, 1], [G, 1], [C, 1], [B, 2], [G, .75], [G, .25], [A, 1], [G, 1], [D, 1], [C, 2],
      [G, .75], [G, .25], [G2, 1], [E, 1], [C, 1], [B, 1], [A, 2], [F, .75], [F, .25], [E, 1], [C, 1], [D, 1], [C, 2.5]];
    let t = 0;
    for (const [f, d] of tune) { Kit.tone(f, d * .38, { type: 'triangle', vol: .14, delay: t }); Kit.tone(f / 2, d * .38, { type: 'sine', vol: .06, delay: t }); t += d * .4; }
    return t;
  }
  async function party() {
    busy = true; step = 3; paintSteps();
    $('panel').innerHTML = '';
    lit = true; cake.out = []; paintCake();
    $('night').classList.add('on');
    Kit.say('cs.light');
    await sleep(2200);
    const len = song();
    $('guest').classList.add('party');
    await sleep(len * 1000 + 300);
    Kit.say('cs.hb.' + guest, 'cs.blow');
    busy = false;
  }
  // blow out a flame by tapping it
  $('cake').addEventListener('pointerdown', e => {
    if (!lit || busy) return;
    const g = e.target.closest('[data-candle]'); if (!g) return;
    const i = +g.dataset.candle; if (cake.out.includes(i)) return;
    cake.out.push(i); paintCake();
    Kit.tone(900, .3, { type: 'sawtooth', vol: .04, to: 200 });
    Kit.burst(e.clientX, e.clientY - 30, ['💨'], 2, 40);
    if (cake.out.length === cake.candles) finish();
  });
  async function finish() {
    busy = true; lit = false;
    $('night').classList.remove('on');
    Kit.sfx.yay(); Kit.burstAt($('cake'), ['🎉', '🎊', '🎈', '⭐', '🍰'], 30, 320);
    Kit.say('cs.yum');
    await sleep(3500);
    const again = document.createElement('button'); again.className = 'btn big go'; again.textContent = '🔁'; again.setAttribute('aria-label', 'Bake another cake');
    again.onclick = () => { Kit.sfx.pop(); reset(); showStep(); };
    $('panel').innerHTML = ''; $('panel').appendChild(again); again.classList.add('pulse');
  }

  Kit.soundButton('soundBtn');
  reset();
  showStep();
  paintBakery();
  addEventListener('resize', () => requestAnimationFrame(paintBakery));
  if (self.ResizeObserver) { const ro = new ResizeObserver(() => requestAnimationFrame(paintBakery)); ro.observe($('cake')); ro.observe($('stage')); ro.observe($('panel')); }
})();
</script>
</body>
