<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pattern Train">
<meta name="theme-color" content="#bae6fd">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/shared/kit.css">
<title>Pattern Train</title>
<style>
  body { background: #8fd6ff; }
  #game { flex-direction: column; }
  /* the cartoon countryside behind everything (drawn with /shared/scenery.js) */
  .scene { position: absolute; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .scene > div { position: absolute; inset: 0; }
  .pt-flap { animation: pt-flap .3s ease-in-out infinite alternate; }
  @keyframes pt-flap { to { transform: scaleY(-.5); } }
  .pt-lamp1 { animation: pt-blink 3s steps(1) infinite; }
  .pt-lamp2 { animation: pt-blink 3s steps(1) infinite reverse; }
  @keyframes pt-blink { 0% { opacity: 1; } 50% { opacity: .2; } }
  .sc-prop.t-switch .pt-lamp1, .sc-prop.t-switch .pt-lamp2 { animation-duration: .3s; }

  #stickers { position: absolute; top: max(22px, env(safe-area-inset-top)); left: 50%; translate: -50% 0; display: flex; gap: 2px; font-size: 30px; background: rgba(255,255,255,.7); border-radius: 999px; padding: 6px 16px; min-height: 52px; min-width: 120px; justify-content: center; z-index: 5; flex-wrap: wrap; max-width: 60vw; }

  #trackWrap { position: absolute; left: 0; right: 0; top: 34%; height: 30%; pointer-events: none; }
  #rails { position: absolute; left: 0; right: 0; bottom: -10px; height: 36px;
    background:
      linear-gradient(#8a8fa8, #8a8fa8) 0 6px / 100% 5px no-repeat,
      linear-gradient(#c9cde0, #c9cde0) 0 4px / 100% 3px no-repeat,
      linear-gradient(#8a8fa8, #8a8fa8) 0 20px / 100% 5px no-repeat,
      linear-gradient(#c9cde0, #c9cde0) 0 18px / 100% 3px no-repeat,
      repeating-linear-gradient(90deg, #a8692f 0 16px, transparent 16px 42px) 0 2px / 100% 24px no-repeat,
      repeating-linear-gradient(90deg, rgba(58,45,82,.35) 0 1px, transparent 1px 15px, rgba(58,45,82,.35) 15px 16px, transparent 16px 42px) 0 2px / 100% 24px no-repeat,
      linear-gradient(transparent 22px, #b9a77e 22px 30px, transparent 30px),
      radial-gradient(circle at 6px 8px, #9c8a64 2px, transparent 3px) 0 0 / 14px 12px,
      #d8c49a;
    border-radius: 6px; box-shadow: 0 3px 0 rgba(58,45,82,.18);
  }
  #train { position: absolute; left: 0; bottom: 20px; display: flex; align-items: flex-end; gap: 6px; padding-left: 20px; will-change: transform; }
  #train.arrive { transition: transform 1.6s cubic-bezier(.2,.8,.3,1); }
  #train.leave { transition: transform 1.8s cubic-bezier(.6,0,.9,.5); }
  .engine { line-height: .8; position: relative; flex: none; }
  .engine .sc-svg { overflow: visible; }
  .pt-wheel { animation: none; }
  #train.rolling .pt-wheel { animation: pt-roll .5s linear infinite; }
  @keyframes pt-roll { to { transform: rotate(-360deg); } }
  .puff { position: fixed; z-index: 4; pointer-events: none; border-radius: 50%; background: #fff; box-shadow: inset -5px -5px 0 #dbe6f5, 0 0 0 3px rgba(58,45,82,.18); }
  .car { position: relative; display: grid; place-items: center; border-radius: 16px 16px 10px 10px; border: clamp(2px, .5vw, 4px) solid rgba(58,45,82,.55);
    box-shadow: inset 0 -12px 0 rgba(0,0,0,.13), inset 0 9px 0 rgba(255,255,255,.35); }
  .car::before, .car::after { content: ''; position: absolute; bottom: -22%; width: 26%; aspect-ratio: 1; border-radius: 50%; z-index: 1;
    background: radial-gradient(circle, #ffd23f 0 17%, transparent 19%), repeating-conic-gradient(#4a4a68 0 30deg, #6b6b8c 30deg 60deg);
    border: clamp(2px, .5vw, 4px) solid rgba(58,45,82,.7); box-shadow: inset 0 0 0 clamp(1px, .35vw, 3px) #9aa6c8; }
  #train.rolling .car::before, #train.rolling .car::after { animation: pt-roll .5s linear infinite; }
  .car::before { left: 10%; } .car::after { right: 10%; }
  .car .item { line-height: 1; transition: transform .3s; }
  .car.blank { background: rgba(255,255,255,.75) !important; border-style: dashed; border-color: #64748b; }
  .car.blank .item { opacity: .45; font-weight: 900; color: #475569; font-family: inherit; }
  .car.now { box-shadow: 0 0 0 6px #fde047, 0 0 24px 8px rgba(253, 224, 71, .7); }
  .car.filled .item { animation: kit-pop .45s cubic-bezier(.3,1.6,.5,1); }
  .link { width: 12px; height: 8px; background: #4a4a68; border-radius: 4px; align-self: center; margin-top: 30px; box-shadow: 0 0 0 2px rgba(58,45,82,.25); }

  #choices { position: absolute; left: 0; right: 0; bottom: max(28px, env(safe-area-inset-bottom)); display: flex; justify-content: center; gap: clamp(20px, 5vw, 60px); z-index: 5; pointer-events: none; }
  #choices .choice { pointer-events: auto; }
  .choice { width: clamp(110px, 16vw, 150px); height: clamp(110px, 16vw, 150px); border-radius: 32px; font-size: clamp(60px, 9vw, 86px); background: #fff; }
  .choice .item { line-height: 1; display: inline-block; }
  .choice.hint { animation: kit-pulse 1s ease-in-out infinite; box-shadow: 0 6px 0 rgba(40,50,90,.18), 0 0 0 6px #fde047; }
  .flyer { position: fixed; z-index: 30; pointer-events: none; line-height: 1; transition: transform .45s cubic-bezier(.4,1.2,.6,1); }
</style>
</head>
<body>

<section id="game" class="screen on">
  <a class="btn corner left" href="../../" aria-label="Back to Yas's Games">🏠</a>
  <button id="soundBtn" class="btn corner right" aria-label="Sound on or off">🔊</button>
  <div class="scene" aria-hidden="true"><div id="backdrop"></div><div id="decor"></div></div>
  <div id="stickers"></div>
  <div id="trackWrap"><div id="rails"></div><div id="train"></div></div>
  <div id="choices"></div>
</section>

<script src="/shared/lines.js"></script>
<script src="/shared/voice.js"></script>
<script src="/shared/saved.js"></script>
<script src="/shared/kit.js"></script>
<script src="/shared/scenery.js"></script>
<script>
// ---------- the cartoon engine and the countryside around the track (decoration only) ----------
(() => {
  if (!self.Scenery || !Scenery.add) return;
  const { face, ol, sky, hillsPath, dots, grassTufts } = Scenery.kit;

  // the engine faces left (it leads the train)
  const wheel = (x, y, r) => `<g class="pt-wheel" style="transform-origin:${x}px ${y}px"><circle cx="${x}" cy="${y}" r="${r}" fill="#4a4a68" ${ol()}/>` +
    `<circle cx="${x}" cy="${y}" r="${r - 5}" fill="none" stroke="#9aa6c8" stroke-width="3"/>` +
    `<path d="M${x - r + 4} ${y} H${x + r - 4} M${x} ${y - r + 4} V${y + r - 4}" stroke="#9aa6c8" stroke-width="3"/><circle cx="${x}" cy="${y}" r="${r * .28}" fill="#ffd23f"/></g>`;
  Scenery.add('engine', () => [210, 176,
    [0, 1, 2].map(i => `<circle class="sc-smoke" style="animation-delay:${i * 1.1}s" cx="62" cy="26" r="${12 + i * 3}" fill="#fff"/>`).join('') +
    `<path d="M48 74 L42 34 Q62 24 82 34 L76 74Z" fill="#4a4a68" ${ol()}/><rect x="40" y="28" width="44" height="10" rx="5" fill="#ff5a5a" ${ol(2)}/>` +
    `<path d="M4 158 L28 116 H46 V158Z" fill="#ffd23f" ${ol()}/>` +
    `<rect x="22" y="72" width="116" height="68" rx="30" fill="#ff5a5a" ${ol()}/>` +
    `<path d="M40 82 H124" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".35"/>` +
    `<rect x="60" y="72" width="8" height="68" fill="#ffd23f" opacity=".9"/><rect x="104" y="72" width="8" height="68" fill="#ffd23f" opacity=".9"/>` +
    `<path d="M90 74 A15 15 0 0 1 120 74Z" fill="#ffd23f" ${ol(2)}/>` +
    `<circle cx="24" cy="92" r="10" fill="#fff6a8" ${ol(2)}/><circle cx="21" cy="89" r="3" fill="#fff"/>` +
    `<rect x="132" y="46" width="68" height="96" rx="8" fill="#4f8cff" ${ol()}/>` +
    `<rect x="124" y="32" width="84" height="18" rx="7" fill="#ffd23f" ${ol()}/>` +
    `<rect x="146" y="60" width="38" height="34" rx="7" fill="#c8f0ff" ${ol(2)}/><path d="M152 66 l10 -2" stroke="#fff" stroke-width="4" stroke-linecap="round"/>` +
    `<rect x="14" y="136" width="190" height="14" rx="7" fill="#4a4a68" ${ol(2)}/>` +
    face(86, 108, .72) +
    `<path d="M50 156 H104" stroke="#9aa6c8" stroke-width="6" stroke-linecap="round"/>` +
    wheel(50, 154, 17) + wheel(102, 154, 17) + wheel(168, 150, 22)]);

  // a little bird that flies over the hills
  Scenery.add('bird', (c = '#ff8a5a') => [90, 70,
    `<g class="pt-flap" style="transform-origin:44px 36px"><path d="M44 34 Q24 4 6 12 Q22 26 40 42Z M48 34 Q66 4 84 12 Q68 26 52 42Z" fill="${c}" ${ol(2)}/></g>` +
    `<ellipse cx="46" cy="42" rx="20" ry="15" fill="${c}" ${ol()}/><path d="M64 40 L76 44 L64 48Z" fill="#ffd23f" ${ol(1.5)}/>` +
    `<circle cx="56" cy="38" r="3" fill="#3a2a2a"/><ellipse cx="54" cy="46" rx="4" ry="2.5" fill="#ff8fa8" opacity=".7"/>`]);

  // a railway signal: two lamps that take turns
  Scenery.add('signal', () => [70, 230,
    `<rect x="30" y="80" width="10" height="146" fill="#9aa6c8" ${ol(2)}/><rect x="16" y="220" width="38" height="10" rx="4" fill="#6b6b8c"/>` +
    `<rect x="8" y="6" width="54" height="96" rx="20" fill="#3f3f5a" ${ol()}/>` +
    `<circle cx="35" cy="32" r="14" fill="#ff4d4d" class="pt-lamp1"/><circle cx="35" cy="74" r="14" fill="#4cd964" class="pt-lamp2"/>` +
    `<circle cx="31" cy="28" r="4" fill="#fff" opacity=".6"/><circle cx="31" cy="70" r="4" fill="#fff" opacity=".6"/>`]);

  Scenery.addBackdrop('ptrain', ['#6cc6ff', '#bfe8ff', '#eefaff'], () => sky('ptrain') +
    `<path d="M0 520 L110 400 L210 480 L330 350 L470 490 L600 370 L720 470 L850 360 L1000 500 V700 H0Z" fill="#b9c4f0" opacity=".75"/>` +
    `<path d="M330 350 L300 382 Q318 376 330 390 Q344 376 362 384Z M850 360 L822 390 Q838 384 850 396 Q864 384 880 392Z" fill="#fff" opacity=".9"/>` +
    `<path d="${hillsPath(560, 120, 81, 4)}" fill="#a9e28e"/>` +
    `<path d="${hillsPath(605, 70, 83, 3)}" fill="#86d06a"/>` +
    `<path d="M0 640 H1000 V1000 H0Z" fill="#6cc552"/>` +
    `<path d="M0 780 Q500 750 1000 785 V1000 H0Z" fill="#5ab544"/>` +
    grassTufts(60, 27, 680, 990, '#4c9f3a') + dots(50, 31, 690, 990, ['#ffffff', '#ffe066', '#ff8ad8'], [3, 6]));

  const P = (art, x, y, h, o = {}) => ({ art, x, y, h, ...o });
  const props = () => [
    P('sun', 76, 14, 15, { at: 'center', tap: 'spin' }),
    P('cloud', 16, 10, 12, { at: 'center', anim: 'drift', tap: 'boing' }),
    P('cloud', 52, 22, 8, { at: 'center', anim: 'drift', args: ['#ffffff', '#dcecff', false] }),
    P('bird', 0, 19, 5, { at: 'center', anim: 'across', dur: 26 }),
    P('bird', 0, 26, 4, { at: 'center', anim: 'across', dur: 32, delay: -14, args: ['#7ad6ff'] }),
    P('windmill', 84, 61, 30),
    P('cow', 30, 61, 7),
    P('tree', 7, 62, 30),
    P('pine', 95, 62, 24),
    P('signal', 2, 63, 20, { tap: 'switch' }),
    P('fence', 18, 80, 9),
    P('bush', 86, 81, 10),
    P('flower', 4, 100, 13, { tap: 'bloom' }),
    P('mushroom', 13, 99, 7, { tap: 'boing' }),
    P('flower', 96, 100, 12, { args: ['#b07aff'], tap: 'bloom' }),
    P('butterfly', 60, 74, 5, { at: 'center', anim: 'flutter' }),
  ];
  const giggle = () => [660, 880, 740, 990].forEach((f, i) => Kit.tone(f, .09, { type: 'triangle', vol: .12, delay: i * .07 }));
  function tap(el) {
    switch (el.dataset.tap) {
      case 'spin': Scenery.react(el, 't-spin', 900); giggle(); break;
      case 'bloom': Scenery.react(el, 't-bloom', 900); Kit.tone(700, .25, { type: 'triangle', vol: .12, to: 1300 }); break;
      case 'switch': Scenery.react(el, 't-wiggle', 600); Scenery.react(el, 't-switch', 1500); Kit.tone(1100, .08, { type: 'square', vol: .05 }); Kit.tone(800, .08, { type: 'square', vol: .05, delay: .12 }); break;
      default: Scenery.react(el, 't-boing', 600); Kit.sfx.boing();
    }
  }
  function build() {
    const box = document.getElementById('decor'); box.innerHTML = '';
    Scenery.place(box, props(), innerWidth, innerHeight).forEach(el => {
      if (el.dataset.tap) el.addEventListener('pointerdown', e => { e.stopPropagation(); tap(el); });
    });
  }
  document.getElementById('backdrop').innerHTML = Scenery.backdrop('ptrain');
  build();
  let t = 0; addEventListener('resize', () => { clearTimeout(t); t = setTimeout(build, 200); });
})();
</script>
<script>
(() => {
  const { $, pick, shuffle, sleep } = Kit;

  const THEMES = [
    ['🔴', '🔵', '🟡', '🟢', '🟣'],
    ['🍎', '🍌', '🍇', '🍓', '🍊'],
    ['🐶', '🐱', '🐰', '🐻', '🐸'],
    ['🐠', '🐙', '🐬', '🦀', '🐳'],
    ['🌙', '⭐', '🪐', '🚀', '☀️'],
    ['🦕', '🦖', '🥚', '🌋', '🌴'],
    ['👑', '💎', '🦄', '🏰', '🌸'],
  ];
  const CAR_COLORS = ['#f87171', '#fb923c', '#facc15', '#4ade80', '#60a5fa', '#a78bfa', '#f472b6'];

  // each level: how the repeating unit looks, how many cars, and which cars are empty
  //   letters are items; lower case = same item but small
  const LEVELS = [
    { units: ['AB'], cars: 5, blanks: 'end1', themes: [0] },
    { units: ['AB'], cars: 5, blanks: 'end1' },
    { units: ['AAB', 'ABB'], cars: 6, blanks: 'end1' },
    { units: ['ABC'], cars: 6, blanks: 'end1' },
    { units: ['AB', 'ABC'], cars: 6, blanks: 'middle' },
    { units: ['AABB'], cars: 7, blanks: 'end1' },
    { units: ['Aa', 'Aaa', 'aA'], cars: 6, blanks: 'end1' },
    { units: ['ABC', 'AAB'], cars: 7, blanks: 'end2' },
  ];
  const STREAK_TO_LEVEL_UP = 3;

  const save = Kit.store('pattern-train');
  const saved = save.get({ level: 0, stickers: 0 });
  let level = Math.min(saved.level, LEVELS.length - 1), streak = 0;
  let train = null, busy = false, misses = 0;

  function paintStickers() {
    const n = saved.stickers;
    $('stickers').textContent = n ? (n > 12 ? '🚂 × ' + n : '🚂'.repeat(n)) : '🚂';
    $('stickers').style.opacity = n ? 1 : .5;
  }

  function makeTrain() {
    const L = LEVELS[level];
    const theme = L.themes ? THEMES[pick(L.themes)] : pick(THEMES);
    const [A, B, C] = shuffle(theme);
    const unit = pick(L.units);
    const items = { A: { e: A, s: 1 }, B: { e: B, s: 1 }, C: { e: C, s: 1 }, a: { e: A, s: .55 } };
    const seq = Array.from({ length: L.cars }, (_, i) => items[unit[i % unit.length]]);
    let blanks;
    if (L.blanks === 'end1') blanks = [L.cars - 1];
    else if (L.blanks === 'end2') blanks = [L.cars - 2, L.cars - 1];
    else blanks = [pick([...Array(L.cars).keys()].filter(i => i >= unit.length))];
    // the choices: always include the right item(s) plus look-alikes from the same theme
    const key = it => it.e + it.s;
    const pool = new Map();
    for (const i of blanks) pool.set(key(seq[i]), seq[i]);
    const extras = shuffle([...Object.values(items).filter(it => unit.includes(Object.keys(items).find(k => items[k] === it))),
      ...theme.map(e => ({ e, s: 1 })), ...(unit.includes('a') ? [{ e: A, s: .55 }, { e: B, s: .55 }] : [])]);
    for (const it of extras) { if (pool.size >= 3) break; pool.set(key(it), it); }
    return { seq, blanks, filled: [], choices: shuffle([...pool.values()]), car: pick(CAR_COLORS), unit };
  }

  function sizes() {
    const n = train.seq.length + 1.4;
    const car = Math.min(140, (innerWidth - 60) / n - 16, innerHeight * .2);
    return { car, font: car * .62 };
  }

  function paintTrain() {
    const t = $('train'); t.innerHTML = '';
    const { car, font } = sizes();
    const eng = document.createElement('div'); eng.className = 'engine';
    if (self.Scenery && Scenery.ARTS.includes('engine')) {
      const h = car * 1.2;
      eng.innerHTML = Scenery.art('engine').svg;
      eng.style.height = h + 'px'; eng.style.width = h * 210 / 176 + 'px'; eng.style.marginBottom = -car * .2 + 'px';
    } else { eng.textContent = '🚂'; eng.style.fontSize = car * 1.25 + 'px'; }
    t.appendChild(eng);
    train.seq.forEach((it, i) => {
      const link = document.createElement('div'); link.className = 'link'; t.appendChild(link);
      const c = document.createElement('div'); c.className = 'car';
      c.style.width = car + 'px'; c.style.height = car * .9 + 'px';
      c.style.background = train.car;
      const blank = train.blanks.includes(i) && !train.filled.includes(i);
      if (blank) c.classList.add('blank');
      if (blank && i === nextBlank()) c.classList.add('now');
      const span = document.createElement('span'); span.className = 'item';
      span.textContent = blank ? '?' : it.e;
      span.style.fontSize = (blank ? font * .9 : font * it.s) + 'px';
      c.appendChild(span); c.dataset.i = i;
      t.appendChild(c);
    });
  }
  const nextBlank = () => train.blanks.find(i => !train.filled.includes(i));

  function paintChoices() {
    const box = $('choices'); box.innerHTML = '';
    for (const it of train.choices) {
      const b = document.createElement('button'); b.className = 'btn choice';
      const span = document.createElement('span'); span.className = 'item'; span.textContent = it.e;
      span.style.transform = `scale(${it.s})`;
      b.appendChild(span); b.onclick = () => choose(it, b);
      box.appendChild(b);
    }
  }

  function whistle() { Kit.tone(587, .35, { type: 'triangle', vol: .14 }); Kit.tone(740, .35, { type: 'triangle', vol: .1 }); Kit.tone(587, .4, { type: 'triangle', vol: .14, delay: .4 }); Kit.tone(740, .4, { type: 'triangle', vol: .1, delay: .4 }); }
  function chug(n = 6, gap = .16) { for (let i = 0; i < n; i++) Kit.tone(110, .1, { type: 'sawtooth', vol: .05, to: 60, delay: i * gap }); }
  // round white puffs from the chimney that stay behind as the train rolls
  function smoke() {
    const e = document.querySelector('.engine'); if (!e) return;
    const r = e.getBoundingClientRect(), x = r.left + r.width * .3, y = r.top + r.height * .14;
    for (let i = 0; i < 4; i++) {
      const p = document.createElement('div'); p.className = 'puff';
      const z = r.height * Kit.rand(.16, .28);
      p.style.width = p.style.height = z + 'px'; p.style.left = x - z / 2 + 'px'; p.style.top = y - z / 2 + 'px';
      document.body.appendChild(p);
      p.animate([{ transform: 'translate(0, 0) scale(.4)', opacity: .95 }, { transform: `translate(${Kit.rand(-10, 50)}px, ${-Kit.rand(60, 130)}px) scale(1.5)`, opacity: 0 }],
        { duration: 1200, delay: i * 130, easing: 'ease-out', fill: 'both' });
      setTimeout(() => p.remove(), 1400 + i * 130);
    }
  }

  async function arrive(first = false) {
    busy = true; misses = 0;
    train = makeTrain();
    paintTrain(); $('choices').innerHTML = '';
    const t = $('train');
    t.classList.remove('arrive', 'leave', 'rolling'); t.style.transform = `translateX(${innerWidth + 50}px)`;
    void t.offsetWidth;
    t.classList.add('arrive', 'rolling'); t.style.transform = `translateX(${Math.max(0, (innerWidth - t.scrollWidth) / 2)}px)`;
    chug(9); setTimeout(smoke, 500); setTimeout(smoke, 1100);
    await sleep(1650);
    t.classList.remove('rolling');
    whistle(); paintChoices(); busy = false;
    Kit.say(first ? 'pt.intro' : LEVELS[level].blanks === 'middle' ? 'pt.missing' : 'pt.next');
  }

  async function choose(it, btn) {
    if (busy) return;
    const i = nextBlank(), want = train.seq[i];
    const right = it.e === want.e && it.s === want.s;
    if (!right) {
      misses++; Kit.flash(btn, 'wobble'); Kit.sfx.oops(); Kit.say('pt.tryAgain');
      if (misses >= 2) [...$('choices').children].forEach((b, k) => b.classList.toggle('hint', train.choices[k] === want || (train.choices[k].e === want.e && train.choices[k].s === want.s)));
      return;
    }
    busy = true;
    // the item flies up into its car
    const car = document.querySelector(`.car[data-i="${i}"]`), br = btn.getBoundingClientRect(), cr = car.getBoundingClientRect();
    const fly = document.createElement('div'); fly.className = 'flyer'; fly.textContent = it.e;
    const { font } = sizes();
    fly.style.fontSize = font * it.s + 'px'; fly.style.left = (br.left + br.width / 2 - font * it.s / 2) + 'px'; fly.style.top = (br.top + br.height / 2 - font * it.s / 2) + 'px';
    document.body.appendChild(fly);
    await sleep(20);
    fly.style.transform = `translate(${cr.left + cr.width / 2 - br.left - br.width / 2}px, ${cr.top + cr.height / 2 - br.top - br.height / 2}px)`;
    Kit.sfx.pop();
    await sleep(470); fly.remove();
    train.filled.push(i); misses = 0;
    paintTrain();
    document.querySelector(`.car[data-i="${i}"]`).classList.add('filled');
    Kit.sfx.ding();
    if (nextBlank() !== undefined) { paintChoices(); busy = false; return; }
    await win();
  }

  async function win() {
    $('choices').innerHTML = '';
    Kit.burstAt($('train'), ['⭐', '✨', '🎉'], 16, 220);
    Kit.say(['pt.yes1', 'pt.yes2', 'pt.yes3']);
    whistle();
    saved.stickers++; streak++;
    let levelUp = false;
    if (streak >= STREAK_TO_LEVEL_UP && level < LEVELS.length - 1) { level++; streak = 0; levelUp = true; }
    saved.level = level; save.set(saved); paintStickers();
    await sleep(1500);
    const t = $('train');
    t.classList.remove('arrive'); t.classList.add('leave', 'rolling');
    t.style.transform = `translateX(${-t.scrollWidth - 80}px)`;
    chug(10, .13); smoke(); setTimeout(smoke, 400);
    await sleep(1900);
    if (levelUp) { Kit.sfx.yay(); Kit.say('pt.levelUp'); await sleep(2600); }
    arrive();
  }

  Kit.soundButton('soundBtn');
  paintStickers();
  addEventListener('resize', () => { if (train && !busy) { paintTrain(); const t = $('train'); t.classList.remove('arrive'); t.style.transform = `translateX(${Math.max(0, (innerWidth - t.scrollWidth) / 2)}px)`; } });
  setTimeout(() => arrive(true), 400);
})();
</script>
</body>
</html>
