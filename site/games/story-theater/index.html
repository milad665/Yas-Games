<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Story Theater">
<meta name="theme-color" content="#7c2d12">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/shared/kit.css">
<title>Story Theater</title>
<style>
  body { background: #7c2d12; }

  /* ---------- stage picker ---------- */
  #pick {
    flex-direction: column; align-items: center; justify-content: center; gap: 4vh; background: #3a1450;
  }
  #pick > .title, #stages { position: relative; z-index: 1; }
  #pickBg, #pickBg .fill { position: absolute; inset: 0; }
  #pickBg .fill:last-child { pointer-events: none; }
  #pick .title span { -webkit-text-stroke: 3px #7f1d1d; }
  #stages { display: flex; flex-wrap: wrap; gap: clamp(16px, 3vw, 34px); justify-content: center; padding: 0 20px; }
  .stagePick {
    width: clamp(130px, 18vw, 180px); height: clamp(130px, 18vw, 180px); border-radius: 30px; border: 7px solid #fde68a; padding: 0; overflow: hidden;
    font-size: clamp(56px, 8vw, 80px); display: grid; place-items: center; cursor: pointer; position: relative; background: #fff;
    box-shadow: 0 10px 0 rgba(0,0,0,.25); animation: kit-bob 3s ease-in-out infinite; touch-action: manipulation;
  }
  .stagePick .thumb { position: absolute; inset: 0; pointer-events: none; }
  .stagePick .icon { position: relative; filter: drop-shadow(0 4px 3px rgba(0,0,0,.3)); pointer-events: none; }
  .stagePick .film { position: absolute; right: 6px; top: 4px; font-size: 34px; filter: drop-shadow(0 2px 2px rgba(0,0,0,.3)); }

  /* ---------- stage ---------- */
  #stage { flex-direction: column; }
  #scene { position: relative; flex: 1; overflow: hidden; background: #3a1450; }
  #backdrop, #decor, #frame { position: absolute; inset: 0; }
  #decor { pointer-events: none; }
  /* the theatre around every set: side curtains, a swag on top, footlights */
  #frame { pointer-events: none; z-index: 8; --cw: 60px; --vh: 50px; }
  #frame .side { position: absolute; top: 0; bottom: 0; width: var(--cw); transform-origin: 50% 0; animation: st-sway 7s ease-in-out infinite; }
  #frame .side.l { left: 0; } #frame .side.r { right: 0; animation-delay: -3.5s; }
  #frame .side.r svg { transform: scaleX(-1); }
  #frame .top { position: absolute; left: 0; right: 0; top: 0; height: var(--vh); }
  #frame svg { width: 100%; height: 100%; display: block; }
  #frame .lights {
    position: absolute; left: 0; right: 0; bottom: 0; height: 12px; background: #5a2a14; border-top: 3px solid #ffcf6b;
    background-image: radial-gradient(circle at 50% 0, #fffbd0 0 4px, rgba(255,230,120,.55) 5px, transparent 11px);
    background-size: 56px 12px; background-position: 28px 0; animation: st-glow 2.4s ease-in-out infinite;
  }
  @keyframes st-sway { 0%,100% { transform: skewX(0deg); } 50% { transform: skewX(1.2deg); } }
  @keyframes st-glow { 50% { filter: brightness(1.25); } }
  /* curtains that part when a stage opens */
  #drapes { position: absolute; inset: 0; z-index: 19; pointer-events: none; overflow: hidden; }
  #drapes .drape { position: absolute; top: 0; bottom: 0; width: 51%; transition: translate 1.3s cubic-bezier(.6,0,.3,1); }
  #drapes .drape.l { left: 0; } #drapes .drape.r { right: 0; }
  #drapes .drape.r svg { transform: scaleX(-1); }
  #drapes svg { width: 100%; height: 100%; display: block; }
  #drapes.open .drape.l { translate: -101% 0; } #drapes.open .drape.r { translate: 101% 0; }
  #drapes.snap .drape { transition: none; }
  .actor { position: absolute; left: 0; top: 0; line-height: 1; touch-action: none; cursor: grab; will-change: transform; }
  .actor .face { display: inline-block; filter: drop-shadow(0 6px 4px rgba(0,0,0,.25)); }
  .actor.lift .face { filter: drop-shadow(0 16px 10px rgba(0,0,0,.3)); }
  .a-jump  { animation: aJump .7s cubic-bezier(.3,1.5,.5,1); }
  .a-spin  { animation: kit-spin .7s ease-in-out; }
  .a-wiggle{ animation: aWiggle .7s ease-in-out; }
  .a-grow  { animation: aGrow .7s ease-in-out; }
  @keyframes aJump { 40% { translate: 0 -45%; } }
  @keyframes aWiggle { 20% { rotate: -18deg; } 40% { rotate: 18deg; } 60% { rotate: -12deg; } 80% { rotate: 12deg; } }
  @keyframes aGrow { 50% { scale: 1.45; } }

  .topbar { position: absolute; top: max(14px, env(safe-area-inset-top)); left: max(14px, env(safe-area-inset-left)); right: max(14px, env(safe-area-inset-right)); display: flex; gap: 12px; align-items: center; z-index: 20; pointer-events: none; }
  .topbar .btn { width: 68px; height: 68px; font-size: 34px; pointer-events: auto; }
  .spacer { flex: 1; }
  #recBtn { background: #fff; }
  #recBtn .dot { width: 34px; height: 34px; border-radius: 50%; background: #ef4444; }
  #recBtn.rec .dot { border-radius: 8px; animation: kit-pulse 1s infinite; }
  #recBtn.rec { box-shadow: 0 6px 0 rgba(0,0,0,.18), 0 0 0 6px #ef4444; }
  #recTime { display: none; font-size: 26px; font-weight: 900; color: #fff; background: #ef4444; padding: 6px 16px; border-radius: 999px; pointer-events: none; }
  #recTime.on { display: block; }
  #filmBtn.ready { animation: kit-pulse 1.2s infinite; }

  #countdown { position: absolute; inset: 0; display: none; place-items: center; z-index: 30; background: rgba(0,0,0,.35); font-size: 30vmin; font-weight: 900; color: #fff; text-shadow: 0 10px 0 rgba(0,0,0,.3); }
  #countdown.on { display: grid; }
  #theEnd { position: absolute; inset: 0; display: none; place-items: center; z-index: 30; pointer-events: none; font-size: 22vmin; }
  #theEnd.on { display: grid; animation: kit-pop .5s cubic-bezier(.3,1.6,.5,1); }
  .playing #tray, .playing .topbar .btn:not(#filmBtn) { opacity: .3; pointer-events: none; }
  .letterbox::before, .letterbox::after { content: ''; position: absolute; left: 0; right: 0; height: 7%; background: #000; z-index: 25; }
  .letterbox::before { top: 0; } .letterbox::after { bottom: 0; }

  #trash {
    position: absolute; right: 20px; top: 50%; translate: 0 -50%; z-index: 22; width: 100px; height: 100px; border-radius: 50%;
    background: rgba(255,255,255,.85); font-size: 52px; display: grid; place-items: center; scale: 0; transition: scale .2s; pointer-events: none;
  }
  #trash.show { scale: 1; } #trash.hot { scale: 1.3; background: #fca5a5; }

  #tray {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; padding: 10px 14px;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
    background: repeating-linear-gradient(90deg, #92400e 0 40px, #a16207 40px 80px); box-shadow: 0 -6px 16px rgba(0,0,0,.3);
  }
  .item {
    width: 72px; height: 72px; border-radius: 20px; background: rgba(255,255,255,.9); font-size: 46px; line-height: 1;
    display: grid; place-items: center; touch-action: none; cursor: grab; box-shadow: 0 4px 0 rgba(0,0,0,.25);
  }
  .item.prop { background: rgba(255,247,214,.9); }
</style>
</head>
<body>

<!-- STAGE PICKER -->
<section id="pick" class="screen on">
  <div id="pickBg"></div>
  <a class="btn corner left" href="../../" aria-label="Back to Yas's Games">🏠</a>
  <button id="soundBtn" class="btn corner right" aria-label="Sound on or off">🔊</button>
  <h1 id="title" class="title"></h1>
  <div id="stages"></div>
</section>

<!-- STAGE -->
<section id="stage" class="screen">
  <div id="scene">
    <div id="backdrop"></div>
    <div id="decor"></div>
    <div id="frame"></div>
    <div id="actors"></div>
    <div id="drapes"><div class="drape l"></div><div class="drape r"></div></div>
    <div class="topbar">
      <button id="backBtn" class="btn" aria-label="Choose another stage">🏠</button>
      <div class="spacer"></div>
      <div id="recTime"></div>
      <button id="recBtn" class="btn" aria-label="Record"><div class="dot"></div></button>
      <button id="filmBtn" class="btn" aria-label="Watch the movie" disabled>🎬</button>
    </div>
    <div id="trash">🗑️</div>
    <div id="countdown"></div>
    <div id="theEnd">🎬</div>
  </div>
  <div id="tray"></div>
</section>

<script src="/shared/lines.js"></script>
<script src="/shared/edition.js"></script>
<script src="/shared/voice.js"></script>
<script src="/shared/saved.js"></script>
<script src="/shared/kit.js"></script>
<script src="/shared/scenery.js"></script>
<script>
(() => {
  const { $, rand, pick, sleep } = Kit;

  // ---------- the sets: a cartoon backdrop plus props (see /shared/scenery.js) ----------
  const P = (art, x, y, h, o = {}) => ({ art, x, y, h, ...o });
  const STAGES = {
    castle: { icon: '🏰', cast: ['👸', '🤴', '🧚', '🦄', '🐉', '🧙'], back: 'castle',
      props: [P('rainbow', 24, 24, 20, { at: 'center' }), P('cloud', 70, 14, 10, { at: 'center', anim: 'drift', args: ['#fff0fa', '#ffd6ee'], tap: 'wiggle' }),
              P('castle', 52, 70, 44, { tap: 'sparkle' }), P('blossom', 16, 82, 30, { tap: 'wiggle' }), P('blossom', 86, 84, 26, { flip: true, tap: 'wiggle' }),
              P('sparkle', 80, 32, 4, { at: 'center', anim: 'twinkle' }), P('sparkle', 34, 44, 3, { at: 'center', anim: 'twinkle' }), P('sparkle', 62, 10, 4, { at: 'center', anim: 'twinkle' }),
              P('flower', 27, 97, 10, { args: ['#ff8ad8'], tap: 'bloom' }), P('flower', 73, 98, 9, { args: ['#fff3a0'], tap: 'bloom' }),
              P('butterfly', 40, 56, 5, { at: 'center', anim: 'flutter', args: ['#ffd23f', '#ff6fb5'] })] },
    ocean:  { icon: '🌊', cast: ['🧜‍♀️', '🐬', '🐙', '🦈', '🐠', '🐢'], back: 'ocean', extras: { bubbles: 10 },
      props: [P('fish', 0, 30, 7, { at: 'center', anim: 'across', dur: 22 }), P('fish', 0, 52, 5, { at: 'center', anim: 'across', dur: 16, delay: -8, args: ['#7ad6ff', '#ffe14d'] }),
              P('jellyfish', 78, 30, 13, { at: 'center', anim: 'bob', tap: 'boing' }),
              P('seaweed', 12, 99, 28, { tap: 'wiggle' }), P('coral', 24, 99, 16), P('seaweed', 34, 99, 18, { args: ['#5ad08a'] }),
              P('chest', 62, 98, 13, { tap: 'open' }), P('starfish', 46, 99, 7, { tap: 'spin' }), P('shell', 74, 99, 5, { tap: 'boing' }),
              P('coral', 82, 99, 15, { args: ['#b07aff'] }), P('seaweed', 90, 99, 24, { tap: 'wiggle' })] },
    space:  { icon: '🚀', cast: ['👩‍🚀', '👽', '🛸', '🤖', '🚀', '☄️'], back: 'space', extras: { stars: 50, shooting: true },
      props: [P('planet', 76, 24, 20, { at: 'center', anim: 'bob', tap: 'spin' }), P('moon', 18, 20, 15, { at: 'center', tap: 'boing' }),
              P('earth', 60, 60, 11, { at: 'center', tap: 'spin' }), P('ufo', 40, 26, 14, { at: 'center', anim: 'bob', tap: 'beam' }),
              P('rocket', 88, 95, 24, { tap: 'launch' })] },
    forest: { icon: '🌳', cast: ['🦊', '🐻', '🦉', '🐿️', '🐰', '🦔'], back: 'st-forest',
      props: [P('sun', 50, 12, 13, { at: 'center', tap: 'spin' }),
              P('pine', 27, 75, 22, { args: ['#3f9a5a', false] }), P('pine', 71, 73, 26, { args: ['#3f9a5a', false] }), P('bush', 42, 80, 10),
              P('pine', 13, 85, 44, { args: ['#2f8a5a', false], tap: 'wiggle' }), P('tree', 87, 85, 46, { args: ['#4fb84a', '#7ad66a', ''], tap: 'wiggle' }),
              P('owl', 84, 46, 13, { at: 'center', tap: 'hoot' }),
              P('mushroom', 33, 95, 7, { tap: 'boing' }), P('mushroom', 64, 97, 5, { tap: 'boing' }), P('flower', 52, 97, 9, { args: ['#ffd23f', '#ff8a3c'], tap: 'bloom' }),
              P('butterfly', 30, 44, 5, { at: 'center', anim: 'flutter' })] },
    farm:   { icon: '🐄', cast: ['🐄', '🐷', '🐔', '🐴', '🐑', '🧑‍🌾'], back: 'farm',
      props: [P('sun', 60, 13, 13, { at: 'center', tap: 'spin' }), P('cloud', 30, 15, 10, { at: 'center', anim: 'drift', tap: 'wiggle' }),
              P('barn', 22, 75, 34, { tap: 'loft' }), P('windmill', 82, 75, 42, { tap: 'fast' }), P('fence', 52, 77, 9),
              P('hay', 63, 83, 7, { tap: 'boing' }), P('sunflower', 10, 97, 22, { tap: 'bloom' }), P('sunflower', 92, 98, 18, { tap: 'bloom' })] },
  };

  // a forest set for the woodland stage, drawn in the same style as the shared backdrops
  const SK = Scenery.kit;
  Scenery.addBackdrop('st-forest', ['#8fd6ff', '#cdefff', '#ecfbe2'], () => {
    const r = SK.seeded(5);
    let trees = '';
    for (const [y, col, off] of [[560, '#8fd08a', 0], [650, '#5fb469', 45]]) {
      trees += `<rect x="0" y="${y}" width="1000" height="${1000 - y}" fill="${col}"/>`;
      for (let i = 0; i < 12; i++) {
        const x = i * 90 + off + r() * 20, rr = 46 + r() * 34;
        trees += `<circle cx="${x.toFixed(0)}" cy="${(y - rr * .45).toFixed(0)}" r="${rr.toFixed(0)}" fill="${col}"/><circle cx="${(x + rr * .55).toFixed(0)}" cy="${(y - rr * .1).toFixed(0)}" r="${(rr * .7).toFixed(0)}" fill="${col}"/>`;
      }
    }
    return SK.sky('st-forest') + trees +
      `<g class="sc-rays">${[120, 380, 650].map(x => `<path d="M${x} 0 H${x + 70} L${x + 280} 820 H${x + 130}Z" fill="#fffbe0" opacity=".16"/>`).join('')}</g>` +
      `<path d="M0 745 Q500 712 1000 748 V1000 H0Z" fill="#7ccc58"/>` +
      `<path d="M455 1000 Q480 860 520 745 L552 745 Q570 860 650 1000Z" fill="#e2c08e"/>` +
      `<path d="M0 905 Q500 872 1000 908 V1000 H0Z" fill="#6ab84a" opacity=".6"/>` +
      SK.grassTufts(50, 8, 755, 990, '#5aa83e') + SK.dots(30, 9, 765, 990, ['#ffffff', '#ffe066', '#ff9fd2'], [3, 6]);
  });

  // theatre pieces (stretched to fit, so the outlines don't scale)
  const NS = 'vector-effect="non-scaling-stroke"', OLS = `stroke="${SK.OL}" stroke-opacity=".55" stroke-width="3" ${NS}`;
  const SIDE = `<svg viewBox="0 0 100 1000" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0 0 H100 C96 260 72 470 48 600 C42 640 44 680 52 720 C64 820 74 920 78 1000 H0Z" fill="#c8213e" ${OLS}/>
    <path d="M24 0 C26 250 22 450 14 606 M50 0 C54 250 44 450 28 610 M76 0 C80 220 64 450 40 606 M16 660 C22 800 24 900 24 1000 M38 668 C50 800 54 900 58 1000" stroke="#9a1530" stroke-width="5" fill="none" ${NS}/>
    <path d="M9 0 C11 250 9 450 6 600" stroke="#ee5a72" stroke-width="5" fill="none" opacity=".7" ${NS}/>
    <path d="M0 598 Q32 596 50 610 Q58 620 50 630 Q32 644 0 642Z" fill="#ffcf3a" ${OLS}/><path d="M46 626 Q50 660 44 690 Q54 688 60 690 Q56 660 56 628Z" fill="#ffcf3a" ${OLS}/>
    <path d="M0 960 H78 V1000 H0Z" fill="#ffcf3a" opacity=".9"/></svg>`;
  const TOP = `<svg viewBox="0 0 1000 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0 0 H1000 V56 ${Array.from({ length: 8 }, (_, i) => `Q${1000 - i * 125 - 62} 104 ${1000 - (i + 1) * 125} 56`).join(' ')}Z" fill="#c8213e" ${OLS}/>
    <path d="M0 56 ${Array.from({ length: 8 }, (_, i) => `Q${i * 125 + 62} 104 ${(i + 1) * 125} 56`).join(' ')}" stroke="#ffcf3a" stroke-width="5" fill="none" ${NS}/>
    <rect width="1000" height="14" fill="#9a1530"/>
    ${Array.from({ length: 9 }, (_, i) => `<circle cx="${i * 125}" cy="58" r="9" fill="#ffcf3a" ${OLS}/>`).join('')}</svg>`;
  const DRAPE = `<svg viewBox="0 0 500 1000" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"><rect width="500" height="1000" fill="#c8213e"/>
    ${Array.from({ length: 10 }, (_, i) => `<path d="M${i * 50 + 25} 0 Q${i * 50 + 14} 500 ${i * 50 + 28} 1000" stroke="#9a1530" stroke-width="9" fill="none"/><path d="M${i * 50 + 8} 0 Q${i * 50} 500 ${i * 50 + 10} 1000" stroke="#e44a64" stroke-width="5" fill="none" opacity=".6"/>`).join('')}
    <rect x="486" width="14" height="1000" fill="#ffcf3a"/><rect y="972" width="500" height="28" fill="#ffcf3a"/></svg>`;
  $('frame').innerHTML = `<div class="side l">${SIDE}</div><div class="side r">${SIDE}</div><div class="top">${TOP}</div><div class="lights"></div>`;
  document.querySelectorAll('#drapes .drape').forEach(d => { d.innerHTML = DRAPE; });

  // tapping the scenery: a little wiggle, spin or surprise and a sound
  const T = (f, d, o) => Kit.tone(f, d, o);
  const SOUNDS = {
    rustle: () => [0, 1, 2].forEach(i => T(1800 + i * 300, .06, { type: 'sawtooth', vol: .025, to: 1200, delay: i * .05 })),
    giggle: () => [0, 1, 2, 3].forEach(i => T(760 + i * 40, .07, { type: 'square', vol: .05, to: 980, delay: i * .08 })),
    beam: () => [0, 1, 2, 3, 4].forEach(i => T(600 + i * 120, .5, { vol: .06, to: 700 + i * 140, delay: i * .1 })),
    launch: () => { T(120, 1.3, { type: 'sawtooth', vol: .07, to: 900 }); T(80, 1.2, { type: 'square', vol: .04, to: 300 }); },
    moo: () => { T(150, .9, { type: 'sawtooth', vol: .1, to: 120, attack: .2 }); T(225, .9, { type: 'triangle', vol: .05, to: 180, attack: .2 }); },
    hoot: () => [0, 1].forEach(i => T(420, .35, { vol: .16, to: 360, delay: i * .45, attack: .06 })),
  };
  function tapDecor(el) {
    if (playing) return;
    const re = (cls, ms) => Scenery.react(el, cls, ms), r = el.getBoundingClientRect(), cx = r.left + r.width / 2;
    switch (el.dataset.tap) {
      case 'spin': re('t-spin', 900); Kit.sfx.whoosh(); break;
      case 'boing': re('t-boing', 600); Kit.sfx.boing(); break;
      case 'wiggle': re('t-wiggle', 600); SOUNDS.rustle(); break;
      case 'bloom': re('t-bloom', 900); SOUNDS.giggle(); break;
      case 'sparkle': re('t-boing', 600); Kit.sfx.yay(); Kit.burst(cx, r.top + r.height * .2, ['✨', '⭐', '🌟'], 10, 160); break;
      case 'open': re('t-open', 2600); Kit.sfx.ding(); Kit.burst(cx, r.top + r.height * .3, ['✨', '💎', '⭐'], 8, 110); break;
      case 'beam': re('t-beam', 2200); SOUNDS.beam(); break;
      case 'launch': re('t-launch', 3400); SOUNDS.launch(); break;
      case 'loft': re('t-loft', 2200); SOUNDS.moo(); break;
      case 'fast': re('t-fast', 2500); Kit.sfx.whoosh(); break;
      case 'hoot': re('t-hoot', 900); SOUNDS.hoot(); break;
    }
  }
  const hookTaps = els => els.forEach(el => el.dataset.tap && el.addEventListener('pointerdown', e => { e.stopPropagation(); tapDecor(el); }));

  const PROPS = ['🎁', '⭐', '🌈', '❤️', '🍰', '🎈'];
  const ACTIONS = [
    { cls: 'a-jump', sound: () => Kit.sfx.boing() },
    { cls: 'a-spin', sound: () => Kit.sfx.whoosh() },
    { cls: 'a-wiggle', sound: () => [0, 1, 2].forEach(i => Kit.tone(600 + i * 80, .08, { type: 'square', vol: .05, delay: i * .09 })) },
    { cls: 'a-grow', sound: () => Kit.tone(300, .5, { type: 'triangle', to: 900 }) },
  ];
  const MAX_SECONDS = 60;
  const save = Kit.store('story-theater');
  const saved = save.get({ scenes: {}, movies: {} });

  // ---------- movies live in IndexedDB (they include her voice) ----------
  const db = new Promise(ok => {
    try {
      const req = indexedDB.open('yasGames.storyTheater', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('movies');
      req.onsuccess = () => ok(req.result);
      req.onerror = () => ok(null);
    } catch (e) { ok(null); }
  });
  async function dbDo(mode, fn) {
    const d = await db; if (!d) return null;
    return new Promise(ok => {
      try { const tx = d.transaction('movies', mode), r = fn(tx.objectStore('movies')); r.onsuccess = () => ok(r.result); r.onerror = () => ok(null); }
      catch (e) { ok(null); }
    });
  }
  const loadMovie = key => dbDo('readonly', s => s.get(key));
  const saveMovie = (key, m) => dbDo('readwrite', s => s.put(m, key));

  // ---------- picker ----------
  Kit.title('title', 'Story Theater');
  function paintPicker() {
    $('stages').innerHTML = '';
    for (const [key, st] of Object.entries(STAGES)) {
      const b = document.createElement('button');
      b.className = 'stagePick';
      b.innerHTML = '<div class="thumb">' + Scenery.backdrop(st.back) + '</div><span class="icon">' + st.icon + '</span>';
      b.setAttribute('aria-label', key);
      b.style.animationDelay = -Kit.rand(0, 3) + 's';
      if (saved.movies[key]) { const f = document.createElement('span'); f.className = 'film'; f.textContent = '🎬'; b.appendChild(f); }
      b.onclick = () => { Kit.sfx.pop(); openStage(key); };
      $('stages').appendChild(b);
    }
  }
  // the picker is a theatre too: curtains, spotlights and balloons
  function paintPickBg() {
    const bg = $('pickBg');
    bg.innerHTML = '<div class="fill">' + Scenery.backdrop('stage') + '</div><div class="fill"></div>';
    hookTaps(Scenery.place(bg.lastChild, [
      P('spotlight', 26, 0, 78, { at: 'top' }), P('spotlight', 74, 0, 78, { at: 'top' }),
      P('sparkle', 14, 30, 4, { at: 'center', anim: 'twinkle' }), P('sparkle', 86, 24, 5, { at: 'center', anim: 'twinkle' }), P('sparkle', 50, 12, 4, { at: 'center', anim: 'twinkle' }),
      P('balloons', 7, 94, 26, { tap: 'boing' }), P('balloons', 93, 94, 22, { flip: true, tap: 'boing' }),
    ], innerWidth, innerHeight));
  }
  paintPickBg();
  paintPicker();
  Kit.soundButton('soundBtn');
  Kit.say('st.pick');

  // ---------- stage ----------
  let stageKey = null, actors = [], nextId = 1, W = 0, H = 0;
  let recording = null, playing = false, starting = false;

  function openStage(key) {
    stageKey = key;
    const st = STAGES[key];
    document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === 'stage'));
    $('scene').className = 'st-' + key;
    // the curtains part
    const dr = $('drapes');
    dr.classList.add('snap'); dr.classList.remove('open'); void dr.offsetWidth; dr.classList.remove('snap');
    setTimeout(() => { dr.classList.add('open'); Kit.sfx.whoosh(); }, 250);
    // tray
    const tray = $('tray'); tray.innerHTML = '';
    [...st.cast.map(e => [e, false]), ...PROPS.map(e => [e, true])].forEach(([emo, prop]) => {
      const it = document.createElement('div');
      it.className = 'item' + (prop ? ' prop' : ''); it.textContent = emo;
      it.addEventListener('pointerdown', e => dragFromTray(e, emo));
      tray.appendChild(it);
    });
    measure();   // after the tray is filled, so the stage size is right
    buildDecor();
    // actors from last time
    clearActors();
    (saved.scenes[key] || []).forEach(a => addActor(a.e, a.x, a.y, a.flip));
    $('filmBtn').disabled = !saved.movies[key];
    $('filmBtn').classList.toggle('ready', !!saved.movies[key]);
    Kit.say('st.' + key, actors.length ? null : 'st.intro');
  }
  function measure() { const r = $('scene').getBoundingClientRect(); W = r.width; H = r.height; }
  function buildDecor() {
    const st = STAGES[stageKey];
    $('backdrop').innerHTML = Scenery.backdrop(st.back);
    const d = $('decor'); d.innerHTML = '';
    if (st.extras) Scenery.extras(d, st.extras);
    hookTaps(Scenery.place(d, st.props, W, H));
    $('frame').style.setProperty('--cw', Math.round(Math.max(26, Math.min(W * .085, H * .13))) + 'px');
    $('frame').style.setProperty('--vh', Math.round(Math.max(26, Math.min(H * .09, 64))) + 'px');
  }

  // further back (higher up) = smaller
  function sizeAt(y) { return Math.min(W, H) * .17 * (.55 + .65 * y); }
  function place(a) {
    const s = sizeAt(a.y);
    a.el.style.fontSize = s + 'px';
    a.el.style.transform = `translate(${a.x * W - s / 2}px, ${a.y * H - s * .9}px)`;
    a.el.style.zIndex = 10 + Math.round(a.y * 100);
    a.face.style.transform = a.flip ? 'scaleX(-1)' : '';
  }
  function addActor(e, x, y, flip = false, id = nextId++) {
    nextId = Math.max(nextId, id + 1);
    const el = document.createElement('div'); el.className = 'actor';
    const face = document.createElement('span'); face.className = 'face'; face.textContent = e;
    el.appendChild(face); $('actors').appendChild(el);
    const a = { id, e, x, y, flip, el, face };
    actors.push(a); place(a); attach(a);
    return a;
  }
  function removeActor(a) { a.el.remove(); actors = actors.filter(o => o !== a); }
  function clearActors() { actors.forEach(a => a.el.remove()); actors = []; }
  function persistScene() { saved.scenes[stageKey] = actors.map(({ id, e, x, y, flip }) => ({ id, e, x, y, flip })); save.set(saved); }
  const clampX = x => Math.max(.04, Math.min(.96, x)), clampY = y => Math.max(.18, Math.min(1, y));

  function act(a, which = Math.floor(Math.random() * ACTIONS.length)) {
    const A = ACTIONS[which];
    a.face.classList.remove(...ACTIONS.map(x => x.cls)); void a.face.offsetWidth; a.face.classList.add(A.cls);
    A.sound();
    if (recording) recording.events.push({ t: now(), type: 'act', id: a.id, which });
  }

  function overTrash(e) { const r = $('trash').getBoundingClientRect(); return e.clientX > r.left - 30 && e.clientX < r.right + 30 && e.clientY > r.top - 30 && e.clientY < r.bottom + 30; }

  // drag something new from the tray onto the stage
  function dragFromTray(e, emo) {
    if (playing) return;
    e.preventDefault();
    const sr = $('scene').getBoundingClientRect();
    const a = addActor(emo, clampX((e.clientX - sr.left) / W), clampY((e.clientY - sr.top) / H));
    a.el.classList.add('lift'); Kit.sfx.pop();
    const move = ev => {
      if (ev.pointerId !== e.pointerId) return;
      const nx = clampX((ev.clientX - sr.left) / W);
      if (Math.abs(nx - a.x) > .004) a.flip = nx > a.x;
      a.x = nx; a.y = clampY((ev.clientY - sr.top) / H); place(a);
    };
    const up = ev => {
      if (ev.pointerId !== e.pointerId) return;
      removeEventListener('pointermove', move); removeEventListener('pointerup', up); removeEventListener('pointercancel', up);
      a.el.classList.remove('lift');
      if (ev.clientY > sr.bottom) { removeActor(a); return; } // dropped back on the shelf
      Kit.sfx.boing(); Kit.burst(ev.clientX, ev.clientY, ['✨', '⭐'], 6, 80);
      if (recording) recording.events.push({ t: now(), type: 'add', id: a.id, e: a.e });
      persistScene();
      if (actors.length === 2 && !saved.toldRec) { saved.toldRec = true; save.set(saved); setTimeout(() => Kit.say('st.tellRec'), 700); }
    };
    addEventListener('pointermove', move); addEventListener('pointerup', up); addEventListener('pointercancel', up);
  }

  // tap = act, drag = move, drag to bin = bye
  function attach(a) {
    let start = null, moved = false;
    a.el.addEventListener('pointerdown', e => {
      if (playing || start) return;
      e.preventDefault(); try { a.el.setPointerCapture(e.pointerId); } catch (err) {}
      start = { x: e.clientX, y: e.clientY, id: e.pointerId, ax: a.x, ay: a.y }; moved = false;
    });
    a.el.addEventListener('pointermove', e => {
      if (!start || e.pointerId !== start.id) return;
      if (!moved && Math.hypot(e.clientX - start.x, e.clientY - start.y) > 12) { moved = true; a.el.classList.add('lift'); $('trash').classList.add('show'); }
      if (!moved) return;
      const nx = clampX(start.ax + (e.clientX - start.x) / W);
      if (Math.abs(nx - a.x) > .004) a.flip = nx > a.x;
      a.x = nx; a.y = clampY(start.ay + (e.clientY - start.y) / H); place(a);
      $('trash').classList.toggle('hot', overTrash(e));
    });
    const end = e => {
      if (!start || e.pointerId !== start.id) return;
      start = null; a.el.classList.remove('lift');
      const t = $('trash'); t.classList.remove('show', 'hot');
      if (!moved) { act(a); return; }
      if (overTrash(e)) {
        Kit.sfx.oops(); Kit.burst(e.clientX, e.clientY, ['💨', '☁️'], 6, 70);
        if (recording) recording.events.push({ t: now(), type: 'remove', id: a.id });
        removeActor(a);
      }
      persistScene();
    };
    a.el.addEventListener('pointerup', end);
    a.el.addEventListener('pointercancel', end);
  }

  // ---------- recording a movie ----------
  const now = () => performance.now() - recording.t0;
  const snapshot = () => actors.map(({ id, e, x, y, flip }) => ({ id, e, x, y, flip }));
  let micStream = null;

  async function getMic() {
    if (micStream) return micStream;
    if (!navigator.mediaDevices || !window.MediaRecorder) return null; // not allowed on plain http
    try { micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }); }
    catch (e) { micStream = null; }
    return micStream;
  }

  async function startRecording() {
    if (playing || recording || starting) return;
    starting = true;
    const mic = await getMic();
    // 3, 2, 1, action!
    const cd = $('countdown'); cd.classList.add('on');
    Kit.say('st.action');
    for (const n of ['3', '2', '1']) { cd.textContent = n; Kit.tone(660, .15, { type: 'triangle' }); await sleep(800); }
    cd.textContent = '🎬'; Kit.tone(990, .3, { type: 'triangle' }); await sleep(400);
    cd.classList.remove('on');
    starting = false;

    recording = { t0: performance.now(), start: snapshot(), frames: [], events: [], chunks: [], rec: null };
    if (mic) {
      try {
        const rec = new MediaRecorder(mic);
        rec.ondataavailable = ev => { if (ev.data.size) recording && recording.chunks.push(ev.data); };
        rec.start(250); recording.rec = rec;
      } catch (e) { /* film without sound */ }
    }
    $('recBtn').classList.add('rec'); $('recTime').classList.add('on');
    recording.timer = setInterval(() => {
      const s = Math.floor(now() / 1000);
      $('recTime').textContent = '🔴 ' + s;
      if (s >= MAX_SECONDS) stopRecording();
    }, 250);
    recording.sampler = setInterval(() => recording.frames.push({ t: now(), a: actors.map(a => [a.id, +a.x.toFixed(4), +a.y.toFixed(4), a.flip ? 1 : 0]) }), 66);
  }

  async function stopRecording() {
    const r = recording; if (!r) return;
    clearInterval(r.timer); clearInterval(r.sampler);
    r.duration = now();
    recording = null;
    $('recBtn').classList.remove('rec'); $('recTime').classList.remove('on');
    let audio = null;
    if (r.rec) {
      await new Promise(ok => { r.rec.onstop = ok; r.rec.stop(); });
      if (r.chunks.length) audio = new Blob(r.chunks, { type: r.rec.mimeType || 'audio/mp4' });
    }
    if (r.duration < 1200) return; // tapped by accident
    const movie = { start: r.start, frames: r.frames, events: r.events, duration: r.duration, audio };
    await saveMovie(stageKey, movie);
    saved.movies[stageKey] = true; save.set(saved);
    $('filmBtn').disabled = false; $('filmBtn').classList.add('ready');
    Kit.sfx.yay(); Kit.say('st.cut');
  }
  $('recBtn').onclick = () => { Kit.sfx.pop(); recording ? stopRecording() : startRecording(); };

  // ---------- watching the movie ----------
  async function watch() {
    if (recording) return;
    if (playing) { playing = false; return; }
    const m = await loadMovie(stageKey);
    if (!m) return;
    playing = true;
    $('stage').classList.add('playing'); $('scene').classList.add('letterbox');
    $('filmBtn').textContent = '⏹️'; $('filmBtn').classList.remove('ready');
    const live = snapshot();

    // set the stage as it was when filming started
    clearActors(); m.start.forEach(a => addActor(a.e, a.x, a.y, a.flip, a.id));
    let player = null;
    if (m.audio) { player = new Audio(URL.createObjectURL(m.audio)); player.play().catch(() => {}); }
    const t0 = performance.now();
    let fi = 0, ei = 0;
    await new Promise(done => {
      const tick = () => {
        if (!playing) return done();
        const t = player && !player.paused && player.currentTime > 0 ? player.currentTime * 1000 : performance.now() - t0;
        while (ei < m.events.length && m.events[ei].t <= t) {
          const ev = m.events[ei++];
          const a = actors.find(x => x.id === ev.id);
          if (ev.type === 'act' && a) act(a, ev.which);
          if (ev.type === 'remove' && a) { Kit.sfx.oops(); removeActor(a); }
          if (ev.type === 'add') Kit.sfx.boing();
        }
        while (fi < m.frames.length && m.frames[fi].t <= t) {
          const f = m.frames[fi++];
          for (const [id, x, y, flip] of f.a) {
            let a = actors.find(o => o.id === id);
            if (!a) { const src = m.events.find(ev => ev.type === 'add' && ev.id === id); if (!src) continue; a = addActor(src.e, x, y, !!flip, id); }
            a.x = x; a.y = y; a.flip = !!flip; place(a);
          }
        }
        if (t >= m.duration + 200) return done();
        setTimeout(tick, 30);
      };
      tick();
    });
    if (player) { player.pause(); URL.revokeObjectURL(player.src); }
    const finished = playing;
    playing = false;
    if (finished) {
      $('theEnd').classList.add('on'); Kit.sfx.yay(); Kit.say('st.theEnd');
      await sleep(1600); $('theEnd').classList.remove('on');
    }
    // back to the stage as she left it
    clearActors(); live.forEach(a => addActor(a.e, a.x, a.y, a.flip, a.id));
    $('stage').classList.remove('playing'); $('scene').classList.remove('letterbox');
    $('filmBtn').textContent = '🎬'; $('filmBtn').classList.add('ready');
  }
  $('filmBtn').onclick = () => { Kit.sfx.pop(); watch(); };

  $('backBtn').onclick = async () => {
    if (playing) return;
    if (recording) await stopRecording();
    Kit.sfx.pop(); persistScene(); stageKey = null; paintPicker();
    document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === 'pick'));
  };

  let lastSize = '';
  addEventListener('resize', () => {
    const size = innerWidth + 'x' + innerHeight;
    if (size === lastSize) return;
    lastSize = size;
    paintPickBg();
    if (!stageKey) return;
    measure(); actors.forEach(place); buildDecor();
  });
})();
</script>
</body>
</html>
