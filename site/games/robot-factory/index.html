<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Robot Factory">
<meta name="theme-color" content="#e2e8f0">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/shared/kit.css">
<title>Robot Factory</title>
<style>
  body { background: repeating-linear-gradient(45deg, #e2e8f0 0 40px, #e9eef5 40px 80px); }
  .robot svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .blinky { animation: blinky 1.2s steps(2) infinite; }
  @keyframes blinky { 50% { opacity: .35; } }

  /* ---------- home ---------- */
  #home { flex-direction: column; align-items: center; justify-content: center; gap: 4vh; }
  .modes { display: flex; gap: clamp(24px, 6vw, 70px); }
  .mode { width: clamp(150px, 22vw, 210px); height: clamp(150px, 22vw, 210px); border-radius: 40px; font-size: clamp(70px, 10vw, 100px); }
  #recipeMode { background: #bfdbfe; } #sillyMode { background: #fde68a; }
  .homeBots { display: flex; gap: 20px; }
  .homeBots .robot { width: 110px; height: 132px; animation: kit-bob 2.4s ease-in-out infinite; }
  #stickers { font-size: 30px; background: rgba(255,255,255,.75); border-radius: 999px; padding: 6px 18px; }

  /* ---------- factory floor ---------- */
  #play { flex-direction: column; padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); gap: 10px; }
  .top { display: flex; align-items: center; gap: 12px; }
  .top .btn { width: 64px; height: 64px; font-size: 30px; }
  .spacer { flex: 1; }
  #floor { flex: 1; min-height: 0; display: flex; gap: 2vw; align-items: center; }
  #card {
    width: clamp(150px, 24vw, 260px); max-height: 100%; background: #fffbeb; border-radius: 24px; padding: 14px; position: relative;
    box-shadow: 0 8px 0 rgba(0,0,0,.1); border: 4px solid #fcd34d; display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  #card::before { content: '📋'; position: absolute; top: -26px; left: 50%; translate: -50% 0; font-size: 44px; }
  #card .robot { width: 100%; max-height: 100%; aspect-ratio: 200 / 240; }
  #belt { flex: 1; align-self: stretch; position: relative; overflow: hidden; }
  /* a cartoon conveyor: a dark belt on top, rollers turning underneath */
  #conveyor { position: absolute; left: 0; right: 0; bottom: 6%; height: 40px; border-radius: 20px; background: #5b6b8c; box-shadow: 0 8px 0 #3d4a66, inset 0 0 0 3px rgba(58,45,82,.35); }
  #conveyor::before { content: ''; position: absolute; left: 6px; right: 6px; top: -5px; height: 12px; border-radius: 6px; background: repeating-linear-gradient(90deg, #2f3547 0 18px, #444c63 18px 36px); box-shadow: 0 2px 0 rgba(0,0,0,.2); }
  #conveyor::after { content: ''; position: absolute; left: 12px; right: 12px; top: 10px; height: 26px; background: radial-gradient(circle, #e2e8f0 0 4px, #94a3b8 5px 10px, #3d4a66 11px 12px, transparent 13px) 0 50% / 34px 26px repeat-x; }
  #conveyor.run::before { animation: belt .4s linear infinite; }
  #conveyor.run::after { animation: rollers .4s linear infinite; }
  @keyframes belt { to { background-position: 36px 0; } }
  @keyframes rollers { to { background-position: 34px 50%; } }
  #bot { position: absolute; bottom: calc(6% + 34px); left: 50%; height: 78%; aspect-ratio: 200 / 240; translate: -50% 0; transition: transform 1.2s ease-in; }
  #bot.out { transform: translateX(140%); }
  #bot.in { transition: none; transform: translateX(-160%); }
  #bot [data-part] { transition: opacity .3s; }
  #bot.building [data-part] { opacity: 0; }
  #bot [data-part].shown { opacity: 1; }
  #bot [data-part].bad { animation: kit-shake .5s; filter: drop-shadow(0 0 6px #ef4444) drop-shadow(0 0 6px #ef4444); }
  #bot [data-part].hint { filter: drop-shadow(0 0 8px #facc15) drop-shadow(0 0 8px #facc15); }
  #bot [data-part].fixed { filter: drop-shadow(0 0 8px #22c55e); }
  #arm { position: absolute; top: -10px; left: 50%; width: 84px; height: 92px; translate: -50% 0; transition: top .25s ease-in; z-index: 3; pointer-events: none; display: none; }
  #arm::before { content: ''; position: absolute; left: 50%; bottom: 90%; width: 16px; height: 100vh; translate: -50% 0; border-radius: 8px; background: repeating-linear-gradient(#a9b6cc 0 14px, #8796b2 14px 18px); box-shadow: inset 0 0 0 2px rgba(58,45,82,.3); }
  #arm svg { width: 100%; height: 100%; display: block; overflow: visible; }
  #arm .fl, #arm .fr { animation: pinch .5s ease-in-out infinite alternate; }
  #arm .fl { transform-origin: 42px 40px; } #arm .fr { transform-origin: 58px 40px; animation-name: pinchR; }
  @keyframes pinch { from { transform: rotate(8deg); } to { transform: rotate(-6deg); } }
  @keyframes pinchR { from { transform: rotate(-8deg); } to { transform: rotate(6deg); } }

  /* ---------- cartoon factory behind the screens (see /shared/scenery.js) ---------- */
  .screen { isolation: isolate; }
  .scene { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .scene > div { position: absolute; inset: 0; }
  .rf-spin { animation: rf-spin 9s linear infinite; }
  .rf-spin.rev { animation-direction: reverse; animation-duration: 6s; }
  .sc-prop.t-fast .rf-spin { animation-duration: .6s; }
  @keyframes rf-spin { to { transform: rotate(360deg); } }
  .rf-swing { animation: rf-swing 4.5s ease-in-out infinite; }
  @keyframes rf-swing { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
  .rf-flash { animation: rf-flash 1.2s ease-in-out infinite; }
  .sc-prop.t-fast .rf-flash { animation-duration: .25s; }
  @keyframes rf-flash { 0%,100% { opacity: .1; } 50% { opacity: 1; } }
  .rf-needle { animation: rf-needle 3s ease-in-out infinite; }
  .sc-prop.t-fast .rf-needle { animation-duration: .4s; }
  @keyframes rf-needle { 0%,100% { transform: rotate(-50deg); } 60% { transform: rotate(60deg); } }
  .sc-prop.t-fast .sc-smoke { animation-duration: 1.1s; }

  #controls { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  #tabs { display: flex; gap: 10px; }
  .tab { width: 60px; height: 60px; font-size: 30px; }
  .tab.sel { background: #bfdbfe; box-shadow: 0 6px 0 rgba(40,50,90,.18), 0 0 0 4px #3b82f6; }
  .tab.wrong { box-shadow: 0 6px 0 rgba(40,50,90,.18), 0 0 0 4px #ef4444; }
  .row { display: flex; align-items: center; gap: 18px; }
  #opts { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .opt { width: 84px; height: 84px; border-radius: 20px; border: 4px solid transparent; background: #fff; padding: 4px; cursor: pointer; touch-action: manipulation; box-shadow: 0 4px 0 rgba(0,0,0,.1); }
  .opt.sel { border-color: #3b82f6; }
  .opt.swatch { width: 64px; height: 64px; border-radius: 50%; border: 5px solid #fff; }
  .opt.swatch.sel { border-color: #33415c; }
  #checkBtn { width: 100px; height: 100px; font-size: 52px; background: #4ade80; }
</style>
</head>
<body>

<section id="home" class="screen on">
  <a class="btn corner left" href="../../" aria-label="Back to Yas's Games">🏠</a>
  <button id="soundBtn" class="btn corner right" aria-label="Sound on or off">🔊</button>
  <h1 id="title" class="title"></h1>
  <div class="homeBots" id="homeBots"></div>
  <div class="modes">
    <button id="recipeMode" class="btn mode" aria-label="Build from a recipe">📋</button>
    <button id="sillyMode" class="btn mode" aria-label="Find the silly robot's mistakes">🤪</button>
  </div>
  <div id="stickers"></div>
</section>

<section id="play" class="screen">
  <div class="top">
    <button id="backBtn" class="btn" aria-label="Back">🏠</button>
    <div class="spacer"></div>
    <div id="playStickers" style="font-size:28px"></div>
    <div class="spacer"></div>
  </div>
  <div id="floor">
    <div id="card"><div id="cardBot" class="robot"></div></div>
    <div id="belt">
      <div id="arm" aria-hidden="true"></div>
      <div id="conveyor"></div>
      <div id="bot" class="robot"></div>
    </div>
  </div>
  <div id="controls">
    <div id="tabs"></div>
    <div class="row"><div id="opts"></div><button id="checkBtn" class="btn" aria-label="Check">✅</button></div>
  </div>
</section>

<script src="/shared/lines.js"></script>
<script src="/shared/voice.js"></script>
<script src="/shared/saved.js"></script>
<script src="/shared/kit.js"></script>
<script src="/shared/robot.js"></script>
<script src="/shared/scenery.js"></script>
<script>
(() => {
  const { $, pick, shuffle, sleep } = Kit;
  const { COLORS, OPTIONS } = RobotArt;
  const PARTS = ['color', 'head', 'eyes', 'antenna', 'bottom'];
  const ICONS = { color: '🎨', head: '🙂', eyes: '👀', antenna: '📡', bottom: '🛞' };
  const choices = part => part === 'color' ? COLORS : OPTIONS[part];
  const BUILD_ORDER = ['bottom', 'color', 'head', 'eyes', 'antenna'];

  const save = Kit.store('robot-factory');
  const saved = save.get({ stickers: 0, recipeLevel: 0, recipeDone: 0, sillyDone: 0 });
  const persist = () => save.set(saved);

  const randomRobot = () => Object.fromEntries(PARTS.map(p => [p, pick(choices(p))]));
  function paintStickers() {
    const n = saved.stickers, t = n ? (n > 10 ? '🤖 × ' + n : '🤖'.repeat(n)) : '';
    $('stickers').textContent = t || '🤖'; $('stickers').style.opacity = n ? 1 : .4;
    $('playStickers').textContent = t;
  }
  function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); }

  // ================= scenery: a cartoon factory, drawn with /shared/scenery.js =================
  const { kit } = Scenery, OL = kit.OL, ol = kit.ol;
  // a gear with one soft outline around teeth and wheel together
  function gear(cx, cy, r, n, fill) {
    const teeth = (f, e) => Array.from({ length: n }, (_, i) => `<rect x="${(cx - r * .2 - e).toFixed(1)}" y="${(cy - r * 1.3 - e).toFixed(1)}" width="${(r * .4 + 2 * e).toFixed(1)}" height="${(r * .6).toFixed(1)}" rx="${(r * .08).toFixed(1)}" fill="${f}" transform="rotate(${(i * 360 / n).toFixed(1)} ${cx} ${cy})"/>`).join('');
    return `<g opacity=".55">${teeth(OL, 3)}<circle cx="${cx}" cy="${cy}" r="${r + 3}" fill="${OL}"/></g>${teeth(fill, 0)}<circle cx="${cx}" cy="${cy}" r="${r}" fill="${fill}"/>` +
      `<circle cx="${cx}" cy="${cy}" r="${r * .62}" fill="#fff" opacity=".2"/><circle cx="${cx}" cy="${cy}" r="${r * .28}" fill="${OL}" opacity=".45"/>`;
  }
  Scenery.addBackdrop('factory', ['#c4d5ee', '#e2ebf7'], () => {
    let s = kit.sky('factory');
    for (let i = 1; i < 8; i++) {
      s += `<rect x="${i * 125 - 2}" y="0" width="5" height="690" fill="#adbed8"/>`;
      for (let y = 30; y < 680; y += 70) s += `<circle cx="${i * 125 + 12}" cy="${y}" r="4" fill="#a4b5d0"/>`;
    }
    for (let i = 0; i < 5; i++) {
      const x = 40 + i * 200;
      s += `<rect x="${x}" y="80" width="120" height="170" rx="10" fill="#8fd3ff"/><path d="M${x} 200 Q${x + 60} 160 ${x + 120} 190 V250 H${x}Z" fill="#a9e28e"/>` +
        `<path d="M${x + 14} 110 h30 M${x + 70} 126 h22" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity=".8"/>` +
        `<rect x="${x}" y="80" width="120" height="170" rx="10" fill="none" stroke="#eef3fa" stroke-width="10"/><path d="M${x + 60} 80 V250 M${x} 165 H${x + 120}" stroke="#eef3fa" stroke-width="7"/>`;
    }
    s += `<rect y="320" width="1000" height="30" fill="#93a4c3"/><rect y="324" width="1000" height="8" fill="#fff" opacity=".35"/>`;
    for (let i = 0; i < 6; i++) s += `<rect x="${70 + i * 170}" y="312" width="22" height="46" rx="4" fill="#7889aa"/>`;
    s += `<rect y="560" width="1000" height="130" fill="#b2c2db"/><rect y="556" width="1000" height="8" fill="#9fb0cc"/>`;
    s += `<rect y="690" width="1000" height="40" fill="#ffd23f"/>` + Array.from({ length: 27 }, (_, i) => `<path d="M${i * 40 - 20} 730 L${i * 40} 690 H${i * 40 + 20} L${i * 40} 730Z" fill="#4a3d62" opacity=".8"/>`).join('');
    s += `<rect y="730" width="1000" height="270" fill="#a3b1c8"/>` + [800, 880, 960].map(y => `<rect y="${y}" width="1000" height="4" fill="#919fb8"/>`).join('');
    return s + kit.dots(24, 9, 750, 990, ['#94a3bb'], [6, 14], .4);
  });
  // a big turning gear with a happy face in the middle
  Scenery.add('cog', (c = '#ffcf3a', rev = false, happy = true) => [140, 140,
    `<g class="rf-spin${rev ? ' rev' : ''}" style="transform-origin:70px 70px">${gear(70, 70, 46, 10, c)}</g>` +
    (happy ? `<circle cx="70" cy="70" r="30" fill="${c}"/>${kit.face(70, 72, .62)}` : '')]);
  // an orange warning light that flashes
  Scenery.add('beacon', () => [100, 110,
    `<circle class="rf-flash" cx="50" cy="56" r="50" fill="url(#sc-glow)"/>` +
    `<path d="M24 84 Q24 28 50 28 Q76 28 76 84Z" fill="#ff9a3c" ${ol()}/><path d="M34 80 Q34 40 48 36" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" opacity=".6"/>` +
    `<path class="rf-flash" d="M28 84 Q28 32 50 32 Q72 32 72 84Z" fill="#ffe14d" opacity=".8"/>` + kit.face(50, 66, .42) +
    `<rect x="14" y="80" width="72" height="24" rx="8" fill="#6b7a99" ${ol()}/><circle cx="30" cy="92" r="4" fill="#cbd5e1"/><circle cx="70" cy="92" r="4" fill="#cbd5e1"/>`]);
  // a pipe up the wall: a gauge, a valve wheel and puffs of steam
  Scenery.add('steampipe', () => [140, 320,
    [0, 1, 2].map(i => `<circle class="sc-smoke" style="animation-delay:${i * 1.3}s" cx="60" cy="40" r="${14 + i * 4}" fill="#fff"/>`).join('') +
    `<rect x="40" y="50" width="40" height="270" fill="#9aaac6" ${ol()}/><rect x="48" y="50" width="9" height="270" fill="#fff" opacity=".35"/>` +
    `<rect x="32" y="40" width="56" height="20" rx="6" fill="#7889aa" ${ol(2.5)}/><rect x="32" y="240" width="56" height="18" rx="6" fill="#7889aa" ${ol(2.5)}/>` +
    `<circle cx="60" cy="120" r="26" fill="#fff" ${ol()}/><path d="M42 120 A18 18 0 0 1 78 120" stroke="#ff5a6a" stroke-width="5" fill="none" opacity=".5"/>` +
    `<path class="rf-needle" style="transform-origin:60px 124px" d="M60 124 V104" stroke="${OL}" stroke-width="4" stroke-linecap="round"/><circle cx="60" cy="124" r="4" fill="${OL}"/>` +
    `<g class="rf-spin" style="transform-origin:60px 190px"><circle cx="60" cy="190" r="26" fill="none" stroke="#ff5a6a" stroke-width="8"/>` +
    `<path d="M60 164 V216 M34 190 H86" stroke="#ff5a6a" stroke-width="6"/><circle cx="60" cy="190" r="8" fill="#e04a5a"/></g>`]);
  // a wooden crate with a gear stamp
  Scenery.add('crate', (c = '#e3ac6c') => [120, 110,
    `<rect x="6" y="6" width="108" height="98" rx="6" fill="${c}" ${ol()}/><rect x="14" y="14" width="92" height="82" fill="none" stroke="#b97d48" stroke-width="5"/>` +
    `<path d="M16 92 L104 18" stroke="#b97d48" stroke-width="8"/><path d="M6 40 H114 M6 72 H114" stroke="#c98e56" stroke-width="3" opacity=".6"/>` +
    `<g opacity=".8">${gear(60, 56, 15, 7, '#8a5a2b')}</g>`]);
  // a crane hook carrying a crate, swinging gently
  Scenery.add('hook', () => {
    let chain = '';
    for (let y = 0; y < 180; y += 22) chain += `<rect x="${y % 44 ? 54 : 52}" y="${y}" width="${y % 44 ? 12 : 16}" height="26" rx="7" fill="none" stroke="#7a8aa6" stroke-width="5"/>`;
    return [120, 360, `<g class="rf-swing" style="transform-origin:60px 0px">${chain}` +
      `<circle cx="60" cy="196" r="13" fill="none" stroke="#5a6a86" stroke-width="7"/><path d="M60 209 L16 252 M60 209 L104 252" stroke="#8a6a4a" stroke-width="4"/>` +
      `<g transform="translate(0 246)">${Scenery.art('crate', '#f0c27a').svg.replace(/^<svg[^>]*>|<\/svg>$/g, '')}</g></g>`];
  });

  const P = (art, x, y, h, o = {}) => ({ art, x, y, h, ...o });
  const SCENES = {
    home: [P('cog', 9, 32, 30, { at: 'center', tap: 'spin' }), P('cog', 20, 18, 15, { at: 'center', args: ['#7ad6ff', true, false], tap: 'spin' }),
      P('hook', 89, 0, 28, { at: 'top' }), P('beacon', 12, 62, 10, { at: 'center', tap: 'beep' }),
      P('crate', 8, 99, 16, { tap: 'boing' }), P('crate', 20, 99, 11, { args: ['#d9985a'], tap: 'boing' }),
      P('steampipe', 92, 99, 42, { tap: 'steam' }), P('cog', 80, 90, 12, { at: 'center', args: ['#ff9ad5', true, false], tap: 'spin' })],
    play: [P('cog', 62, 34, 28, { at: 'center', args: ['#ffe08a', false, false] }), P('cog', 77, 22, 15, { at: 'center', args: ['#bcd7ff', true, false] }),
      P('beacon', 24, 1, 8, { at: 'top' }), P('beacon', 76, 1, 8, { at: 'top' }), P('steampipe', 97, 99, 38)],
  };
  function paintScenes() {
    const W = innerWidth, H = innerHeight;
    for (const [id, props] of Object.entries(SCENES)) {
      const sec = $(id);
      let sc = sec.querySelector(':scope > .scene');
      if (!sc) { sc = document.createElement('div'); sc.className = 'scene'; sc.setAttribute('aria-hidden', 'true'); sec.prepend(sc); }
      sc.innerHTML = '<div>' + Scenery.backdrop('factory') + '</div><div></div>';
      Scenery.place(sc.lastChild, props, W, H).forEach(el => {
        if (el.dataset.tap) el.addEventListener('pointerdown', e => { e.stopPropagation(); tapDecor(el); });
      });
    }
  }
  function tapDecor(el) {
    const r = el.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
    const react = (cls, ms) => Scenery.react(el, cls, ms);
    switch (el.dataset.tap) {
      case 'spin': react('t-fast', 1400); react('t-boing', 600); [0, 1, 2, 3, 4].forEach(i => Kit.tone(200 + i * 40, .06, { type: 'square', vol: .06, delay: i * .09 })); break;
      case 'beep': react('t-fast', 1500); react('t-boing', 600); [0, 1, 2].forEach(i => Kit.tone(i % 2 ? 660 : 880, .14, { type: 'square', vol: .06, delay: i * .2 })); break;
      case 'steam': react('t-fast', 2200); react('t-wiggle', 600); Kit.sfx.whoosh(); Kit.burst(x, r.top + 20, ['☁️'], 4, 80); break;
      default: react('t-boing', 600); Kit.sfx.boing(); Kit.burst(x, y, ['⚙️', '🔩'], 4, 80);
    }
  }
  paintScenes();
  let sceneW = innerWidth, sceneH = innerHeight, sceneT = 0;
  addEventListener('resize', () => {
    clearTimeout(sceneT);
    sceneT = setTimeout(() => { if (innerWidth !== sceneW || innerHeight !== sceneH) { sceneW = innerWidth; sceneH = innerHeight; paintScenes(); } }, 150);
  });
  // the robot arm that builds robots in silly mode: a claw that pinches while it works
  $('arm').innerHTML = `<svg viewBox="0 0 100 110" xmlns="http://www.w3.org/2000/svg">` +
    `<g class="fl"><path d="M42 40 Q12 56 22 98 Q26 104 32 98 Q26 66 48 50Z" fill="#9aaac6" ${ol()}/></g>` +
    `<g class="fr"><path d="M58 40 Q88 56 78 98 Q74 104 68 98 Q74 66 52 50Z" fill="#9aaac6" ${ol()}/></g>` +
    `<rect x="28" y="0" width="44" height="34" rx="10" fill="#ffcf3a" ${ol()}/><circle cx="50" cy="40" r="13" fill="#7889aa" ${ol(2.5)}/>` +
    `<circle class="blinky" cx="50" cy="17" r="6" fill="#ff5a6a"/></svg>`;

  // ---------- home ----------
  Kit.title('title', 'Robot Factory');
  Kit.soundButton('soundBtn');
  for (let i = 0; i < 3; i++) {
    const b = document.createElement('div'); b.className = 'robot'; b.style.animationDelay = -i * .7 + 's';
    b.innerHTML = RobotArt.svg(randomRobot()); $('homeBots').appendChild(b);
  }
  paintStickers();
  Kit.say('rf.intro');

  let mode = null, recipe = null, built = null, active = [], tab = null, busy = false;
  let mistakes = [], wrongTaps = 0;

  function paintBot(extraClass) {
    $('bot').innerHTML = RobotArt.svg(built);
    if (extraClass) $('bot').querySelectorAll('[data-part]').forEach(g => g.classList.add(extraClass));
  }

  async function rollIn() {
    const bot = $('bot');
    bot.classList.remove('out'); bot.classList.add('in'); void bot.offsetWidth;
    bot.classList.remove('in');
    $('conveyor').classList.add('run'); Kit.sfx.whoosh();
    await sleep(1200); $('conveyor').classList.remove('run');
  }
  async function rollOut() {
    $('conveyor').classList.add('run'); $('bot').classList.add('out'); Kit.sfx.whoosh();
    await sleep(1250); $('conveyor').classList.remove('run');
  }
  function sticker() {
    saved.stickers++; persist(); paintStickers();
    Kit.sfx.yay(); Kit.burstAt($('bot'), ['⭐', '⚙️', '✨', '🎉'], 18, 220);
  }

  // ================= recipe mode: build what the card shows =================
  async function newRecipe() {
    busy = true;
    recipe = randomRobot();
    const n = Math.min(2 + saved.recipeLevel, PARTS.length);
    active = shuffle(PARTS).slice(0, n).sort((a, b) => PARTS.indexOf(a) - PARTS.indexOf(b));
    // start with the right parts everywhere except where she has to choose
    built = { ...recipe };
    for (const p of active) built[p] = pick(choices(p).filter(v => v !== recipe[p]));
    tab = active[0];
    $('cardBot').innerHTML = RobotArt.svg(recipe);
    paintBot(); paintControls();
    await rollIn();
    busy = false;
  }
  function paintControls() {
    const tabs = $('tabs'); tabs.innerHTML = '';
    for (const p of active) {
      const b = document.createElement('button'); b.className = 'btn tab' + (p === tab ? ' sel' : ''); b.textContent = ICONS[p];
      b.setAttribute('aria-label', p);
      b.onclick = () => { tab = p; Kit.sfx.pop(); paintControls(); };
      tabs.appendChild(b);
    }
    const opts = $('opts'); opts.innerHTML = '';
    for (const v of choices(tab)) {
      const b = document.createElement('button');
      const sel = built[tab] === v;
      if (tab === 'color') { b.className = 'opt swatch' + (sel ? ' sel' : ''); b.style.background = v; }
      else { b.className = 'opt robot' + (sel ? ' sel' : ''); b.innerHTML = v === 'none' ? '<div style="font-size:34px;line-height:72px">🚫</div>' : RobotArt.svg({ ...built, [tab]: v }); }
      b.onclick = () => {
        if (busy) return;
        built[tab] = v; Kit.tone(300 + Math.random() * 400, .1, { type: 'square', vol: .06 });
        paintBot(); paintControls();
      };
      opts.appendChild(b);
    }
  }
  $('checkBtn').onclick = async () => {
    if (busy) return;
    busy = true; Kit.say('rf.check'); Kit.sfx.pop();
    await sleep(900);
    const wrong = active.filter(p => built[p] !== recipe[p]);
    if (wrong.length) {
      Kit.sfx.oops(); Kit.say('rf.almost');
      for (const p of wrong) $('bot').querySelector(`[data-part="${p}"]`)?.classList.add('bad');
      document.querySelectorAll('.tab').forEach((b, i) => b.classList.toggle('wrong', wrong.includes(active[i])));
      tab = wrong[0];
      setTimeout(() => { paintControls(); document.querySelectorAll('.tab').forEach((b, i) => b.classList.toggle('wrong', wrong.includes(active[i]))); }, 600);
      busy = false; return;
    }
    Kit.say('rf.perfect'); sticker();
    saved.recipeDone++;
    if (saved.recipeDone % 2 === 0 && saved.recipeLevel < 3) saved.recipeLevel++;
    persist();
    await sleep(1400); await rollOut(); newRecipe();
  };

  // ================= silly mode: the robot arm makes mistakes =================
  async function newSilly() {
    busy = true; wrongTaps = 0;
    recipe = randomRobot();
    const count = saved.sillyDone >= 3 ? 2 : 1;
    mistakes = shuffle(PARTS).slice(0, count);
    built = { ...recipe };
    // never make a part disappear: she has to be able to tap the mistake
    for (const p of mistakes) built[p] = pick(choices(p).filter(v => v !== recipe[p] && v !== 'none'));
    $('cardBot').innerHTML = RobotArt.svg(recipe);
    paintBot();
    $('bot').classList.add('building');
    await rollIn();
    // the arm adds the parts one at a time
    const arm = $('arm'); arm.style.display = 'block';
    for (const p of BUILD_ORDER) {
      arm.style.top = '-10px'; await sleep(250);
      arm.style.top = '30%'; await sleep(260);
      $('bot').querySelector(`[data-part="${p}"]`)?.classList.add('shown');
      Kit.tone(160, .12, { type: 'square', vol: .1 }); Kit.tone(90, .15, { type: 'square', vol: .08, delay: .06 });
      await sleep(200);
    }
    arm.style.top = '-10px'; await sleep(300); arm.style.display = 'none';
    $('bot').classList.remove('building');
    paintBot();
    Kit.say(count > 1 ? 'rf.silly2' : 'rf.silly');
    busy = false;
  }
  $('bot').addEventListener('pointerdown', async e => {
    if (mode !== 'silly' || busy) return;
    const g = e.target.closest('[data-part]'); if (!g) return;
    let part = g.dataset.part;
    // the head is painted the body color too
    if (part === 'head' && mistakes.includes('color') && !mistakes.includes('head')) part = 'color';
    if (!mistakes.includes(part)) {
      wrongTaps++; Kit.sfx.oops(); Kit.say('rf.notThat');
      g.classList.add('bad'); setTimeout(() => g.classList.remove('bad'), 600);
      if (wrongTaps >= 2) mistakes.forEach(p => $('bot').querySelector(`[data-part="${p}"]`)?.classList.add('hint'));
      return;
    }
    // fix it
    busy = true;
    built[part] = recipe[part]; mistakes = mistakes.filter(p => p !== part);
    const stillHint = mistakes.filter(() => wrongTaps >= 2);
    paintBot();
    $('bot').querySelector(`[data-part="${part}"]`)?.classList.add('fixed');
    stillHint.forEach(p => $('bot').querySelector(`[data-part="${p}"]`)?.classList.add('hint'));
    Kit.sfx.ding(); Kit.burst(e.clientX, e.clientY, ['🔧', '✨', '⚙️'], 8, 100);
    if (mistakes.length) { Kit.say('rf.found'); busy = false; return; }
    Kit.say('rf.allFixed'); sticker();
    saved.sillyDone++; persist();
    await sleep(1600); await rollOut(); newSilly();
  });

  // ---------- switching modes ----------
  function start(m) {
    mode = m; show('play');
    $('controls').style.display = m === 'recipe' ? 'flex' : 'none';
    if (m === 'recipe') { Kit.say('rf.recipe'); newRecipe(); } else newSilly();
  }
  $('recipeMode').onclick = () => { Kit.sfx.pop(); start('recipe'); };
  $('sillyMode').onclick = () => { Kit.sfx.pop(); start('silly'); };
  $('backBtn').onclick = () => { if (busy) return; Kit.sfx.pop(); mode = null; show('home'); };
})();
</script>
</body>
