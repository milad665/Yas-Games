<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shadow Match">
<meta name="theme-color" content="#fde68a">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/shared/kit.css">
<title>Shadow Match</title>
<style>
  body { background: #ffe9a8; }
  /* the sunny park behind everything (drawn with /shared/scenery.js) */
  .scene { position: absolute; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .scene > div { position: absolute; inset: 0; }
  .sm-rays { animation: sm-turn 80s linear infinite; }
  @keyframes sm-turn { to { transform: rotate(360deg); } }
  .sm-tail { animation: sm-tail 2.4s ease-in-out infinite; }
  @keyframes sm-tail { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
  .sm-sway { animation: sm-sway 5s ease-in-out infinite; }
  @keyframes sm-sway { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
  #game { flex-direction: column; padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); gap: 14px; }
  .top { display: flex; align-items: center; gap: 14px; pointer-events: none; }
  .top .btn { pointer-events: auto; }
  .top .btn { width: 66px; height: 66px; font-size: 32px; }
  .spacer { flex: 1; }
  #stars { font-size: 30px; background: rgba(255,255,255,.7); border-radius: 999px; padding: 6px 18px; min-width: 70px; text-align: center; }

  #board { flex: 1; min-height: 0; position: relative; border-radius: 34px; background: rgba(255,253,245,.7); box-shadow: inset 0 0 0 6px rgba(255,255,255,.85), 0 0 0 3px rgba(58,45,82,.18), 0 10px 30px rgba(146, 64, 14, .15); overflow: hidden; }
  #board.lit { animation: lit 1.2s ease-out; }
  @keyframes lit { 30% { background: rgba(255,255,255,.95); } }
  .slot { position: absolute; translate: -50% -50%; display: grid; place-items: center; border-radius: 50%; }
  .slot .shade { line-height: 1; filter: brightness(0); opacity: .32; transition: filter .6s, opacity .6s; }
  .slot.filled .shade { filter: none; opacity: 1; animation: kit-pop .45s cubic-bezier(.3,1.6,.5,1); }
  .slot.hint { animation: kit-pulse 1s ease-in-out infinite; background: radial-gradient(circle, rgba(253, 224, 71, .6), transparent 70%); }
  .slot.over { background: radial-gradient(circle, rgba(255,255,255,.9), transparent 70%); }

  /* a picnic blanket for the pieces */
  #tray { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; border-radius: 30px; padding: 12px; min-height: 120px; align-items: center;
    background-color: #fff7f2; background-image: linear-gradient(90deg, rgba(255,99,99,.26) 50%, transparent 50%), linear-gradient(rgba(255,99,99,.26) 50%, transparent 50%); background-size: 40px 40px;
    box-shadow: inset 0 0 0 6px rgba(255,255,255,.9), 0 0 0 3px rgba(58,45,82,.18), 0 8px 0 rgba(146, 64, 14, .15); }
  .piece { width: 104px; height: 104px; border-radius: 26px; background: #fff; display: grid; place-items: center; font-size: 66px; line-height: 1; touch-action: none; cursor: grab; box-shadow: 0 5px 0 rgba(146, 64, 14, .2); }
  .piece.gone { visibility: hidden; }
  .dragging { position: fixed; z-index: 40; pointer-events: none; line-height: 1; filter: drop-shadow(0 12px 8px rgba(0,0,0,.25)); }
  .dragging.back { transition: left .3s ease-out, top .3s ease-out; }
</style>
</head>
<body>

<section id="game" class="screen on">
  <div class="scene" aria-hidden="true"><div id="backdrop"></div><div id="decor"></div></div>
  <div class="top">
    <a class="btn" href="../../" aria-label="Back to Yas's Games">🏠</a>
    <div class="spacer"></div>
    <div id="stars">⭐</div>
    <div class="spacer"></div>
    <button id="soundBtn" class="btn" aria-label="Sound on or off">🔊</button>
  </div>
  <div id="board"></div>
  <div id="tray"></div>
</section>

<script src="/shared/lines.js"></script>
<script src="/shared/voice.js"></script>
<script src="/shared/saved.js"></script>
<script src="/shared/kit.js"></script>
<script src="/shared/scenery.js"></script>
<script>
// ---------- a sunny park around the game (decoration only) ----------
(() => {
  if (!self.Scenery || !Scenery.add) return;
  const { face, ol, sky, hillsPath, dots, grassTufts } = Scenery.kit;

  Scenery.addBackdrop('sunny', ['#8fdcff', '#d4f1ff', '#fff2c4'], () => sky('sunny') +
    `<g class="sm-rays" style="transform-origin:280px 60px">${Array.from({ length: 12 }, (_, i) =>
      `<path d="M280 60 L${280 + Math.cos(i * Math.PI / 6) * 1400} ${60 + Math.sin(i * Math.PI / 6) * 1400} L${280 + Math.cos(i * Math.PI / 6 + .16) * 1400} ${60 + Math.sin(i * Math.PI / 6 + .16) * 1400}Z" fill="#fff" opacity=".22"/>`).join('')}</g>` +
    `<path d="${hillsPath(600, 170, 91, 4)}" fill="#c4eba4"/>` +
    `<path d="${hillsPath(690, 110, 93, 3)}" fill="#a0dd80"/>` +
    `<path d="M0 790 Q500 755 1000 792 V1000 H0Z" fill="#7dcc5c"/>` +
    `<path d="M0 910 Q500 890 1000 915 V1000 H0Z" fill="#6cbf4c"/>` +
    grassTufts(60, 37, 795, 990, '#5aae3e') + dots(70, 41, 700, 990, ['#ffffff', '#ffe066', '#ff8ad8', '#ff9a3c'], [3, 6]));

  // a kite with a wavy tail
  Scenery.add('kite', () => [110, 230,
    `<g class="sm-tail" style="transform-origin:55px 116px"><path d="M55 116 Q30 146 56 170 T50 226" stroke="#7a5aa0" stroke-width="3" fill="none"/>` +
    [[42, 142, '#ffd23f'], [56, 172, '#4cd964'], [48, 204, '#7ad6ff']].map(([x, y, c]) => `<path d="M${x} ${y} l-12 -8 v16Z M${x} ${y} l12 -8 v16Z" fill="${c}" ${ol(1.5)}/>`).join('') + `</g>` +
    `<path d="M55 4 L102 60 L55 118 L8 60Z" fill="#ff6fb5"/><path d="M55 4 L102 60 H55Z" fill="#ffd23f"/><path d="M55 60 H8 L55 118Z" fill="#7ad6ff"/>` +
    `<path d="M55 4 L102 60 L55 118 L8 60Z M55 4 V118 M8 60 H102" fill="none" ${ol()}/>` + face(55, 62, .55)]);

  // a hot-air balloon with a happy face
  Scenery.add('hotair', () => [140, 200,
    `<path d="M58 146 L54 170 M82 146 L86 170" stroke="#7a4a25" stroke-width="3"/>` +
    `<path d="M70 6 C20 6 4 50 14 84 C22 114 50 130 58 148 H82 C90 130 118 114 126 84 C136 50 120 6 70 6Z" fill="#ff5a6a" ${ol()}/>` +
    `<path d="M70 7 C50 30 46 110 62 147 H78 C94 110 90 30 70 7Z" fill="#ffd23f"/>` +
    `<path d="M70 6 C20 6 4 50 14 84 C22 114 50 130 58 148 H82 C90 130 118 114 126 84 C136 50 120 6 70 6Z" fill="none" ${ol()}/>` +
    `<ellipse cx="44" cy="40" rx="10" ry="16" fill="#fff" opacity=".35" transform="rotate(20 44 40)"/>` + face(70, 78, .8) +
    `<rect x="50" y="168" width="40" height="28" rx="6" fill="#c98a4a" ${ol()}/><path d="M50 178 H90 M50 186 H90" stroke="#a8692f" stroke-width="3"/>`]);

  const P = (art, x, y, h, o = {}) => ({ art, x, y, h, ...o });
  // only around the edges: the middle of the board stays calm so the shadows are easy to read
  const props = () => [
    P('sun', 28, 6, 15, { at: 'center', tap: 'spin' }),
    P('cloud', 72, 6, 9, { at: 'center', anim: 'drift', tap: 'boing' }),
    P('hotair', 0, 7, 10, { at: 'center', anim: 'across', dur: 40, delay: -12 }),
    ...(innerWidth > 700 ? [P('kite', 60, 1, 11, { at: 'top', anim: 'bob' })] : []),
    P('bush', 8, 101, 12),
    P('sunflower', 3, 101, 22, { tap: 'bloom' }),
    P('sunflower', 90, 101, 18, { tap: 'bloom' }),
  ];
  const giggle = () => [660, 880, 740, 990].forEach((f, i) => Kit.tone(f, .09, { type: 'triangle', vol: .12, delay: i * .07 }));
  function tap(el) {
    if (el.dataset.tap === 'spin') { Scenery.react(el, 't-spin', 900); giggle(); }
    else if (el.dataset.tap === 'bloom') { Scenery.react(el, 't-bloom', 900); Kit.tone(700, .25, { type: 'triangle', vol: .12, to: 1300 }); }
    else { Scenery.react(el, 't-boing', 600); Kit.sfx.boing(); }
  }
  function build() {
    const box = document.getElementById('decor'); box.innerHTML = '';
    Scenery.place(box, props(), innerWidth, innerHeight).forEach(el => {
      if (el.dataset.tap) el.addEventListener('pointerdown', e => { e.stopPropagation(); tap(el); });
    });
  }
  document.getElementById('backdrop').innerHTML = Scenery.backdrop('sunny');
  build();
  let t = 0; addEventListener('resize', () => { clearTimeout(t); t = setTimeout(build, 200); });
})();
</script>
<script>
(() => {
  const { $, rand, pick, shuffle, sleep } = Kit;

  // easy sets have very different shapes; look-alike sets are tricky on purpose
  const EASY = [
    ['🐘', '🦒', '🐌', '🦋', '🐢', '🦀', '🐍', '🦉'],
    ['🚀', '🌙', '⭐', '🪐', '🛸', '☄️'],
    ['🐳', '🐙', '🦀', '🐠', '🦞', '🐚', '🦈'],
    ['🦕', '🌋', '🦴', '🥚', '🌴', '🦖'],
    ['👑', '🏰', '🦄', '🔑', '💍', '🪄'],
    ['🚗', '✈️', '🚲', '🚁', '⛵', '🚂'],
    ['🍌', '🍇', '🍐', '🥕', '🍉', '🍒'],
  ];
  const LOOKALIKE = [
    ['🐶', '🐱', '🐻', '🐰', '🐭', '🐷'],
    ['🍎', '🍅', '🍑', '🍊', '🍋'],
    ['🦕', '🦖', '🐊', '🦎'],
    ['🐄', '🐴', '🐑', '🐐', '🦌'],
    ['🦆', '🐔', '🐧', '🦉', '🦜'],
  ];
  const LEVELS = [
    { n: 3 },
    { n: 4 },
    { n: 4, turn: true },
    { n: 5, size: true },
    { n: 4, alike: true },
    { n: 5, alike: true, turn: true },
    { n: 6, alike: true, size: true },
  ];
  const ROUNDS_PER_LEVEL = 2;

  const save = Kit.store('shadow-match');
  const saved = save.get({ level: 0, stars: 0, rounds: 0 });
  let level = Math.min(saved.level, LEVELS.length - 1);
  let slots = [], misses = {}, busy = false;

  function paintStars() { $('stars').textContent = saved.stars > 10 ? '⭐ × ' + saved.stars : '⭐'.repeat(Math.max(1, saved.stars)); $('stars').style.opacity = saved.stars ? 1 : .45; }

  function newRound() {
    const L = LEVELS[level];
    const set = L.alike ? pick(LOOKALIKE) : pick(EASY);
    const items = shuffle(set).slice(0, Math.min(L.n, set.length));
    const board = $('board'); board.innerHTML = ''; board.classList.remove('lit');
    const W = board.clientWidth, H = board.clientHeight;
    // spread the shadows on a loose grid
    const cols = items.length <= 3 ? items.length : Math.ceil(items.length / 2), rows = Math.ceil(items.length / cols);
    const cell = Math.min(W / cols, H / rows);
    const base = Math.min(cell * .55, 150);
    const spots = shuffle(Array.from({ length: cols * rows }, (_, i) => i)).slice(0, items.length);
    slots = items.map((e, k) => {
      const i = spots[k], c = i % cols, r = Math.floor(i / cols);
      const turn = L.turn && Math.random() < .7 ? pick([90, 180, 270, -45, 45]) : 0;
      const scale = L.size ? pick([.7, 1, 1.3]) : 1;
      const el = document.createElement('div'); el.className = 'slot';
      const x = (c + .5) * W / cols + rand(-cell * .08, cell * .08), y = (r + .5) * H / rows + rand(-cell * .06, cell * .06);
      el.style.left = x + 'px'; el.style.top = y + 'px';
      el.style.width = el.style.height = base * scale * 1.5 + 'px';
      const sh = document.createElement('div'); sh.className = 'shade'; sh.textContent = e;
      sh.style.fontSize = base * scale + 'px'; sh.style.transform = `rotate(${turn}deg)`;
      el.appendChild(sh); board.appendChild(el);
      return { e, el, filled: false, turn, scale };
    });
    misses = {};
    const tray = $('tray'); tray.innerHTML = '';
    for (const e of shuffle(items)) {
      const p = document.createElement('div'); p.className = 'piece pop-in'; p.textContent = e;
      p.addEventListener('pointerdown', ev => drag(ev, p, e));
      tray.appendChild(p);
    }
    busy = false;
  }

  function slotAt(x, y) {
    let best = null, bestD = Infinity;
    for (const s of slots) {
      if (s.filled) continue;
      const r = s.el.getBoundingClientRect(), d = Math.hypot(x - (r.left + r.width / 2), y - (r.top + r.height / 2));
      if (d < Math.max(r.width * .6, 70) && d < bestD) { best = s; bestD = d; }
    }
    return best;
  }

  function drag(ev, piece, e) {
    if (busy || piece.classList.contains('gone')) return;
    ev.preventDefault();
    const pr = piece.getBoundingClientRect();
    const g = document.createElement('div'); g.className = 'dragging'; g.textContent = e; g.style.fontSize = '80px';
    document.body.appendChild(g);
    const place = (x, y) => { g.style.left = (x - 45) + 'px'; g.style.top = (y - 50) + 'px'; };
    place(ev.clientX, ev.clientY);
    piece.classList.add('gone'); Kit.sfx.pop();
    let over = null;
    const move = m => {
      if (m.pointerId !== ev.pointerId) return;
      place(m.clientX, m.clientY);
      const s = slotAt(m.clientX, m.clientY);
      if (s !== over) { over && over.el.classList.remove('over'); over = s; over && over.el.classList.add('over'); }
    };
    const up = async u => {
      if (u.pointerId !== ev.pointerId) return;
      removeEventListener('pointermove', move); removeEventListener('pointerup', up); removeEventListener('pointercancel', up);
      over && over.el.classList.remove('over');
      const s = slotAt(u.clientX, u.clientY);
      if (s && s.e === e) { g.remove(); return fill(s); }
      // not a match: float back to the shelf
      if (s) {
        Kit.sfx.oops(); Kit.flash(s.el, 'wobble'); Kit.say('sm.no');
        misses[e] = (misses[e] || 0) + 1;
        if (misses[e] >= 2) slots.find(x => x.e === e).el.classList.add('hint');
      }
      g.classList.add('back'); g.style.left = (pr.left + pr.width / 2 - 45) + 'px'; g.style.top = (pr.top + pr.height / 2 - 50) + 'px';
      await sleep(300); g.remove(); piece.classList.remove('gone');
    };
    addEventListener('pointermove', move); addEventListener('pointerup', up); addEventListener('pointercancel', up);
  }

  async function fill(s) {
    s.filled = true; s.el.classList.remove('hint'); s.el.classList.add('filled');
    Kit.sfx.ding(); Kit.burstAt(s.el, ['✨', '⭐'], 7, 100);
    if (slots.every(x => x.filled)) return roundDone();
    if (Math.random() < .5) Kit.say(['sm.yes1', 'sm.yes2', 'sm.yes3']);
  }

  async function roundDone() {
    busy = true;
    await sleep(400);
    $('board').classList.add('lit'); Kit.sfx.yay();
    Kit.burstAt($('board'), ['⭐', '🌟', '✨', '🎉'], 22, 260);
    Kit.say(['sm.done1', 'sm.done2']);
    saved.stars++; saved.rounds++;
    let up = false;
    if (saved.rounds >= ROUNDS_PER_LEVEL && level < LEVELS.length - 1) { level++; saved.rounds = 0; up = true; }
    saved.level = level; save.set(saved); paintStars();
    await sleep(2600);
    newRound();
    const L = LEVELS[level];
    if (up) Kit.say(L.alike ? 'sm.lookalike' : L.turn ? 'sm.turned' : 'sm.levelUp');
  }

  Kit.soundButton('soundBtn');
  paintStars();
  addEventListener('resize', () => { if (!busy && !slots.some(s => s.filled)) newRound(); });
  newRound(); Kit.say('sm.intro');
})();
</script>
</body>
</html>
