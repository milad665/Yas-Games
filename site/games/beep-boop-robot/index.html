<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Beep Boop Robot">
<meta name="theme-color" content="#cdeffd">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<title>Beep Boop Robot</title>
<style>
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: none; }
  body {
    font-family: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", system-ui, sans-serif; color: #33415c;
    background:
      radial-gradient(circle, rgba(255,255,255,.55) 2px, transparent 2.5px) 0 0 / 34px 34px,
      linear-gradient(165deg, #cdeffd 0%, #dfe3ff 55%, #f3dcff 100%);
  }
  .screen { position: fixed; inset: 0; display: none; }
  .screen.on { display: flex; }

  /* ---------- buttons ---------- */
  .btn {
    width: 78px; height: 78px; border-radius: 50%; border: none; padding: 0; flex: none;
    position: relative; font-size: 40px; line-height: 1; background: #fff; cursor: pointer; color: inherit; text-decoration: none;
    box-shadow: 0 6px 0 rgba(40,50,90,.18), 0 8px 16px rgba(40,50,90,.12);
    display: grid; place-items: center; touch-action: manipulation; transition: transform .08s, box-shadow .08s, opacity .2s;
  }
  .btn:active { transform: translateY(5px); box-shadow: 0 1px 0 rgba(40,50,90,.18); }
  .btn[disabled] { opacity: .35; pointer-events: none; }
  .corner { position: absolute; top: max(16px, env(safe-area-inset-top)); width: 66px; height: 66px; font-size: 32px; z-index: 5; }
  .corner.left { left: 16px; } .corner.right { right: 16px; }
  .pulse { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { scale: 1; } 50% { scale: 1.16; } }
  .pulse::after {
    content: '👇'; position: absolute; font-size: 44px; top: -54px; left: 50%; translate: -50% 0; z-index: 3;
    animation: point 1.1s ease-in-out infinite; pointer-events: none;
  }
  @keyframes point { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

  /* ---------- robot svg bits ---------- */
  .robot svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .blinky { animation: blinky 1.2s steps(2) infinite; }
  @keyframes blinky { 50% { opacity: .35; } }
  .idle { animation: idle 1.6s ease-in-out infinite; transform-origin: 50% 100%; }
  @keyframes idle { 0%,100% { transform: translateY(0) rotate(0); } 25% { transform: translateY(-6px) rotate(-3deg); } 75% { transform: translateY(-6px) rotate(3deg); } }
  .dance { animation: dance .5s ease-in-out infinite alternate; transform-origin: 50% 100%; }
  @keyframes dance { from { transform: rotate(-12deg) translateY(0); } to { transform: rotate(12deg) translateY(-24px); } }

  /* ---------- game home ---------- */
  #home { flex-direction: column; align-items: center; justify-content: center; gap: 2vh; }
  #home h1 { margin: 0; font-size: clamp(42px, 7.5vw, 84px); text-align: center; line-height: 1.05; }
  #home h1 span { display: inline-block; -webkit-text-stroke: 3px #fff; paint-order: stroke fill; text-shadow: 0 5px 0 rgba(40,50,90,.15); animation: hop 2s ease-in-out infinite; }
  @keyframes hop { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  #homeRobot { width: min(40vh, 300px); height: min(48vh, 360px); }
  .homeBtns { display: flex; gap: 40px; }
  .bigBtn { width: 130px; height: 130px; font-size: 66px; }
  #playBtn { background: #4ade80; }
  #buildBtn { background: #fde047; }

  /* ---------- builder ---------- */
  #build { align-items: center; justify-content: center; gap: 3vw; flex-wrap: wrap; padding: 24px 20px; overflow-y: auto; touch-action: pan-y; }
  #buildRobot { width: min(40vh, 30vw, 320px); height: min(48vh, 36vw, 380px); }
  @media (orientation: portrait) { #buildRobot { width: min(30vh, 280px); height: min(36vh, 330px); margin-top: 60px; } }
  #parts { display: flex; flex-direction: column; gap: 12px; }
  .partRow { display: flex; flex-wrap: wrap; gap: 10px; max-width: 352px; background: rgba(255,255,255,.6); border-radius: 26px; padding: 8px 12px; }
  .opt {
    width: 72px; height: 72px; border-radius: 20px; border: 4px solid transparent; background: #fff; padding: 4px;
    box-shadow: 0 4px 0 rgba(40,50,90,.14); touch-action: manipulation; cursor: pointer;
  }
  .opt.sel { border-color: #3b82f6; transform: scale(1.08); }
  .opt.swatch { border-radius: 50%; border: 5px solid #fff; padding: 0; }
  .opt.swatch.sel { border-color: #33415c; }
  #doneBtn { background: #4ade80; }

  /* ---------- level picker ---------- */
  #levels { flex-direction: column; align-items: center; justify-content: center; padding: 90px 20px 20px; }
  #levelGrid { display: grid; grid-template-columns: repeat(4, auto); gap: clamp(14px, 3vw, 30px); }
  @media (orientation: landscape) { #levelGrid { grid-template-columns: repeat(6, auto); } }
  .lvl { width: 104px; height: 104px; font-size: 44px; font-weight: 900; position: relative; background: #fff; }
  .lvl.done { background: #fde68a; }
  .lvl.locked { background: #e2e8f0; opacity: .6; pointer-events: none; font-size: 36px; }
  .lvl .st { position: absolute; top: -10px; right: -6px; font-size: 32px; }

  /* ---------- play ---------- */
  #play { flex-direction: column; padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); gap: 12px; }
  .topbar { display: flex; align-items: center; gap: 14px; }
  .topbar .btn { width: 66px; height: 66px; font-size: 32px; }
  #lvlBadge { font-size: 34px; font-weight: 900; background: #fff; border-radius: 999px; padding: 6px 22px; box-shadow: 0 5px 0 rgba(40,50,90,.12); }
  .spacer { flex: 1; }
  #boardWrap { flex: 1; min-height: 0; display: grid; place-items: center; }
  #board {
    position: relative; display: grid; gap: 5px; padding: 8px; border-radius: 26px;
    background: #94a3b8; box-shadow: 0 10px 0 rgba(40,50,90,.18), inset 0 0 0 4px rgba(255,255,255,.3);
  }
  .cell { border-radius: 14px; background: #f1f5f9; display: grid; place-items: center; position: relative; line-height: 1; }
  .cell:nth-child(odd) { background: #e6eef8; }
  .cell.goal { background: #dcfce7; box-shadow: inset 0 0 0 4px #4ade80; }
  .cell .goalItem { animation: hop 1.3s ease-in-out infinite; }
  .hintArrow { position: absolute; width: 48%; height: 48%; opacity: .5; }
  #bot { position: absolute; left: 8px; top: 8px; transition: transform .42s cubic-bezier(.4,1.4,.6,1); z-index: 2; pointer-events: none; }
  #bot .flip { width: 100%; height: 100%; transition: transform .2s; }
  #bot.shake .flip { animation: shake .4s; }
  @keyframes shake { 20% { translate: -8px 0; } 40% { translate: 8px 0; } 60% { translate: -5px 0; } 80% { translate: 5px 0; } }

  #strip {
    display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,.7); border-radius: 24px;
    padding: 10px 12px; min-height: 90px;
  }
  #prog { flex: 1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .card {
    width: 62px; height: 62px; border-radius: 16px; border: none; padding: 9px; display: grid; place-items: center;
    box-shadow: 0 4px 0 rgba(40,50,90,.2); touch-action: manipulation; cursor: pointer; transition: transform .15s;
  }
  .card svg { width: 100%; height: 100%; }
  .card.now { transform: scale(1.2) translateY(-6px); box-shadow: 0 0 0 5px #fde047, 0 4px 0 rgba(40,50,90,.2); }
  .card.bad { box-shadow: 0 0 0 5px #ef4444; animation: shake .4s; }
  .card.pop { animation: popIn .25s cubic-bezier(.3,1.6,.5,1); }
  @keyframes popIn { from { scale: 0; } to { scale: 1; } }
  .slot { width: 62px; height: 62px; border-radius: 16px; border: 4px dashed #94a3b8; opacity: .7; }
  #strip .btn { width: 62px; height: 62px; font-size: 30px; }

  #pad { display: flex; justify-content: center; align-items: center; gap: clamp(10px, 2.4vw, 22px); }
  .arrow { width: 96px; height: 96px; border-radius: 26px; padding: 16px; position: relative; }
  .arrow svg { width: 100%; height: 100%; }
  #goBtn { width: 112px; height: 112px; background: #22c55e; margin-left: clamp(10px, 3vw, 40px); }
  #goBtn svg { width: 56%; height: 56%; margin-left: 8%; }

  /* ---------- win ---------- */
  #win { position: fixed; inset: 0; z-index: 20; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 26px; background: rgba(255,250,230,.94); }
  #win.on { display: flex; }
  #winRobot { width: min(34vh, 260px); height: min(40vh, 310px); }
  #winStar { font-size: 90px; animation: spinIn .9s cubic-bezier(.3,1.6,.5,1) both; }
  @keyframes spinIn { from { transform: scale(0) rotate(-200deg); } to { transform: scale(1) rotate(0); } }
  .winBtns { display: flex; gap: 40px; }
  #nextBtn { width: 120px; height: 120px; background: #4ade80; font-size: 60px; }

  .particle { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 50; font-size: 34px; animation: fly 1.1s ease-out forwards; }
  @keyframes fly {
    0% { transform: translate(var(--x), var(--y)) scale(.4); opacity: 1; }
    100% { transform: translate(calc(var(--x) + var(--dx)), calc(var(--y) + var(--dy))) scale(1.2); opacity: 0; }
  }
</style>
</head>
<body>

<!-- GAME HOME -->
<section id="home" class="screen on">
  <a class="btn corner left" href="../../" aria-label="Back to Yas's Games">🏠</a>
  <button id="soundBtn" class="btn corner right" aria-label="Sound on or off">🔊</button>
  <h1 id="title"></h1>
  <div id="homeRobot" class="robot idle"></div>
  <div class="homeBtns">
    <button id="buildBtn" class="btn bigBtn" aria-label="Build your robot">🔧</button>
    <button id="playBtn" class="btn bigBtn" aria-label="Play">▶️</button>
  </div>
</section>

<!-- BUILDER -->
<section id="build" class="screen">
  <button id="doneBtn" class="btn corner left" aria-label="Done">✅</button>
  <div id="buildRobot" class="robot idle"></div>
  <div id="parts"></div>
</section>

<!-- LEVEL PICKER -->
<section id="levels" class="screen">
  <button id="levelsBack" class="btn corner left" aria-label="Back">🏠</button>
  <div id="levelGrid"></div>
</section>

<!-- PLAY -->
<section id="play" class="screen">
  <div class="topbar">
    <button id="playBack" class="btn" aria-label="Back to levels">🏠</button>
    <div id="lvlBadge"></div>
    <div class="spacer"></div>
    <button id="hintBtn" class="btn" aria-label="Hint">💡</button>
  </div>
  <div id="boardWrap"><div id="board"></div></div>
  <div id="strip">
    <div id="prog"></div>
    <button id="undoBtn" class="btn" aria-label="Remove last">↩️</button>
    <button id="clearBtn" class="btn" aria-label="Clear all">🧽</button>
  </div>
  <div id="pad"></div>
</section>

<!-- WIN -->
<section id="win">
  <div id="winStar">⭐</div>
  <div id="winRobot" class="robot dance"></div>
  <div class="winBtns">
    <button id="againBtn" class="btn bigBtn" aria-label="Play again">🔁</button>
    <button id="nextBtn" class="btn" aria-label="Next level">➡️</button>
  </div>
</section>

<script src="/shared/lines.js"></script>
<script src="/shared/voice.js"></script>
<script src="/shared/robot.js"></script>
<script>
(() => {
  // ================= levels =================
  // R = robot start, B = battery (goal), # = rock, . = floor
  const LEVELS = [
    { map: ['R.B'] },
    { map: ['R..B'] },
    { map: ['R', '.', 'B'] },
    { map: ['R..', '##.', '##B'] },
    { map: ['B..', '##.', 'R..'] },
    { map: ['R.#B', '..#.', '....'] },
    { map: ['....B', '.###.', 'R....'] },
    { map: ['R...', '##.#', 'B#..', '....'] },
    { map: ['R.#..', '#...#', '..#..', '.##.B'] },
    { map: ['B...#', '###.#', 'R....'] },
    { map: ['R..#.', '#.##.', '#....', '####B'] },
    { map: ['R#...', '.#.#.', '...#B'] },
  ];
  const ROCKS = ['🪨', '🌵', '📦', '🧱'];
  const DIRS = {
    left:  { dx: -1, dy: 0, rot: 270, color: '#a78bfa', note: 523 },
    up:    { dx: 0, dy: -1, rot: 0,   color: '#34d399', note: 784 },
    down:  { dx: 0, dy: 1,  rot: 180, color: '#fb923c', note: 392 },
    right: { dx: 1, dy: 0,  rot: 90,  color: '#60a5fa', note: 659 },
  };
  const MAX_PROG = 20;

  // ================= robot parts =================
  const COLORS = ['#60a5fa', '#f87171', '#fbbf24', '#34d399', '#c084fc', '#f472b6', '#94a3b8'];
  const PARTS = [
    { key: 'color',   opts: COLORS,                         say: 'rb.color' },
    { key: 'head',    opts: ['square', 'round', 'dome'],    say: 'rb.head' },
    { key: 'eyes',    opts: ['round', 'visor', 'cyclops'],  say: 'rb.eyes' },
    { key: 'antenna', opts: ['ball', 'double', 'bolt', 'none'], say: 'rb.antenna' },
    { key: 'bottom',  opts: ['wheels', 'legs', 'treads'],
      say: { wheels: 'rb.wheels', legs: 'rb.legs', treads: 'rb.treads' } },
  ];

  const $ = id => document.getElementById(id);
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[Math.floor(Math.random() * a.length)];

  // ================= storage =================
  const SAVE_KEY = 'beepBoopRobot.v1';
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(SAVE_KEY)) || {}; } catch (e) { saved = {}; }
  saved.design = Object.assign({ color: '#60a5fa', head: 'square', eyes: 'round', antenna: 'ball', bottom: 'wheels' }, saved.design);
  saved.done = saved.done || [];
  let muted = !!saved.muted;
  function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(saved)); } catch (e) {} }

  // ================= sound =================
  let ac = null;
  function audio() {
    if (!ac) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; ac = new AC(); }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  function tone(freq, dur, { type = 'square', vol = .08, to = null, delay = 0 } = {}) {
    if (muted) return;
    const a = audio(); if (!a) return;
    const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01);
    g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .02);
  }
  const sfx = {
    pop: () => tone(520, .09, { type: 'sine', vol: .18, to: 900 }),
    beep: f => { tone(f, .08); tone(f * 1.5, .08, { delay: .09 }); },
    step: f => tone(f, .14, { type: 'triangle', vol: .16 }),
    bump: () => { tone(140, .25, { type: 'sawtooth', vol: .12, to: 70 }); },
    remove: () => tone(500, .12, { type: 'sine', vol: .15, to: 200 }),
    win: () => [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, .18, { type: 'triangle', vol: .16, delay: i * .1 })),
    boop: () => { tone(880, .07); tone(660, .07, { delay: .08 }); tone(990, .1, { delay: .16 }); },
  };
  function say(...lines) { if (!muted) Voice.say(...lines); }
  document.addEventListener('pointerdown', () => audio());

  function burst(x, y, emojis, n = 14, spread = 200) {
    for (let i = 0; i < n; i++) {
      const p = document.createElement('div'); p.className = 'particle'; p.textContent = pick(emojis);
      const ang = rand(0, Math.PI * 2), dist = rand(spread * .5, spread);
      p.style.setProperty('--x', (x - 17) + 'px'); p.style.setProperty('--y', (y - 17) + 'px');
      p.style.setProperty('--dx', Math.cos(ang) * dist + 'px'); p.style.setProperty('--dy', Math.sin(ang) * dist - 40 + 'px');
      document.body.appendChild(p); setTimeout(() => p.remove(), 1150);
    }
  }

  // ================= drawing the robot =================
  const robotSVG = RobotArt.svg;
  function arrowSVG(dir) {
    return `<svg viewBox="0 0 100 100" style="transform:rotate(${DIRS[dir].rot}deg)"><path d="M50 8 L90 52 H64 V92 H36 V52 H10 Z" fill="#fff" stroke="rgba(0,0,0,.15)" stroke-width="4" stroke-linejoin="round"/></svg>`;
  }
  function paintRobots() {
    const svg = robotSVG(saved.design);
    for (const id of ['homeRobot', 'buildRobot', 'winRobot']) $(id).innerHTML = svg;
    const bot = document.querySelector('#bot .flip'); if (bot) bot.innerHTML = svg;
  }

  // ================= screens =================
  function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); }

  // ---------- home ----------
  const colors = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#3b82f6', '#8b5cf6', '#ec4899'];
  [...'Beep Boop Robot'].forEach((ch, i) => {
    const s = document.createElement('span');
    s.textContent = ch === ' ' ? ' ' : ch;
    s.style.color = colors[i % colors.length]; s.style.animationDelay = (i * .1) + 's';
    $('title').appendChild(s);
  });
  function paintSound() { $('soundBtn').textContent = muted ? '🔇' : '🔊'; }
  paintSound();
  $('soundBtn').onclick = () => { muted = !muted; saved.muted = muted; persist(); paintSound(); sfx.pop(); if (muted) Voice.stop(); };
  $('homeRobot').onclick = () => { sfx.boop(); say(['rb.hi1', 'rb.hi2', 'rb.hi3']); };
  $('buildBtn').onclick = () => { sfx.pop(); openBuilder(); };
  $('playBtn').onclick = () => { sfx.pop(); openLevels(); };

  // ---------- builder ----------
  function openBuilder() {
    renderParts(); show('build');
    say('rb.build');
  }
  function renderParts() {
    const box = $('parts'); box.innerHTML = '';
    for (const part of PARTS) {
      const row = document.createElement('div'); row.className = 'partRow';
      for (const opt of part.opts) {
        const b = document.createElement('button');
        const sel = saved.design[part.key] === opt;
        if (part.key === 'color') { b.className = 'opt swatch' + (sel ? ' sel' : ''); b.style.background = opt; }
        else {
          b.className = 'opt robot' + (sel ? ' sel' : '');
          b.innerHTML = opt === 'none' ? '<div style="font-size:40px">🚫</div>' : robotSVG({ ...saved.design, [part.key]: opt });
        }
        b.setAttribute('aria-label', part.key + ' ' + opt);
        b.onclick = () => {
          saved.design[part.key] = opt; persist();
          sfx.beep(400 + Math.random() * 400);
          say(typeof part.say === 'string' ? part.say : part.say[opt]);
          paintRobots(); renderParts();
          const r = $('buildRobot').getBoundingClientRect();
          burst(r.left + r.width / 2, r.top + r.height / 2, ['⚙️', '✨', '🔩'], 8, 140);
        };
        row.appendChild(b);
      }
      box.appendChild(row);
    }
  }
  $('doneBtn').onclick = () => { sfx.boop(); show('home'); say('rb.newLook'); };

  // ---------- level picker ----------
  function unlocked(i) { return i === 0 || saved.done.includes(i - 1) || saved.done.includes(i); }
  function openLevels() {
    const g = $('levelGrid'); g.innerHTML = '';
    LEVELS.forEach((_, i) => {
      const b = document.createElement('button');
      const done = saved.done.includes(i), open = unlocked(i);
      b.className = 'btn lvl' + (done ? ' done' : '') + (open ? '' : ' locked');
      b.innerHTML = open ? (i + 1) + (done ? '<span class="st">⭐</span>' : '') : '🔒';
      b.onclick = () => { sfx.pop(); startLevel(i); };
      g.appendChild(b);
    });
    show('levels');
  }
  $('levelsBack').onclick = () => { sfx.pop(); show('home'); };

  // ================= play =================
  let cur = 0, L = null, program = [], running = false, fails = 0, showHint = false, cell = 80;

  function parse(map) {
    const rows = map.length, cols = map[0].length, rocks = new Set();
    let start, goal;
    map.forEach((row, y) => [...row].forEach((ch, x) => {
      if (ch === 'R') start = { x, y };
      if (ch === 'B') goal = { x, y };
      if (ch === '#') rocks.add(x + ',' + y);
    }));
    return { rows, cols, rocks, start, goal };
  }
  function blocked(x, y) { return x < 0 || y < 0 || x >= L.cols || y >= L.rows || L.rocks.has(x + ',' + y); }
  // shortest list of moves from start to goal (used for hints and the first-level guide)
  function solve() {
    const key = p => p.x + ',' + p.y, prev = new Map([[key(L.start), null]]), q = [L.start];
    while (q.length) {
      const p = q.shift();
      if (p.x === L.goal.x && p.y === L.goal.y) break;
      for (const [name, d] of Object.entries(DIRS)) {
        const n = { x: p.x + d.dx, y: p.y + d.dy };
        if (blocked(n.x, n.y) || prev.has(key(n))) continue;
        prev.set(key(n), { from: p, dir: name }); q.push(n);
      }
    }
    const path = []; let k = key(L.goal);
    while (prev.get(k)) { const s = prev.get(k); path.unshift({ dir: s.dir, from: s.from }); k = key(s.from); }
    return path;
  }

  function startLevel(i) {
    cur = i; L = parse(LEVELS[i].map); L.solution = solve();
    program = []; running = false; fails = 0; showHint = false;
    $('lvlBadge').textContent = (i + 1) + ' / ' + LEVELS.length;
    show('play');
    renderBoard(); renderProg();
    if (i === 0) say('rb.intro');
    else say(['rb.go1', 'rb.go2', 'rb.go3']);
  }

  function renderBoard() {
    const wrap = $('boardWrap').getBoundingClientRect();
    cell = Math.floor(Math.min((wrap.width - 30) / L.cols, (wrap.height - 30) / L.rows, 130));
    cell = Math.max(44, cell);
    const b = $('board');
    b.style.gridTemplateColumns = `repeat(${L.cols}, ${cell}px)`;
    b.style.gridTemplateRows = `repeat(${L.rows}, ${cell}px)`;
    b.innerHTML = '';
    const hintAt = new Map();
    if (showHint) L.solution.forEach(s => hintAt.set(s.from.x + ',' + s.from.y, s.dir));
    for (let y = 0; y < L.rows; y++) for (let x = 0; x < L.cols; x++) {
      const c = document.createElement('div'); c.className = 'cell';
      c.style.fontSize = Math.round(cell * .62) + 'px';
      if (L.rocks.has(x + ',' + y)) c.textContent = ROCKS[(x * 7 + y * 3 + cur) % ROCKS.length];
      if (x === L.goal.x && y === L.goal.y) { c.classList.add('goal'); c.innerHTML = '<span class="goalItem">🔋</span>'; }
      const h = hintAt.get(x + ',' + y);
      if (h) { const a = document.createElement('div'); a.className = 'hintArrow'; a.innerHTML = arrowSVG(h).replace('fill="#fff"', `fill="${DIRS[h].color}"`); c.appendChild(a); }
      b.appendChild(c);
    }
    const bot = document.createElement('div'); bot.id = 'bot';
    bot.style.width = bot.style.height = cell + 'px';
    bot.innerHTML = '<div class="flip robot"></div>';
    b.appendChild(bot);
    paintRobots();
    placeBot(L.start, false);
  }
  function placeBot(p, animate = true, partial = null) {
    const bot = $('bot'); if (!bot) return;
    if (!animate) bot.style.transition = 'none';
    let x = p.x, y = p.y;
    if (partial) { x += partial.dx * .3; y += partial.dy * .3; }
    bot.style.transform = `translate(${x * (cell + 5)}px, ${y * (cell + 5)}px)`;
    if (!animate) { void bot.offsetWidth; bot.style.transition = ''; }
  }
  function face(dir) {
    const f = document.querySelector('#bot .flip');
    if (f && (dir === 'left' || dir === 'right')) f.style.transform = dir === 'left' ? 'scaleX(-1)' : '';
  }

  // ---------- program strip ----------
  function renderProg(popLast = false) {
    const p = $('prog'); p.innerHTML = '';
    program.forEach((dir, i) => {
      const c = document.createElement('button');
      c.className = 'card' + (popLast && i === program.length - 1 ? ' pop' : '');
      c.style.background = DIRS[dir].color;
      c.innerHTML = arrowSVG(dir);
      c.onclick = () => { if (running) return; program.splice(i, 1); sfx.remove(); renderProg(); };
      p.appendChild(c);
    });
    if (program.length < MAX_PROG) { const s = document.createElement('div'); s.className = 'slot'; p.appendChild(s); }
    $('undoBtn').disabled = $('clearBtn').disabled = !program.length || running;
    $('goBtn').disabled = !program.length || running;
    guide();
  }
  // first two levels: show exactly which button to tap next
  function guide() {
    document.querySelectorAll('.pulse').forEach(e => e.classList.remove('pulse'));
    if (cur > 1 || running) return;
    const sol = L.solution.map(s => s.dir);
    if (!program.every((d, i) => d === sol[i])) return;
    if (program.length < sol.length) $('arrow-' + sol[program.length]).classList.add('pulse');
    else $('goBtn').classList.add('pulse');
  }

  // arrow pad
  for (const dir of Object.keys(DIRS)) {
    const b = document.createElement('button');
    b.className = 'btn arrow'; b.id = 'arrow-' + dir;
    b.style.background = DIRS[dir].color;
    b.innerHTML = arrowSVG(dir);
    b.setAttribute('aria-label', dir);
    b.onclick = () => {
      if (running || program.length >= MAX_PROG) return;
      program.push(dir); sfx.beep(DIRS[dir].note); renderProg(true);
    };
    $('pad').appendChild(b);
  }
  const go = document.createElement('button');
  go.className = 'btn'; go.id = 'goBtn'; go.setAttribute('aria-label', 'Go');
  go.innerHTML = '<svg viewBox="0 0 100 100"><path d="M20 10 L90 50 L20 90 Z" fill="#fff" stroke="#fff" stroke-width="10" stroke-linejoin="round"/></svg>';
  go.onclick = run;
  $('pad').appendChild(go);

  $('undoBtn').onclick = () => { if (running || !program.length) return; program.pop(); sfx.remove(); renderProg(); };
  $('clearBtn').onclick = () => { if (running || !program.length) return; program = []; sfx.remove(); renderProg(); };
  $('hintBtn').onclick = () => { if (running) return; sfx.pop(); showHint = true; renderBoard(); say('rb.followArrows'); };
  $('playBack').onclick = () => { if (running) return; sfx.pop(); openLevels(); };

  // ---------- running the program ----------
  async function run() {
    if (running || !program.length) return;
    running = true; renderProg();
    const cards = [...document.querySelectorAll('#prog .card')];
    let pos = { ...L.start }, passedGoal = -1;
    sfx.boop(); await sleep(350);
    for (let i = 0; i < program.length; i++) {
      const dir = program[i], d = DIRS[dir];
      cards.forEach((c, j) => c.classList.toggle('now', j === i));
      face(dir);
      const nx = pos.x + d.dx, ny = pos.y + d.dy;
      if (blocked(nx, ny)) {
        placeBot(pos, true, d); sfx.bump(); $('bot').classList.add('shake');
        cards[i].classList.remove('now'); cards[i].classList.add('bad');
        await sleep(250); placeBot(pos);
        say(['rb.bump1', 'rb.bump2', 'rb.bump3']);
        await sleep(1300);
        $('bot').classList.remove('shake');
        return tryAgain(cards);
      }
      pos = { x: nx, y: ny };
      placeBot(pos); sfx.step(d.note);
      await sleep(520);
      if (pos.x === L.goal.x && pos.y === L.goal.y) passedGoal = i;
    }
    cards.forEach(c => c.classList.remove('now'));
    if (pos.x === L.goal.x && pos.y === L.goal.y) return win();
    if (passedGoal >= 0) {
      // reached the battery but kept walking: mark the extra arrows
      cards.slice(passedGoal + 1).forEach(c => c.classList.add('bad'));
      sfx.bump(); $('bot').classList.add('shake');
      say(['rb.tooMany1', 'rb.tooMany2']);
      await sleep(1600);
      $('bot').classList.remove('shake');
    } else {
      say(['rb.more1', 'rb.more2']);
      await sleep(1400);
    }
    tryAgain(cards);
  }
  function tryAgain(cards) {
    fails++;
    cards.forEach(c => c.classList.remove('now', 'bad'));
    face('right'); placeBot(L.start);
    running = false;
    if (fails >= 2 && !showHint) { showHint = true; setTimeout(() => { renderBoard(); say('rb.help'); }, 500); }
    renderProg();
  }
  function win() {
    sfx.win();
    const r = $('bot').getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, ['⚡', '⭐', '✨', '🔋', '🎉'], 18, 220);
    if (!saved.done.includes(cur)) { saved.done.push(cur); persist(); }
    say(['rb.win1', 'rb.win2', 'rb.win3']);
    setTimeout(() => {
      running = false;
      $('nextBtn').textContent = cur === LEVELS.length - 1 ? '🏆' : '➡️';
      $('win').classList.add('on');
      burst(innerWidth / 2, innerHeight / 3, ['⭐', '🌟', '✨', '🎉'], 24, 300);
    }, 1100);
  }
  $('againBtn').onclick = () => { sfx.pop(); $('win').classList.remove('on'); startLevel(cur); };
  $('nextBtn').onclick = () => {
    sfx.pop(); $('win').classList.remove('on');
    if (cur < LEVELS.length - 1) startLevel(cur + 1);
    else { openLevels(); say('rb.allDone'); burst(innerWidth / 2, innerHeight / 2, ['🏆', '⭐', '🎉', '🤖'], 30, 320); }
  };

  addEventListener('resize', () => { if ($('play').classList.contains('on') && !running) renderBoard(); });

  paintRobots();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('dblclick', e => e.preventDefault());
  document.addEventListener('contextmenu', e => e.preventDefault());
})();
</script>
</body>
</html>
